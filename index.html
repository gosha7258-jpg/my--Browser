
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MyBrowser Desktop</title>
<style>
:root {
  --accent:#ffd55a;
  --panel:rgba(13,14,20,.92);
  --border:rgba(255,220,120,.35);
}
* {box-sizing:border-box}
body {
  margin:0;
  color:white;
  font:14px Arial,sans-serif;
  overflow:hidden;
  background:#100909 url("https://wallpapercave.com/wp/wp15347483.png")
    center/cover fixed no-repeat;
}
body:before {
  content:"";
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.25);
  pointer-events:none;
}
button,input,textarea {font:inherit}
button {cursor:pointer}
#desktop {
  position:absolute;
  top:20px;
  left:20px;
  display:grid;
  grid-template-columns:repeat(3,85px);
  gap:18px;
}
.app {
  width:85px;
  padding:12px 4px;
  text-align:center;
  border:1px solid transparent;
  border-radius:12px;
  cursor:pointer;
}
.app:hover {
  background:rgba(255,255,255,.12);
  border-color:var(--border);
}
.app .symbol {
  font-size:32px;
  display:block;
  margin-bottom:8px;
}
#dock {
  position:fixed;
  bottom:20px;
  left:50%;
  transform:translateX(-50%);
  display:flex;
  gap:10px;
  align-items:center;
  padding:10px 16px;
  background:rgba(10,11,17,.86);
  border:1px solid var(--border);
  border-radius:18px;
  backdrop-filter:blur(15px);
  z-index:9999;
}
#dock button {
  font-size:24px;
  color:white;
  background:none;
  border:0;
  border-radius:9px;
  padding:6px 9px;
}
#dock button:hover {background:#ffffff22}
#clock {white-space:nowrap;color:var(--accent)}
.window {
  position:absolute;
  width:700px;
  height:470px;
  max-width:95vw;
  max-height:80vh;
  top:12%;
  left:25%;
  display:flex;
  flex-direction:column;
  background:var(--panel);
  border:1px solid var(--border);
  border-radius:13px;
  overflow:hidden;
  box-shadow:0 20px 70px #000a;
  backdrop-filter:blur(18px);
}
.titlebar {
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:11px 14px;
  background:#ffffff12;
  cursor:move;
  user-select:none;
}
.titlebar button {
  color:white;
  background:#ffffff20;
  border:0;
  border-radius:5px;
  padding:5px 10px;
}
.titlebar button:hover {background:#b42d36}
.content {
  flex:1;
  min-height:0;
  display:flex;
  flex-direction:column;
  padding:15px;
  gap:10px;
}
.toolbar {display:flex;gap:7px}
.toolbar button,.action {
  background:#ffffff16;
  color:white;
  border:1px solid #ffffff20;
  border-radius:7px;
  padding:9px 12px;
}
.toolbar input,.field {
  flex:1;
  min-width:0;
  background:#ffffff13;
  border:1px solid #ffffff25;
  border-radius:7px;
  padding:10px;
  color:white;
  outline:none;
}
.toolbar input:focus,.field:focus {
  border-color:var(--accent);
}
iframe {
  flex:1;
  width:100%;
  border:0;
  background:white;
  border-radius:7px;
}
textarea {
  width:100%;
  flex:1;
  resize:none;
  color:white;
  background:#ffffff0d;
  border:1px solid #ffffff25;
  border-radius:8px;
  padding:14px;
  outline:none;
}
#terminal-output {
  flex:1;
  overflow:auto;
  font:14px monospace;
  color:#9cf6bc;
  white-space:pre-wrap;
}
.calc {
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:8px;
}
.calc button {
  padding:18px;
  border:0;
  border-radius:8px;
  background:#ffffff19;
  color:white;
  font-size:20px;
}
.calc button:hover {background:#ffffff33}
#display {font-size:24px;text-align:right}
</style>
</head>
<body>

<div id="desktop">
  <div class="app" onclick="openApp('browser')"><span class="symbol">🌐</span>Browser</div>
  <div class="app" onclick="openApp('files')"><span class="symbol">📁</span>Files</div>
  <div class="app" onclick="openApp('notes')"><span class="symbol">📝</span>Text Editor</div>
  <div class="app" onclick="openApp('terminal')"><span class="symbol">⌨️</span>Terminal</div>
  <div class="app" onclick="openApp('calculator')"><span class="symbol">🧮</span>Calculator</div>
  <div class="app" onclick="openApp('settings')"><span class="symbol">⚙️</span>Settings</div>
  <div class="app" onclick="openApp('about')"><span class="symbol">⭐</span>About</div>
</div>

<div id="windows"></div>

<div id="dock">
  <button onclick="openApp('about')" title="Home">🏠</button>
  <button onclick="openApp('files')" title="Files">📁</button>
  <button onclick="openApp('terminal')" title="Terminal">⌨️</button>
  <button onclick="openApp('browser')" title="Browser">🌐</button>
  <button onclick="openApp('notes')" title="Notes">📝</button>
  <button onclick="openApp('settings')" title="Settings">⚙️</button>
  <span id="clock"></span>
</div>

<script>
let topZ=10;
let count=0;
const titles={
  browser:"🌐 MyBrowser",
  files:"📁 Files",
  notes:"📝 Text Editor",
  terminal:"⌨️ Terminal",
  calculator:"🧮 Calculator",
  settings:"⚙️ Settings",
  about:"⭐ About MyBrowser"
};

function openApp(type){
  const id="win"+(++count);
  const w=document.createElement("div");
  w.className="window";
  w.id=id;
  w.style.left=(15+count%5*5)+"%";
  w.style.top=(10+count%5*4)+"%";
  w.style.zIndex=++topZ;

  w.innerHTML=`
    <div class="titlebar">
      <strong>${titles[type]}</strong>
      <button onclick="document.getElementById('${id}').remove()">✕</button>
    </div>
    <div class="content"></div>`;

  document.getElementById("windows").appendChild(w);
  w.addEventListener("pointerdown",()=>w.style.zIndex=++topZ);
  makeDraggable(w);

  const area=w.querySelector(".content");

  if(type==="browser") browserApp(area);
  if(type==="notes") notesApp(area);
  if(type==="terminal") terminalApp(area);
  if(type==="calculator") calculatorApp(area);
  if(type==="settings") settingsApp(area);
  if(type==="files") {
    area.innerHTML="<h2>📁 My Files</h2><p>This is a web desktop. It cannot access your computer's actual files.</p><button class='action' id='upload'>Choose a local file</button><p id='fileinfo'></p>";
    area.querySelector("#upload").onclick=()=>{
      const picker=document.createElement("input");
      picker.type="file";
      picker.onchange=()=>{
        area.querySelector("#fileinfo").textContent=
          picker.files[0]?.name || "No file selected";
      };
      picker.click();
    };
  }
  if(type==="about"){
    area.innerHTML="<h1>MyBrowser Desktop</h1><p>A custom desktop website inspired by NautilusOS.</p><p>Features: draggable windows, browser, notes, calculator, settings and a simulated terminal.</p>";
  }
}

function makeDraggable(w){
  const bar=w.querySelector(".titlebar");
  let active=false,dx=0,dy=0;
  bar.addEventListener("pointerdown",e=>{
    if(e.target.tagName==="BUTTON")return;
    active=true;
    dx=e.clientX-w.offsetLeft;
    dy=e.clientY-w.offsetTop;
    bar.setPointerCapture(e.pointerId);
  });
  bar.addEventListener("pointermove",e=>{
    if(!active)return;
    w.style.left=Math.max(0,Math.min(
      innerWidth-100,e.clientX-dx))+"px";
    w.style.top=Math.max(0,Math.min(
      innerHeight-80,e.clientY-dy))+"px";
  });
  bar.addEventListener("pointerup",()=>active=false);
  bar.addEventListener("pointercancel",()=>active=false);
}

function browserApp(area){
  area.innerHTML=`
    <div class="toolbar">
      <button id="home">⌂</button>
      <input id="address" placeholder="Search or enter a URL">
      <button id="go">Go</button>
      <button id="external" title="Open in a normal tab">↗</button>
    </div>
    <p id="browserhelp" style="color:#ddd;margin:0">
      Enter a website URL. Some websites block embedded viewing.
    </p>
    <iframe title="Web page" src="about:blank"></iframe>`;

  const address=area.querySelector("#address");
  const frame=area.querySelector("iframe");
  let current="";

  function navigate(){
    let value=address.value.trim();
    if(!value)return;
    if(/^https?:\/\//i.test(value)){
      current=value;
    }else if(value.includes(".")&&!value.includes(" ")){
      current="https://"+value;
    }else{
      current="https://www.google.com/search?q="+
        encodeURIComponent(value);
    }
    frame.src=current;
  }

  area.querySelector("#go").onclick=navigate;
  address.onkeydown=e=>{if(e.key==="Enter")navigate()};
  area.querySelector("#home").onclick=()=>{
    current="";
    address.value="";
    frame.src="about:blank";
  };
  area.querySelector("#external").onclick=()=>{
    if(current)window.open(current,"_blank","noopener,noreferrer");
  };
}

function notesApp(area){
  area.innerHTML=`
    <p>Notes are saved in this browser.</p>
    <textarea placeholder="Start typing..."></textarea>
    <button class="action" id="save">Save notes</button>`;
  const input=area.querySelector("textarea");
  input.value=localStorage.getItem("mybrowser-notes")||"";
  area.querySelector("#save").onclick=()=>{
    localStorage.setItem("mybrowser-notes",input.value);
    alert("Notes saved!");
  };
}

function terminalApp(area){
  area.innerHTML=`
    <div id="terminal-output">MyBrowser Terminal
Type help to see commands.
This is a simulated terminal, not a system shell.

</div>
    <input class="field" placeholder="Enter a command">`;
  const output=area.querySelector("#terminal-output");
  const input=area.querySelector("input");
  input.onkeydown=e=>{
    if(e.key!=="Enter")return;
    const command=input.value.trim().toLowerCase();
    input.value="";
    if(command==="clear"){
      output.textContent="";
      return;
    }
    let result={
      help:"Commands: help, date, whoami, echo TEXT, clear",
      date:new Date().toString(),
      whoami:"mybrowser-user"
    }[command];
    if(command.startsWith("echo "))result=command.slice(5);
    output.textContent+="> "+command+"\n"+
      (result??"Unknown command")+"\n\n";
    output.scrollTop=output.scrollHeight;
  };
}

function calculatorApp(area){
  area.innerHTML=`
    <input class="field" id="display" readonly value="0">
    <div class="calc"></div>`;
  const display=area.querySelector("#display");
  const grid=area.querySelector(".calc");
  let expression="";
  for(const key of ["7","8","9","/","4","5","6","*",
                     "1","2","3","-","C","0","=","+"]){
    const button=document.createElement("button");
    button.textContent=key;
    button.onclick=()=>{
      if(key==="C")expression="";
      else if(key==="="){
        try{
          if(!/^[0-9+\-*/. ()]+$/.test(expression))
            throw Error("Invalid expression");
          expression=String(Function(
            '"use strict";return ('+expression+')'
          )());
        }catch{
          expression="Error";
        }
      }else{
        if(expression==="Error")expression="";
        expression+=key;
      }
      display.value=expression||"0";
    };
    grid.appendChild(button);
  }
}

function settingsApp(area){
  area.innerHTML=`
    <h2>Appearance</h2>
    <p>Choose your accent color:</p>
    <div class="toolbar">
      <button data-color="#ffd55a">Yellow</button>
      <button data-color="#82d9c8">Mint</button>
      <button data-color="#ff6666">Red</button>
      <button data-color="#bba0ff">Purple</button>
    </div>`;
  area.querySelectorAll("[data-color]").forEach(button=>{
    button.onclick=()=>{
      document.documentElement.style.setProperty(
        "--accent",button.dataset.color
      );
      localStorage.setItem("mybrowser-accent",button.dataset.color);
    };
  });
}

const savedColor=localStorage.getItem("mybrowser-accent");
if(savedColor)
  document.documentElement.style.setProperty("--accent",savedColor);

function updateClock(){
  document.getElementById("clock").textContent=
    new Date().toLocaleTimeString([],{
      hour:"numeric",minute:"2-digit"
    });
}
updateClock();
setInterval(updateClock,1000);
</script>
</body>
</html>
