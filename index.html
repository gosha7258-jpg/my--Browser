
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MyBrowser // Desktop</title>
<link rel="icon" id="site-favicon" href="data:,">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;800&family=Share+Tech+Mono&display=swap" rel="stylesheet">

<style>
:root {
  --accent:#ffe65c;
  --glass:rgba(9,11,16,.95);
}
* {box-sizing:border-box}
body {
  margin:0;
  overflow:hidden;
  font-family:Arial,sans-serif;
  color:white;
  background:#09090b
    url("https://wallpapercave.com/wp/wp15347483.png")
    center/cover fixed no-repeat;
}
body::before {
  content:"";
  position:fixed;
  inset:0;
  background:#0005;
  pointer-events:none;
}
button,input,textarea,select {font:inherit}
button {cursor:pointer}
button:focus-visible,input:focus-visible,
select:focus-visible,textarea:focus-visible {
  outline:2px solid var(--accent);
}
#desktop {
  position:absolute;
  top:18px;
  left:18px;
  display:grid;
  grid-template-columns:repeat(3,90px);
  gap:13px;
}
.app {
  padding:10px 4px;
  text-align:center;
  border:1px solid transparent;
  border-radius:12px;
  cursor:pointer;
  font-size:12px;
  text-shadow:0 1px 5px #000;
}
.app:hover {
  background:#ffffff20;
  border-color:#ffe65c66;
}
.symbol {
  display:block;
  font-size:32px;
  margin-bottom:8px;
}

/* TASKBAR */
#dock {
  position:fixed;
  left:50%;
  bottom:17px;
  transform:translateX(-50%);
  display:flex;
  align-items:center;
  gap:7px;
  padding:9px 14px;
  max-width:96vw;
  background:#08090eea;
  border:1px solid #ffe65c99;
  border-radius:13px;
  box-shadow:0 0 25px #ffc40033;
  backdrop-filter:blur(15px);
  z-index:9000;
}
#dock button {
  display:grid;
  place-items:center;
  width:37px;
  height:37px;
  background:none;
  border:0;
  border-radius:8px;
  color:var(--accent);
  transition:.2s;
}
#dock button:hover {
  background:#ffe65c22;
  box-shadow:0 0 12px #ffd40055;
  transform:translateY(-3px);
}
#dock svg {
  width:22px;
  height:22px;
  fill:none;
  stroke:currentColor;
  stroke-width:1.8;
  stroke-linecap:round;
  stroke-linejoin:round;
}
.system-label,#clock {
  font:10px Orbitron,monospace;
  color:var(--accent);
  text-shadow:0 0 9px #ffc400;
  white-space:nowrap;
}
.system-label {margin-right:8px}
#clock {margin-left:8px}

/* WINDOWS */
.window {
  position:absolute;
  top:12%;
  left:23%;
  width:720px;
  height:480px;
  max-width:96vw;
  max-height:78vh;
  display:flex;
  flex-direction:column;
  overflow:hidden;
  background:var(--glass);
  border:1px solid #ffe65c88;
  border-radius:12px;
  box-shadow:0 20px 65px #000b,0 0 20px #ffc40015;
  backdrop-filter:blur(18px);
}
.titlebar {
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:12px 14px;
  background:#ffffff10;
  font:12px Orbitron,monospace;
  color:var(--accent);
  cursor:move;
  user-select:none;
  touch-action:none;
}
.titlebar button {
  border:0;
  background:#ffffff20;
  color:white;
  border-radius:5px;
  padding:5px 10px;
}
.titlebar button:hover {background:#b52935}
.content {
  display:flex;
  flex-direction:column;
  flex:1;
  min-height:0;
  padding:15px;
  gap:10px;
  overflow:auto;
}
.toolbar {display:flex;gap:7px;flex-wrap:wrap}
.toolbar button,.action {
  padding:9px 12px;
  background:#ffffff17;
  border:1px solid #ffffff24;
  border-radius:7px;
  color:white;
}
.toolbar button:hover,.action:hover {
  border-color:var(--accent);
}
.field,.toolbar input {
  min-width:0;
  flex:1;
  padding:10px;
  background:#ffffff12;
  border:1px solid #ffffff30;
  border-radius:7px;
  color:white;
  outline:none;
}
select.field option {background:#15161b}
iframe {
  width:100%;
  flex:1;
  min-height:150px;
  border:0;
  border-radius:6px;
  background:white;
}
textarea {
  flex:1;
  min-height:100px;
  resize:none;
  background:#ffffff0c;
  border:1px solid #ffffff30;
  border-radius:7px;
  padding:12px;
  color:white;
}
.calc {
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:8px;
}
.calc button {
  padding:17px;
  border:0;
  border-radius:7px;
  background:#ffffff19;
  color:white;
  font-size:19px;
}
#terminal-output {
  flex:1;
  overflow:auto;
  white-space:pre-wrap;
  font:14px "Share Tech Mono",monospace;
  color:#ffe65c;
}

/* TAB CUSTOMIZATION APP */
.tab-panel {
  border:1px solid #ffe65c55;
  background:#101116;
  border-radius:12px;
  padding:16px;
}
.tab-heading {
  font:14px Orbitron,monospace;
  color:#ffe65c;
  margin:0 0 12px;
}
.tab-label {
  font:11px Orbitron,monospace;
  color:#d4bb69;
  margin:14px 0 7px;
}
.tab-preview-shell {
  background:#22252e;
  border-radius:12px;
  padding:10px 10px 0;
}
.tab-preview {
  display:flex;
  align-items:center;
  gap:9px;
  width:min(270px,100%);
  padding:12px;
  background:#353943;
  border-radius:10px 10px 0 0;
  border-top:2px solid #ffe65c;
  font-size:13px;
}
.tab-preview img {
  width:19px;
  height:19px;
  object-fit:contain;
}
.tab-preview span {
  flex:1;
  overflow:hidden;
  white-space:nowrap;
  text-overflow:ellipsis;
}
.tab-note {
  font-size:12px;
  color:#aab0bc;
  line-height:1.5;
}
.tab-actions {
  display:flex;
  gap:10px;
  margin-top:15px;
}
.tab-actions button {flex:1}
.primary-action {
  background:#ffe65c;
  color:#15120a;
  border:0;
  border-radius:7px;
  padding:11px;
  font-weight:bold;
}
.primary-action:hover {background:#fff0a2}
#tab-feedback {
  color:#ffe65c;
  font-size:12px;
  min-height:16px;
}
@media(max-width:700px) {
  .system-label {display:none}
  #dock {gap:2px;padding:7px}
  #dock button {width:32px}
  .window {left:2%!important;top:8%!important}
}

/* CINEMATIC REBOOT */
#md-boot {
  position:fixed;
  inset:0;
  z-index:999999;
  overflow:hidden;
  background:#050507;
  color:#ffe65c;
  font-family:"Share Tech Mono",monospace;
  transition:opacity .9s ease;
}
#md-boot::before {
  content:"";
  position:absolute;
  inset:0;
  z-index:15;
  pointer-events:none;
  background:
    repeating-linear-gradient(
      0deg,#0006 0px,#0006 1px,
      transparent 2px,transparent 4px
    ),
    radial-gradient(
      ellipse at center,
      transparent 25%,#000a 100%
    );
}
#md-boot::after {
  content:"";
  position:absolute;
  inset:-100% 0;
  pointer-events:none;
  background:linear-gradient(
    transparent 47%,
    #ffd40012 50%,
    transparent 53%
  );
  animation:screenSweep 4s linear infinite;
}
.boot-logs {
  position:absolute;
  top:20px;
  left:22px;
  max-width:80vw;
  font-size:clamp(11px,1.25vw,16px);
  line-height:1.55;
  letter-spacing:1.4px;
  white-space:pre-wrap;
  color:#ffe86d;
  text-shadow:0 0 9px #ffc40088;
  z-index:5;
}
.boot-cursor {
  display:inline-block;
  width:9px;
  height:16px;
  background:#ffe65c;
  vertical-align:middle;
  box-shadow:0 0 10px #ffe000;
  animation:cursorBlink .7s steps(1) infinite;
}
.boot-right {
  position:absolute;
  right:20px;
  top:20px;
  text-align:right;
  font-size:12px;
  line-height:1.5;
  color:#d8b83c;
  z-index:5;
}
.boot-center {
  position:absolute;
  inset:0;
  display:grid;
  place-items:center;
  padding:20px;
  z-index:4;
}
#boot-main {
  position:relative;
  font-family:Orbitron,monospace;
  font-weight:800;
  font-size:clamp(23px,5.2vw,82px);
  letter-spacing:5px;
  text-align:center;
  color:#fff5ac;
  white-space:nowrap;
  text-shadow:
    0 0 4px #fff,
    0 0 12px #ffe600,
    0 0 28px #ffd000,
    0 0 65px #ffb900,
    0 0 110px #ff9a00;
  animation:textFlicker 2.2s infinite,
            textJitter 3s infinite;
}
#boot-main::before,
#boot-main::after {
  content:attr(data-text);
  position:absolute;
  inset:0;
  opacity:0;
  pointer-events:none;
}
#boot-main::before {
  color:#fff5b0;
  text-shadow:-9px 0 #ffbd00;
  animation:glitchSliceA 1.1s infinite;
}
#boot-main::after {
  color:white;
  text-shadow:9px 0 #ff9f00;
  animation:glitchSliceB 1.4s infinite;
}
.boot-bottom {
  position:absolute;
  right:22px;
  bottom:23px;
  z-index:5;
  text-align:right;
  color:#e6c74d;
  font-size:12px;
  letter-spacing:1.6px;
  text-shadow:0 0 10px #ffcc0088;
}
.boot-lowerlogs {
  position:absolute;
  bottom:22px;
  left:22px;
  z-index:5;
  font-size:12px;
  line-height:1.5;
  color:#d6b43d;
}
.glitch-strip {
  position:absolute;
  z-index:7;
  left:0;
  width:100%;
  height:4px;
  opacity:0;
  background:linear-gradient(
    90deg,transparent,#ffdd00,
    #fff8a5,#ffb800,transparent
  );
  box-shadow:0 0 20px #ffcc00;
  pointer-events:none;
}
.glitch-strip:nth-child(1) {
  top:32%;
  animation:stripGlitch .8s steps(2) infinite;
}
.glitch-strip:nth-child(2) {
  top:49%;
  animation:stripGlitch 1.1s steps(2) infinite .3s;
}
.glitch-strip:nth-child(3) {
  top:62%;
  animation:stripGlitch .65s steps(2) infinite .15s;
}
#md-boot.intense .glitch-strip {
  animation-duration:.18s;
}
#md-boot.intense #boot-main {
  animation-duration:.25s;
}
#md-boot.failed {
  background:#120205;
  box-shadow:inset 0 0 180px #ff000077;
}
#md-boot.failed #boot-main {
  color:#ff8080;
  text-shadow:
    0 0 8px red,
    0 0 25px red,
    0 0 70px #ff0000;
}
#md-boot.failed #boot-main::before,
#md-boot.failed #boot-main::after {
  color:#ff5555;
  text-shadow:8px 0 #f00;
}
#md-boot.failed .glitch-strip {
  background:#ff2538;
  box-shadow:0 0 30px red;
}
#md-boot.failed .boot-bottom {color:#ff5151}
#md-boot.success #boot-main {
  color:#fff7a6;
  text-shadow:
    0 0 8px white,
    0 0 25px #ffdd00,
    0 0 65px #ffb000;
}
@keyframes cursorBlink {50%{opacity:0}}
@keyframes screenSweep {
  to{transform:translateY(100%)}
}
@keyframes textFlicker {
  0%,88%,92%,97%,100%{opacity:1}
  89%,95%{opacity:.4}
  90%,96%{opacity:.85}
}
@keyframes textJitter {
  0%,85%,100%{transform:translate(0)}
  86%{transform:translate(-5px,2px)}
  88%{transform:translate(7px,-2px)}
  90%{transform:translate(-3px,1px)}
}
@keyframes glitchSliceA {
  0%,72%,100% {
    opacity:0;
    clip-path:inset(100% 0 0 0);
  }
  74% {
    opacity:.95;
    transform:translate(-12px);
    clip-path:inset(15% 0 62% 0);
  }
  79% {
    opacity:.85;
    transform:translate(9px);
    clip-path:inset(58% 0 20% 0);
  }
  83%{opacity:0}
}
@keyframes glitchSliceB {
  0%,66%,100% {
    opacity:0;
    clip-path:inset(0 0 100% 0);
  }
  68% {
    opacity:.9;
    transform:translate(13px);
    clip-path:inset(42% 0 34% 0);
  }
  73% {
    opacity:.8;
    transform:translate(-9px);
    clip-path:inset(76% 0 8% 0);
  }
  77%{opacity:0}
}
@keyframes stripGlitch {
  0%,65%,100% {
    opacity:0;
    transform:translateX(0) scaleY(1);
  }
  67% {
    opacity:.9;
    transform:translateX(-18px) scaleY(3);
  }
  72% {
    opacity:.6;
    transform:translateX(24px) scaleY(1);
  }
  77%{opacity:0}
}
@media(max-width:700px) {
  #boot-main {
    font-size:clamp(17px,5vw,34px);
    letter-spacing:1px;
  }
  .boot-right {display:none}
  .boot-logs {font-size:10px}
  .boot-lowerlogs,.boot-bottom {font-size:9px}
}
@media(prefers-reduced-motion:reduce) {
  #md-boot *,
  #md-boot::after {animation:none!important}
}
</style>
</head>

<!-- MYBROWSER DESKTOP VISUAL UPGRADE -->
<style>
/* Smoother desktop */
#desktop {
  display:grid;
  grid-template-columns:repeat(4,90px);
  gap:12px;
  max-height:calc(100vh - 110px);
  overflow:auto;
  scrollbar-width:none;
}
#desktop::-webkit-scrollbar {display:none}

#desktop .app {
  width:90px;
  min-height:86px;
  padding:11px 5px;
  border-radius:11px;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:9px;
  background:transparent;
  border:1px solid transparent;
  font-size:11px;
  font-weight:500;
  text-shadow:0 2px 7px #000;
  transition:
    background .18s ease,
    border-color .18s ease,
    transform .18s ease,
    box-shadow .18s ease;
  user-select:none;
}
#desktop .app:hover {
  background:rgba(255,224,100,.09);
  border-color:rgba(255,224,100,.35);
  transform:translateY(-3px);
  box-shadow:0 8px 25px #0004;
}
#desktop .app:active {
  transform:scale(.96);
}
#desktop .app-icon {
  width:37px;
  height:37px;
  display:grid;
  place-items:center;
}
#desktop .app-icon img {
  width:35px;
  height:35px;
  object-fit:contain;
  filter:drop-shadow(0 3px 6px #0007);
}
#desktop .app-icon svg {
  width:30px;
  height:30px;
  fill:none;
  stroke:#ffe65c;
  stroke-width:1.65;
  stroke-linecap:round;
  stroke-linejoin:round;
  filter:drop-shadow(0 0 5px #ffc40055);
}
#desktop .app-name {
  display:block;
  text-align:center;
  line-height:1.3;
}

/* Smooth window opening */
.window {
  animation:windowEnter .24s cubic-bezier(.2,.8,.2,1) both;
  will-change:transform;
}
@keyframes windowEnter {
  from {
    opacity:0;
    transform:translateY(12px) scale(.975);
  }
  to {
    opacity:1;
    transform:translateY(0) scale(1);
  }
}

/* More polished windows */
.titlebar {
  min-height:44px;
  background:linear-gradient(90deg,#191914,#111319);
  border-bottom:1px solid #ffe65c25;
}
.titlebar button {
  transition:background .15s,transform .15s;
}
.titlebar button:hover {
  transform:scale(1.06);
}
#dock {
  transition:box-shadow .25s ease;
}
#dock:hover {
  box-shadow:0 0 35px #ffc40035;
}
#dock button {
  transition:transform .18s ease,background .18s ease;
}

/* Responsive desktop */
@media(max-width:650px) {
  #desktop {
    grid-template-columns:repeat(3,78px);
    gap:7px;
    left:8px;
    top:10px;
  }
  #desktop .app {width:78px}
  #desktop .app-name {font-size:10px}
}
@media(prefers-reduced-motion:reduce) {
  .window,#desktop .app,#dock button {
    animation:none!important;
    transition:none!important;
  }
}
</style>

<script>
(function upgradeDesktop(){
  const desktop=document.getElementById("desktop");
  if(!desktop)return;

  // Consistent vector icons for built-in apps
  const icons={
    browser:'<circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c-5 5-5 13 0 18M12 3c5 5 5 13 0 18"/>',
    files:'<path d="M3 6h7l3 3h8v11H3z"/>',
    notes:'<path d="M5 3h11l4 4v14H5zM8 12h9M8 16h9"/>',
    terminal:'<rect x="2" y="4" width="20" height="16" rx="2"/><path d="m6 9 4 3-4 3M12 16h6"/>',
    calculator:'<rect x="5" y="2" width="14" height="20" rx="2"/><path d="M8 6h8M8 11h2M14 11h2M8 15h2M14 15h2M8 19h2M14 19h2"/>',
    settings:'<circle cx="12" cy="12" r="4"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M19 5l-2 2M7 17l-2 2"/>',
    tabs:'<rect x="2" y="4" width="20" height="16" rx="2"/><path d="M2 10h20M7 7h4"/>',
    about:'<circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7h.01"/>'
  };

  const builtin=[
    ["browser","Browser"],
    ["files","Files"],
    ["notes","Text Editor"],
    ["terminal","Terminal"],
    ["calculator","Calculator"],
    ["settings","Settings"],
    ["tabs","Tab Settings"],
    ["about","About"]
  ];

  // Real website shortcuts with site favicons
  const websites=[
    ["Classroom","classroom.google.com",
      "https://classroom.google.com/"],
    ["YouTube","youtube.com",
      "https://www.youtube.com/"],
    ["Google Drive","drive.google.com",
      "https://drive.google.com/"],
    ["Google Docs","docs.google.com",
      "https://docs.google.com/"],
    ["Gmail","mail.google.com",
      "https://mail.google.com/"],
    ["Calendar","calendar.google.com",
      "https://calendar.google.com/"],
    ["Wikipedia","wikipedia.org",
      "https://www.wikipedia.org/"],
    ["GitHub","github.com",
      "https://github.com/"],
    ["Google Maps","maps.google.com",
      "https://maps.google.com/"],
    ["Google Sheets","sheets.google.com",
      "https://sheets.google.com/"],
    ["Google Slides","slides.google.com",
      "https://slides.google.com/"],
    ["Google Search","google.com",
      "https://www.google.com/"]
  ];

  desktop.replaceChildren();

  function addApp(name,icon,action){
    const app=document.createElement("div");
    app.className="app";
    app.tabIndex=0;
    app.setAttribute("role","button");
    app.setAttribute("aria-label","Open "+name);

    const iconBox=document.createElement("span");
    iconBox.className="app-icon";

    if(icon.startsWith("<svg")){
      iconBox.innerHTML=icon;
    }else{
      const img=document.createElement("img");
      img.src=icon;
      img.alt="";
      img.loading="lazy";
      iconBox.appendChild(img);
    }

    const label=document.createElement("span");
    label.className="app-name";
    label.textContent=name;

    app.append(iconBox,label);

    app.onclick=action;
    app.onkeydown=e=>{
      if(e.key==="Enter"||e.key===" "){
        e.preventDefault();
        action();
      }
    };

    desktop.appendChild(app);
  }

  builtin.forEach(([id,name])=>{
    const svg='<svg viewBox="0 0 24 24" aria-hidden="true">'+
      icons[id]+'</svg>';
    addApp(name,svg,()=>openApp(id));
  });

  websites.forEach(([name,domain,url])=>{
    const favicon=
      "https://www.google.com/s2/favicons?domain="+
      encodeURIComponent(domain)+"&sz=128";

    addApp(name,favicon,()=>{
      window.open(url,"_blank","noopener,noreferrer");
    });
  });
})();
</script>
<!-- END DESKTOP VISUAL UPGRADE -->

</div>

  <span class="system-label">MYBROWSER // ONLINE</span>

  <button onclick="openApp('about')" title="Home">
    <svg viewBox="0 0 24 24">
      <path d="M3 10L12 3L21 10V21H3Z"/>
      <path d="M9 21V14H15V21"/>
    </svg>
  </button>

    <svg viewBox="0 0 24 24">
      <path d="M3 6H10L12 9H21V20H3Z"/>
    </svg>

  <button onclick="openApp('terminal')" title="Terminal">
    <svg viewBox="0 0 24 24">

    </svg>
  </button>

  <button onclick="openApp('browser')" title="Browser">
    <svg viewBox="0 0 24 24">
      <circle cx="12" cy="12" r="9"/>
      <path d="M3 12H21M12 3C6 8 6 16 12 21M12 3C18 8 18 16 12 21"/>
    </svg>
  </button>

  <button onclick="openApp('notes')" title="Notes">
    <svg viewBox="0 0 24 24">
      <path d="M5 3H16L20 7V21H5Z"/>
      <path d="M8 12H17M8 16H17"/>
    </svg>
  </button>

  <button onclick="openApp('settings')" title="Settings">
    <svg viewBox="0 0 24 24">
      <circle cx="12" cy="12" r="4"/>
      <circle cx="12" cy="12" r="9" stroke-dasharray="3 3"/>
    </svg>
  </button>

  <button onclick="openApp('tabs')" title="Tab Customization">
    <svg viewBox="0 0 24 24">
      <rect x="2" y="4" width="20" height="16" rx="3"/>
      <path d="M2 10H22M7 7H11"/>
    </svg>
  </button>

  <span id="clock"></span>
</div>

<!-- REBOOT SCREEN -->
<div id="md-boot">
  <div class="glitch-strip"></div>
  <div class="glitch-strip"></div>
  <div class="glitch-strip"></div>

  <div class="boot-logs">
    <span id="boot-typed"></span><span class="boot-cursor"></span>
  </div>

  <div class="boot-right">
    SYS://CORE<br>
    VER: ???.???<br>
    STATUS: UNKNOWN
  </div>

  <div class="boot-center">
    <div id="boot-main" data-text="REBOOTING...">REBOOTING...</div>
  </div>

  <div class="boot-lowerlogs">
    &gt; RESTORING DRONE SYSTEMS...<br>
    &gt; REINITIALIZING MEMORY BANKS...<br>
    &gt; ESTABLISHING CONNECTION...
  </div>

  <div class="boot-bottom" id="boot-bottom">
    DATA RESTORATION IN PROGRESS<br>
    &gt; PLEASE WAIT...
  </div>
</div>

<script>
/* TAB APPEARANCE SYSTEM */
const tabPresets={
  mybrowser:{title:"MyBrowser // Desktop",icon:"🌐"},
  study:{title:"Study Workspace",icon:"🎓"},
  learning:{title:"Learning Hub",icon:"📚"},
  documents:{title:"Documents",icon:"📄"},
  system:{title:"System Core",icon:"⚙️"},
  custom:{title:"My Custom Tab",icon:"✨"}
};

function emojiFavicon(emoji){
  const canvas=document.createElement("canvas");
  canvas.width=64;
  canvas.height=64;
  const ctx=canvas.getContext("2d");
  ctx.font="48px sans-serif";
  ctx.textAlign="center";
  ctx.textBaseline="middle";
  ctx.fillText(emoji,32,34);
  return canvas.toDataURL("image/png");
}

function getTabChoice(){
  try {
    return JSON.parse(
      localStorage.getItem("mybrowser-tab-choice")
    )||{title:tabPresets.mybrowser.title,
       icon:tabPresets.mybrowser.icon};
  }catch {
    return {
      title:tabPresets.mybrowser.title,
      icon:tabPresets.mybrowser.icon
    };
  }
}

function applyTabChoice(choice,save=true){
  const title=String(choice.title||"MyBrowser").slice(0,60);
  const icon=String(choice.icon||"🌐").slice(0,8);

  document.title=title;
  document.getElementById("site-favicon").href=
    emojiFavicon(icon);

  if(save){
    localStorage.setItem(
      "mybrowser-tab-choice",
      JSON.stringify({title,icon})
    );
  }
}

applyTabChoice(getTabChoice(),false);

/* DESKTOP WINDOW SYSTEM */
let topZ=10;
let windowCount=0;

const appTitles={
  browser:"MYBROWSER // BROWSER",
  files:"FILES",
  notes:"TEXT EDITOR",
  terminal:"SYSTEM TERMINAL",
  calculator:"CALCULATOR",
  settings:"SYSTEM SETTINGS",
  tabs:"TAB CUSTOMIZATION",
  about:"ABOUT MYBROWSER"
};

function openApp(type){
  const id="win"+(++windowCount);
  const w=document.createElement("div");
  w.className="window";
  w.id=id;
  w.style.zIndex=++topZ;
  w.style.left=(16+windowCount%5*5)+"%";
  w.style.top=(9+windowCount%5*4)+"%";

  const bar=document.createElement("div");
  bar.className="titlebar";

  const title=document.createElement("strong");
  title.textContent=appTitles[type];

  const close=document.createElement("button");
  close.textContent="✕";
  close.onclick=()=>w.remove();

  bar.append(title,close);

  const area=document.createElement("div");
  area.className="content";

  w.append(bar,area);
  document.getElementById("windows").appendChild(w);

  w.addEventListener("pointerdown",()=>{
    w.style.zIndex=++topZ;
  });
  makeDraggable(w,bar);

  if(type==="browser")browserApp(area);
  if(type==="notes")notesApp(area);
  if(type==="terminal")terminalApp(area);
  if(type==="calculator")calculatorApp(area);
  if(type==="settings")settingsApp(area);
  if(type==="tabs")tabCustomizationApp(area);

  if(type==="files"){
    area.innerHTML=`
      <h2>MY FILES</h2>
      <p>This desktop cannot automatically read your computer's files.</p>
      <button class="action" id="choose-file">Choose File</button>
      <p id="file-name"></p>`;

    area.querySelector("#choose-file").onclick=()=>{
      const input=document.createElement("input");
      input.type="file";
      input.onchange=()=>{
        area.querySelector("#file-name").textContent=
          input.files[0]?.name||"No file selected";
      };
      input.click();
    };
  }

  if(type==="about"){
    area.innerHTML=`
      <h1 style="color:#ffe65c;font-family:Orbitron">MYBROWSER</h1>
      <p>Desktop Operating System // Custom Edition</p>
      <p>Browser, notes, calculator, terminal simulation, draggable windows and tab customization.</p>
      <p>STATUS: SYSTEM ONLINE</p>`;
  }
}

function makeDraggable(w,bar){
  let dragging=false,dx=0,dy=0;

  bar.addEventListener("pointerdown",e=>{
    if(e.target.closest("button"))return;
    dragging=true;
    dx=e.clientX-w.offsetLeft;
    dy=e.clientY-w.offsetTop;
    bar.setPointerCapture(e.pointerId);
  });

  bar.addEventListener("pointermove",e=>{
    if(!dragging)return;
    w.style.left=Math.max(0,Math.min(
      innerWidth-100,e.clientX-dx
    ))+"px";
    w.style.top=Math.max(0,Math.min(
      innerHeight-70,e.clientY-dy
    ))+"px";
  });

  bar.addEventListener("pointerup",()=>dragging=false);
  bar.addEventListener("pointercancel",()=>dragging=false);
}

/* BROWSER */
function browserApp(area){
  area.innerHTML=`
    <div class="toolbar">
      <button id="home">⌂</button>
      <input id="address" placeholder="Search or enter URL">
      <button id="go">GO</button>
      <button id="external" title="Open in a normal tab">↗</button>
    </div>
    <p style="font-size:12px;color:#bbb">
      Some websites block embedded viewing.
    </p>
    <iframe title="Browser" src="about:blank"></iframe>`;

  const address=area.querySelector("#address");
  const frame=area.querySelector("iframe");
  let current="";

  function navigate(){
    const value=address.value.trim();
    if(!value)return;

    if(/^https?:\/\//i.test(value)){
      current=value;
    }else if(value.includes(".")&&!value.includes(" ")){
      current="https://"+value;
    }else{
      current="https://www.google.com/search?q="+
        encodeURIComponent(value);
    }
    frame.src=current;
  }

  area.querySelector("#go").onclick=navigate;
  address.onkeydown=e=>{
    if(e.key==="Enter")navigate();
  };
  area.querySelector("#home").onclick=()=>{
    current="";
    address.value="";
    frame.src="about:blank";
  };
  area.querySelector("#external").onclick=()=>{
    if(current)window.open(
      current,"_blank","noopener,noreferrer"
    );
  };
}

/* NOTES */
function notesApp(area){
  area.innerHTML=`
    <p>Local notes // saved in your browser</p>
    <textarea placeholder="Start typing..."></textarea>
    <button class="action" id="save">SAVE NOTES</button>`;

  const input=area.querySelector("textarea");
  input.value=localStorage.getItem("mybrowser-notes")||"";

  area.querySelector("#save").onclick=()=>{
    localStorage.setItem("mybrowser-notes",input.value);
    alert("Notes saved.");
  };
}

/* TERMINAL */
function terminalApp(area){
  area.innerHTML=`
    <div id="terminal-output">MYBROWSER TERMINAL
SIMULATION MODE ACTIVE
Type HELP for commands.

</div>
    <input class="field" placeholder="Enter command">`;

  const output=area.querySelector("#terminal-output");
  const input=area.querySelector("input");

  input.onkeydown=e=>{
    if(e.key!=="Enter")return;
    const command=input.value.trim();
    const lower=command.toLowerCase();
    input.value="";

    if(lower==="clear"){
      output.textContent="";
      return;
    }

    let answer={
      help:"HELP, DATE, WHOAMI, STATUS, CLEAR, ECHO TEXT",
      date:new Date().toString(),
      whoami:"mybrowser-user",
      status:"SYSTEM ONLINE // CORE STABLE"
    }[lower];

    if(lower.startsWith("echo "))answer=command.slice(5);

    output.textContent+="> "+command+"\n"+
      (answer??"Unknown command")+"\n\n";
    output.scrollTop=output.scrollHeight;
  };
}

/* CALCULATOR */
function calculatorApp(area){
  area.innerHTML=`
    <input class="field" id="display" readonly value="0">
    <div class="calc"></div>`;

  const display=area.querySelector("#display");
  const grid=area.querySelector(".calc");
  let expression="";

  for(const key of [
    "7","8","9","/",
    "4","5","6","*",
    "1","2","3","-",
    "C","0","=","+"
  ]){
    const b=document.createElement("button");
    b.textContent=key;

    b.onclick=()=>{
      if(key==="C")expression="";
      else if(key==="="){
        try{
          if(!/^[0-9+\-*/. ()]+$/.test(expression))
            throw Error("Invalid");
          expression=String(Function(
            '"use strict";return ('+expression+')'
          )());
        }catch{
          expression="Error";
        }
      }else{
        if(expression==="Error")expression="";
        expression+=key;
      }
      display.value=expression||"0";
    };
    grid.appendChild(b);
  }
}

/* SETTINGS */
function settingsApp(area){
  area.innerHTML=`
    <h2>SYSTEM SETTINGS</h2>
    <p>Choose accent color:</p>
    <div class="toolbar">
      <button data-color="#ffe65c">YELLOW</button>
      <button data-color="#ff5261">RED</button>
      <button data-color="#81e0ca">MINT</button>
    </div>
    <hr style="width:100%;border:1px solid #ffffff22">
    <h3>Tab Appearance</h3>
    <p>Customize the actual browser tab title and icon.</p>
    <button class="action" id="open-tabs">OPEN TAB CUSTOMIZATION</button>`;

  area.querySelectorAll("[data-color]").forEach(b=>{
    b.onclick=()=>{
      document.documentElement.style.setProperty(
        "--accent",b.dataset.color
      );
      localStorage.setItem(
        "mybrowser-accent",b.dataset.color
      );
    };
  });

  area.querySelector("#open-tabs").onclick=()=>{
    openApp("tabs");
  };
}

/* TAB CUSTOMIZATION */
function tabCustomizationApp(area){
  area.innerHTML=`
    <div class="tab-panel">
      <h3 class="tab-heading">TAB CUSTOMIZATION</h3>
      <p class="tab-note">
        Personalize the name and icon of your actual browser tab.
      </p>

      <div class="tab-label">LIVE PREVIEW</div>
      <div class="tab-preview-shell">
        <div class="tab-preview">
          <img id="preview-icon" alt="">
          <span id="preview-title">MyBrowser</span>
          <span style="flex:none;color:#aaa">×</span>
        </div>
      </div>

      <div class="tab-label">PRESET</div>
      <select id="tab-preset" class="field"
        style="width:100%;flex:none">
        <option value="mybrowser">MyBrowser</option>
        <option value="study">Study Workspace</option>
        <option value="learning">Learning Hub</option>
        <option value="documents">Documents</option>
        <option value="system">System Core</option>
        <option value="custom">Custom</option>
      </select>

      <div class="tab-label">TAB TITLE</div>
      <input id="custom-title" class="field"
        style="width:100%;flex:none"
        maxlength="60"
        placeholder="Enter a custom tab title">

      <div class="tab-label">TAB ICON</div>
      <select id="custom-icon" class="field"
        style="width:100%;flex:none">
        <option value="🌐">🌐 Globe</option>
        <option value="🎓">🎓 Graduation Cap</option>
        <option value="📚">📚 Books</option>
        <option value="📄">📄 Document</option>
        <option value="⚙️">⚙️ System</option>
        <option value="✨">✨ Sparkle</option>
        <option value="💻">💻 Computer</option>
        <option value="📝">📝 Notes</option>
        <option value="⭐">⭐ Star</option>
      </select>

      <div class="tab-actions">
        <button id="apply-tab" class="primary-action">
          APPLY APPEARANCE
        </button>
        <button id="reset-tab" class="action">
          RESET
        </button>
      </div>

      <p id="tab-feedback"></p>
      <p class="tab-note">
        This changes your browser tab's appearance,
        not the website address or identity.
      </p>
    </div>`;

  const preset=area.querySelector("#tab-preset");
  const title=area.querySelector("#custom-title");
  const icon=area.querySelector("#custom-icon");
  const previewTitle=area.querySelector("#preview-title");
  const previewIcon=area.querySelector("#preview-icon");
  const feedback=area.querySelector("#tab-feedback");

  const saved=getTabChoice();
  title.value=saved.title;
  icon.value=saved.icon;
  if(!icon.value)icon.value="🌐";

  function updatePreview(){
    previewTitle.textContent=title.value||"MyBrowser";
    previewIcon.src=emojiFavicon(icon.value||"🌐");
  }

  preset.onchange=()=>{
    const selected=tabPresets[preset.value];
    title.value=selected.title;
    icon.value=selected.icon;
    updatePreview();
  };

  title.oninput=()=>{
    preset.value="custom";
    updatePreview();
  };

  icon.onchange=()=>{
    preset.value="custom";
    updatePreview();
  };

  area.querySelector("#apply-tab").onclick=()=>{
    applyTabChoice({
      title:title.value.trim()||"MyBrowser",
      icon:icon.value
    });
    feedback.textContent="✓ TAB APPEARANCE UPDATED";
  };

  area.querySelector("#reset-tab").onclick=()=>{
    preset.value="mybrowser";
    title.value=tabPresets.mybrowser.title;
    icon.value=tabPresets.mybrowser.icon;
    applyTabChoice(tabPresets.mybrowser);
    updatePreview();
    feedback.textContent="✓ RESTORED DEFAULT APPEARANCE";
  };

  updatePreview();
}

const savedAccent=localStorage.getItem("mybrowser-accent");
if(savedAccent){
  document.documentElement.style.setProperty(
    "--accent",savedAccent
  );
}

function updateClock(){
  document.getElementById("clock").textContent=
    new Date().toLocaleTimeString([],{
      hour:"numeric",minute:"2-digit"
    });
}
updateClock();
setInterval(updateClock,1000);

/* CINEMATIC REBOOT */
(function startReboot(){
  const boot=document.getElementById("md-boot");
  const typed=document.getElementById("boot-typed");
  const main=document.getElementById("boot-main");
  const bottom=document.getElementById("boot-bottom");

  const failed=Math.random()<0.5;
  const lines=[
    "> SERIAL DESIGNATION: ???",
    "> AUTO RUN COMPLETE.",
    "> INITIALIZING ABSOLUTE SOLVER...",
    "> LOADING CORE MODULES...",
    "> CHECKING SYSTEM INTEGRITY...",
    "> RESTORING CORE MEMORY...",
    "> REBOOTING, PLEASE WAIT..."
  ];

  let line=0;
  let character=0;

  function typeNext(){
    if(line>=lines.length){
      beginFinalSequence();
      return;
    }

    const current=lines[line];

    if(character<current.length){
      typed.textContent+=current[character];
      character++;
      setTimeout(typeNext,20+Math.random()*18);
    }else{
      typed.textContent+="\n";
      line++;
      character=0;
      setTimeout(typeNext,180);
    }
  }

  function setMain(text){
    main.textContent=text;
    main.setAttribute("data-text",text);
  }

  function beginFinalSequence(){
    boot.classList.add("intense");
    bottom.innerHTML=
      "SYSTEM INTEGRITY CHECK<br>&gt; FINALIZING REBOOT...";

    setTimeout(()=>{
      boot.classList.remove("intense");

      if(failed){
        boot.classList.add("failed");
        setMain("REBOOT FAILED X D");
        bottom.innerHTML=
          "CRITICAL SYSTEM ERROR<br>&gt; CODE: 0xDEAD";
      }else{
        boot.classList.add("success");
        setMain("REBOOT SUCCESSFUL : )");
        bottom.innerHTML=
          "SYSTEM ONLINE<br>&gt; WELCOME BACK_";
      }

      setTimeout(()=>{
        boot.style.opacity="0";
        setTimeout(()=>boot.remove(),900);
      },2700);
    },2300);
  }

  setTimeout(typeNext,500);
})();
</script>
