
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MyBrowser</title>
<link id="favicon" rel="icon" href="data:,">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;800&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
:root{--yellow:#ffe65c;--gold:#ffc400;--panel:#101219f5}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden}
body{
 color:white;font-family:Arial,sans-serif;
 background:#09080b url("https://wallpapercave.com/wp/wp15347483.png") center/cover no-repeat fixed
}
body:before{
 content:"";position:fixed;inset:0;
 background:linear-gradient(120deg,#0008,#0002,#0008);
 pointer-events:none
}
button,input,textarea,select{font:inherit}
button{cursor:pointer}
button:disabled{opacity:.4;cursor:default}
button:hover:not(:disabled){filter:brightness(1.15)}
h2,h3{color:var(--yellow)}
h2{font-size:19px;margin:0}
.muted{color:#adb3c0;font-size:12px;line-height:1.5}
.btn,.primary{
 border-radius:8px;padding:10px 12px;
 transition:background .15s,border-color .15s
}
.btn{color:white;background:#ffffff14;border:1px solid #ffffff36}
.primary{color:#171717;background:var(--yellow);border:0;font-weight:bold}
.field,textarea,select{
 width:100%;min-width:0;padding:10px;
 color:white;background:#1b202a;
 border:1px solid #ffffff40;border-radius:8px;outline:none
}
.field:focus,textarea:focus{border-color:var(--yellow)}
textarea{flex:1;min-height:130px;resize:none}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.card{
 padding:14px;border:1px solid #ffe65c44;
 border-radius:10px;background:#151923
}

/* DESKTOP */
#desktop{position:fixed;inset:0 0 80px;pointer-events:none}
.desktop-icon{
 position:absolute;width:94px;height:94px;
 display:flex;flex-direction:column;align-items:center;
 justify-content:center;gap:8px;
 border:1px solid #ffe65c35;border-radius:12px;
 background:#090a1088;cursor:grab;user-select:none;
 touch-action:none;pointer-events:auto
}
.desktop-icon:hover,.desktop-icon.dragging{
 background:#ffe65c25;border-color:var(--yellow);
 box-shadow:0 0 20px #ffc40055
}
.desktop-icon svg{
 width:36px;height:36px;fill:none;
 stroke:var(--yellow);stroke-width:1.8;
 stroke-linecap:round;stroke-linejoin:round;
 filter:drop-shadow(0 0 6px #ffc400)
}
.desktop-icon span{
 font-size:11px;text-align:center;
 text-shadow:0 1px 5px black
}

/* TASKBAR */
#taskbar{
 position:fixed;bottom:12px;left:50%;
 transform:translateX(-50%);
 display:flex;align-items:center;gap:7px;
 padding:9px 12px;max-width:98vw;
 background:#08090eeb;border:1px solid #ffe65c88;
 border-radius:14px;box-shadow:0 0 24px #ffc40033;
 backdrop-filter:blur(15px);z-index:9000
}
#taskApps{display:flex;gap:2px;overflow-x:auto}
.task-button{
 width:36px;height:36px;min-width:36px;
 display:grid;place-items:center;
 background:transparent;border:0;
 border-radius:8px;color:var(--yellow)
}
.task-button:hover{background:#ffe65c24}
.task-button svg{
 width:23px;height:23px;fill:none;
 stroke:currentColor;stroke-width:1.8;
 stroke-linecap:round;stroke-linejoin:round
}
#clock,.system-label{
 font:10px Orbitron,monospace;
 color:var(--yellow);white-space:nowrap
}

/* WINDOWS */
.window{
 position:fixed;display:flex;flex-direction:column;
 width:790px;height:540px;
 max-width:96vw;max-height:calc(100vh - 90px);
 overflow:hidden;background:var(--panel);
 border:1px solid #ffe65c88;border-radius:13px;
 box-shadow:0 25px 70px #000c,0 0 25px #ffc40022;
 backdrop-filter:blur(16px);
 animation:windowIn .2s ease
}
@keyframes windowIn{
 from{opacity:0;transform:scale(.97)}
 to{opacity:1;transform:scale(1)}
}
.titlebar{
 min-height:45px;display:flex;
 align-items:center;justify-content:space-between;
 padding:0 13px;background:#1b1d24;
 border-bottom:1px solid #ffe65c44;
 color:var(--yellow);font:12px Orbitron,monospace;
 cursor:grab;user-select:none;touch-action:none
}
.window-controls{display:flex;gap:5px}
.window-controls button{
 padding:5px 10px;color:white;
 background:#ffffff18;border:1px solid #ffffff30;
 border-radius:6px
}
.window-controls .close:hover{background:#b52935}
.window-content{
 flex:1;min-height:0;display:flex;
 flex-direction:column;gap:12px;
 padding:15px;overflow:auto
}

/* BROWSER */
.browser-toolbar{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.browser-toolbar .field{flex:1;min-width:150px}
.browser-page{
 flex:1;min-height:0;overflow:auto;
 border:1px solid #ffe65c44;border-radius:9px;
 background:#0b0e14
}
.browser-home{
 min-height:100%;display:flex;
 flex-direction:column;align-items:center;
 justify-content:center;gap:14px;
 text-align:center;padding:20px;
 background:radial-gradient(circle,#ffe65c13,#0b0e14)
}
.browser-home h1{
 margin:0;color:var(--yellow);
 font-size:clamp(25px,5vw,45px);
 font-family:Orbitron,monospace;
 text-shadow:0 0 20px #ffc40088
}
.result{
 margin:12px;padding:14px;
 background:#161b24;border:1px solid #ffe65c44;
 border-radius:10px
}
.result h3{margin:0 0 7px;font-size:15px}
.result p{font-size:13px;line-height:1.5}
.result-url{font-size:11px;color:#adb3c0;overflow-wrap:anywhere}
.website-frame{
 display:block;width:100%;height:100%;
 min-height:250px;border:0;background:white
}
.read-content{
 padding:16px;white-space:pre-wrap;
 overflow-wrap:anywhere;line-height:1.6;font-size:13px
}
.terminal-output{
 flex:1;overflow:auto;white-space:pre-wrap;
 font:13px/1.6 "Share Tech Mono",monospace;
 color:var(--yellow)
}
.calc-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.calc-grid button{
 padding:15px 4px;background:#ffffff17;
 color:white;border:1px solid #ffffff30;
 border-radius:8px;font-size:19px
}

/* GAMES */
.game-top{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.game-panel{
 flex:1;min-height:0;display:flex;
 flex-direction:column;align-items:center;
 justify-content:flex-start;gap:12px;
 overflow:auto;padding:10px
}
.mine-board{
 display:grid;gap:2px;max-width:100%;
 padding:7px;background:#171b25;
 border:1px solid #ffe65c55;border-radius:9px;
 user-select:none;touch-action:manipulation
}
.mine-cell{
 width:29px;height:29px;padding:0;
 border:1px solid #ffe65c44;border-radius:4px;
 background:#343b49;color:white;
 font:700 15px "Share Tech Mono",monospace
}
.mine-cell.open{
 background:#11151e;border-color:#ffffff14;
 cursor:default
}
.mine-cell.flag{color:#ffdf59}
.mine-cell.bomb{background:#92283b}
.mine-cell[data-number="1"]{color:#78c9ff}
.mine-cell[data-number="2"]{color:#78e6b4}
.mine-cell[data-number="3"]{color:#ff7777}
.mine-cell[data-number="4"]{color:#c4a1ff}
.mine-cell[data-number="5"]{color:#ffb775}
#snakeCanvas{
 width:min(100%,400px);height:auto;
 aspect-ratio:1;background:#0b0e14;
 border:2px solid #ffe65c88;border-radius:8px;
 image-rendering:pixelated
}
.direction-pad{
 display:grid;grid-template-columns:repeat(3,48px);
 gap:5px
}
.direction-pad button{height:44px}
.tiles2048{
 display:grid;grid-template-columns:repeat(4,1fr);
 gap:9px;width:min(100%,370px);
 aspect-ratio:1;padding:9px;
 border:1px solid #ffe65c66;
 border-radius:12px;background:#11151e
}
.tile2048{
 display:grid;place-items:center;
 border-radius:7px;background:#ffffff10;
 font:800 clamp(16px,3vw,29px) Orbitron,monospace;
 color:#171717
}
.tile2048[data-v="0"]{color:transparent}
.tile2048[data-v="2"]{background:#eee4da}
.tile2048[data-v="4"]{background:#ede0c8}
.tile2048[data-v="8"]{background:#f2b179}
.tile2048[data-v="16"]{background:#f59563}
.tile2048[data-v="32"]{background:#f67c5f}
.tile2048[data-v="64"]{background:#f65e3b}
.tile2048[data-v="128"]{background:#edcf72}
.tile2048[data-v="256"]{background:#edcc61}
.tile2048[data-v="512"]{background:#edc850}
.tile2048[data-v="1024"]{background:#edc53f}
.tile2048[data-v="2048"]{background:#edc22e}
.tile2048[data-v="4096"]{background:#c7a7ff}

/* CINEMATIC REBOOT */
#md-boot{
 position:fixed;inset:0;z-index:999999;
 overflow:hidden;isolation:isolate;
 background:#040406;color:#ffe65c;
 font-family:"Share Tech Mono",monospace;
 transition:opacity 1.1s ease,filter 1.1s ease
}
#md-boot:before{
 content:"";position:absolute;inset:0;z-index:15;
 pointer-events:none;
 background:
 repeating-linear-gradient(0deg,#0007 0px,#0007 1px,transparent 2px,transparent 4px),
 radial-gradient(ellipse at center,transparent 25%,#000b 100%)
}
#md-boot:after{
 content:"";position:absolute;inset:-100% 0;
 pointer-events:none;z-index:14;
 background:linear-gradient(transparent 47%,#ffd40013 50%,transparent 53%);
 animation:screenSweep 4s linear infinite
}
.boot-ambient{
 position:absolute;inset:0;z-index:0;
 background:radial-gradient(ellipse at center,#ffc4000b,transparent 68%);
 animation:ambient 3s ease-in-out infinite alternate
}
.boot-logs{
 position:absolute;top:20px;left:22px;z-index:5;
 max-width:80vw;white-space:pre-wrap;
 font-size:clamp(11px,1.25vw,16px);
 line-height:1.55;letter-spacing:1.3px;
 color:#ffe86d;text-shadow:0 0 9px #ffc40088
}
.boot-cursor{
 display:inline-block;width:9px;height:16px;
 background:#ffe65c;vertical-align:middle;
 box-shadow:0 0 10px #ffe000;
 animation:cursorBlink .7s steps(1) infinite
}
.boot-center{
 position:absolute;inset:0;display:flex;
 flex-direction:column;align-items:center;
 justify-content:center;gap:18px;
 padding:18px;z-index:4
}
#boot-main{
 position:relative;
 font:800 clamp(20px,5.2vw,80px) Orbitron,monospace;
 letter-spacing:4px;text-align:center;
 color:#fff5ac;white-space:nowrap;
 text-shadow:
 0 0 4px #fff,
 0 0 12px #ffe600,
 0 0 28px #ffd000,
 0 0 65px #ffb900;
 animation:textFlicker 3.5s infinite,textJitter 5s infinite;
 transition:color .45s,text-shadow .45s
}
#boot-main:before,#boot-main:after{
 content:attr(data-text);
 position:absolute;inset:0;
 opacity:0;pointer-events:none
}
#boot-main:before{
 color:#fff5b0;text-shadow:-8px 0 #ffbd00;
 animation:glitchA 1.5s infinite
}
#boot-main:after{
 color:white;text-shadow:8px 0 #ff9f00;
 animation:glitchB 1.8s infinite
}
#boot-jk{
 display:none;position:relative;
 font:800 clamp(38px,7vw,100px) Orbitron,monospace;
 color:#fff5a8;letter-spacing:8px;
 text-shadow:
 -3px 0 8px #ffe000,
 3px 0 9px #a65aff,
 0 0 24px #ffd400,
 0 0 45px #9e52ff
}
.boot-bottom{
 position:absolute;right:22px;bottom:23px;
 z-index:5;text-align:right;
 color:#e6c74d;font-size:12px;
 letter-spacing:1.5px;line-height:1.6
}
.boot-lowerlogs{
 position:absolute;left:22px;bottom:23px;
 z-index:5;color:#d6b43d;font-size:12px;line-height:1.5
}
.glitch-strip{
 position:absolute;left:0;width:100%;height:3px;
 opacity:0;z-index:7;pointer-events:none;
 background:linear-gradient(90deg,transparent,#ffdd00,#fff8a5,#ffb800,transparent);
 box-shadow:0 0 15px #ffcc00
}
.glitch-strip:nth-child(1){
 top:32%;animation:stripGlitch 2.5s steps(2) infinite
}
.glitch-strip:nth-child(2){
 top:49%;animation:stripGlitch 3.2s steps(2) infinite .3s
}
.glitch-strip:nth-child(3){
 top:62%;animation:stripGlitch 2.8s steps(2) infinite .15s
}
#md-boot.intense .glitch-strip{
 animation-duration:.4s
}
#md-boot.failed{
 background:#090103;
 box-shadow:inset 0 0 180px #ff00004d
}
#md-boot.failed #boot-main{
 color:#ff9090;
 text-shadow:0 0 8px red,0 0 25px red,0 0 65px red
}
#md-boot.failed #boot-main:before,
#md-boot.failed #boot-main:after{
 color:#ff5555;text-shadow:8px 0 red
}
#md-boot.failed .glitch-strip{
 background:#ff2538;box-shadow:0 0 25px red
}
#md-boot.failed .boot-bottom,
#md-boot.failed .boot-logs{color:#ff5151}
#md-boot.joking{
 background:#090610;
 box-shadow:inset 0 0 130px #7839a533
}
#md-boot.joking #boot-main{
 color:#fff1ac;
 text-shadow:-3px 0 7px #ffd600,3px 0 9px #a65aff,0 0 28px #e8bfff
}
#md-boot.joking #boot-jk{
 display:block;
 animation:jkReveal .7s cubic-bezier(.2,.8,.2,1) both,
 jkGlow 1.8s .7s ease-in-out infinite alternate
}
#md-boot.joking .glitch-strip{
 background:linear-gradient(90deg,transparent,#ffd800,#b260ff,#fff2a0,transparent);
 box-shadow:0 0 20px #a55bff
}
#md-boot.jk-glitch{animation:screenJolt .38s steps(3)}
#md-boot.boot-exit{opacity:0;filter:blur(7px)}
@keyframes cursorBlink{50%{opacity:0}}
@keyframes ambient{to{opacity:.4}}
@keyframes screenSweep{to{transform:translateY(100%)}}
@keyframes textFlicker{
 0%,88%,92%,97%,100%{opacity:1}
 89%,95%{opacity:.45}
 90%,96%{opacity:.85}
}
@keyframes textJitter{
 0%,85%,100%{transform:translate(0)}
 86%{transform:translate(-4px,2px)}
 88%{transform:translate(5px,-2px)}
 90%{transform:translate(-2px,1px)}
}
@keyframes glitchA{
 0%,72%,100%{opacity:0;clip-path:inset(100% 0 0)}
 74%{opacity:.95;transform:translateX(-10px);clip-path:inset(15% 0 62%)}
 79%{opacity:.8;transform:translateX(8px);clip-path:inset(58% 0 20%)}
 83%{opacity:0}
}
@keyframes glitchB{
 0%,66%,100%{opacity:0;clip-path:inset(0 0 100%)}
 68%{opacity:.9;transform:translateX(11px);clip-path:inset(42% 0 34%)}
 73%{opacity:.8;transform:translateX(-8px);clip-path:inset(76% 0 8%)}
 77%{opacity:0}
}
@keyframes stripGlitch{
 0%,65%,100%{opacity:0;transform:translateX(0) scaleY(1)}
 67%{opacity:.8;transform:translateX(-15px) scaleY(2)}
 72%{opacity:.5;transform:translateX(20px)}
 77%{opacity:0}
}
@keyframes screenJolt{
 0%,100%{transform:translateX(0);filter:brightness(1)}
 25%{transform:translateX(-7px);filter:brightness(1.8)}
 50%{transform:translateX(7px);filter:brightness(.5)}
 75%{transform:translateX(-3px);filter:brightness(1.4)}
}
@keyframes jkReveal{
 0%{opacity:0;transform:translateY(15px) scale(.94);filter:blur(8px)}
 35%{opacity:.85;transform:translateY(-3px) scale(1.03);filter:blur(1px)}
 100%{opacity:1;transform:translateY(0) scale(1);filter:blur(0)}
}
@keyframes jkGlow{to{filter:brightness(1.3)}}
@media(max-width:700px){
 .system-label{display:none}
 #taskbar{padding:7px;gap:3px}
 .task-button{width:31px;min-width:31px}
 .task-button svg{width:19px}
 .window-content{padding:10px}
 .desktop-icon{width:80px;height:82px}
 .mine-cell{width:24px;height:24px;font-size:12px}
 #boot-main{font-size:clamp(15px,4.5vw,34px);letter-spacing:1px}
 .boot-logs{font-size:10px}
 .boot-bottom,.boot-lowerlogs{font-size:9px}
}
@media(prefers-reduced-motion:reduce){
 #md-boot *,#md-boot:after{animation:none!important}
}
</style>
</head>
<body>

<div id="desktop"></div>

<div id="taskbar">
 <strong class="system-label">MYBROWSER // ONLINE</strong>
 <div id="taskApps"></div>
 <span id="clock"></span>
</div>

<div id="md-boot">
 <div class="boot-ambient"></div>
 <div class="glitch-strip"></div>
 <div class="glitch-strip"></div>
 <div class="glitch-strip"></div>

 <div class="boot-logs">
  <span id="boot-typed"></span><span class="boot-cursor"></span>
 </div>

 <div class="boot-center">
  <div id="boot-main" data-text="REBOOTING...">REBOOTING...</div>
  <div id="boot-jk">JK</div>
 </div>

 <div class="boot-lowerlogs">
  &gt; RESTORING DRONE SYSTEMS...<br>
  &gt; REINITIALIZING MEMORY BANKS...<br>
  &gt; ESTABLISHING CONNECTION...
 </div>

 <div class="boot-bottom" id="boot-bottom">
  DATA RESTORATION IN PROGRESS<br>
  &gt; PLEASE WAIT...
 </div>
</div>

<script>
"use strict";

const WORKER_URL =
 "https://mybrowser-search.gosha7258.workers.dev/";

const APPS=[
 ["browser","Browser"],
 ["files","Files"],
 ["editor","Text Editor"],
 ["terminal","Terminal"],
 ["calculator","Calculator"],
 ["cloaking","Cloaking"],
 ["about","About"],
 ["minesweeper","Minesweeper"],
 ["snake","Snake"],
 ["game2048","2048"]
];

const ICONS={
 browser:'<circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c-5 5-5 13 0 18M12 3c5 5 5 13 0 18"/>',
 files:'<path d="M3 7V5h7l2 3h9v11H3z"/>',
 editor:'<path d="M5 3h10l4 4v14H5zM15 3v5h4M8 12h8M8 16h7"/>',
 terminal:'<rect x="2" y="3" width="20" height="18" rx="2"/><path d="m6 8 4 4-4 4M12 16h6"/>',
 calculator:'<rect x="5" y="2" width="14" height="20" rx="2"/><path d="M8 6h8M8 11h2M14 11h2M8 15h2M14 15h2M8 19h8"/>',
 cloaking:'<path d="M12 3 3 7v5c0 6 4 9 9 10 5-1 9-4 9-10V7zM8 12l3 3 5-6"/>',
 about:'<circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7v1"/>',
 minesweeper:'<rect x="3" y="3" width="18" height="18" rx="2"/><path d="M9 3v18M15 3v18M3 9h18M3 15h18"/><circle cx="12" cy="12" r="2"/>',
 snake:'<path d="M3 6h12a4 4 0 0 1 0 8H9a4 4 0 0 0 0 8h8"/><circle cx="18" cy="6" r="1"/>',
 game2048:'<rect x="2" y="2" width="9" height="9" rx="1"/><rect x="13" y="2" width="9" height="9" rx="1"/><rect x="2" y="13" width="9" height="9" rx="1"/><rect x="13" y="13" width="9" height="9" rx="1"/>'
};

function iconSVG(id){
 return '<svg viewBox="0 0 24 24">'+ICONS[id]+'</svg>';
}

const desktop=document.getElementById("desktop");
const taskApps=document.getElementById("taskApps");
let topZ=20,windowCount=0;
let positions={};

try{
 positions=JSON.parse(
  localStorage.getItem("mybrowser-layout-v3")||"{}"
 );
}catch{}

function savePositions(){
 localStorage.setItem(
  "mybrowser-layout-v3",JSON.stringify(positions)
 );
}

/* DESKTOP ICONS */
APPS.forEach(([id,name],index)=>{
 const el=document.createElement("div");
 el.className="desktop-icon";
 el.innerHTML=iconSVG(id)+"<span>"+name+"</span>";

 const fallback={
  x:20+(index%3)*106,
  y:20+Math.floor(index/3)*106
 };
 const pos=positions[id]||fallback;

 el.style.left=pos.x+"px";
 el.style.top=pos.y+"px";
 desktop.appendChild(el);

 let sx=0,sy=0,ox=0,oy=0,moved=false;

 el.addEventListener("pointerdown",e=>{
  if(e.button!==0)return;
  el.setPointerCapture(e.pointerId);
  sx=e.clientX;sy=e.clientY;
  ox=el.offsetLeft;oy=el.offsetTop;
  moved=false;
  el.classList.add("dragging");
 });

 el.addEventListener("pointermove",e=>{
  if(!el.hasPointerCapture(e.pointerId))return;
  const dx=e.clientX-sx,dy=e.clientY-sy;
  if(Math.abs(dx)+Math.abs(dy)>6)moved=true;
  if(!moved)return;
  el.style.left=Math.max(0,Math.min(
   innerWidth-el.offsetWidth,ox+dx
  ))+"px";
  el.style.top=Math.max(0,Math.min(
   innerHeight-100-el.offsetHeight,oy+dy
  ))+"px";
 });

 el.addEventListener("pointerup",()=>{
  el.classList.remove("dragging");
  positions[id]={x:el.offsetLeft,y:el.offsetTop};
  savePositions();
  if(!moved)openApp(id);
 });

 const task=document.createElement("button");
 task.className="task-button";
 task.title=name;
 task.innerHTML=iconSVG(id);
 task.onclick=()=>openApp(id);
 taskApps.appendChild(task);
});

/* WINDOW MANAGER */
function makeWindow(id,title){
 const existing=document.querySelector(
  '.window[data-app="'+id+'"]'
 );
 if(existing){
  existing.style.zIndex=++topZ;
  return null;
 }

 const win=document.createElement("div");
 win.className="window";
 win.dataset.app=id;
 win.style.left=Math.max(5,Math.min(
  innerWidth-300,100+windowCount*26
 ))+"px";
 win.style.top=Math.max(5,Math.min(
  innerHeight-200,50+windowCount*22
 ))+"px";
 win.style.zIndex=++topZ;
 windowCount=(windowCount+1)%9;

 const bar=document.createElement("div");
 bar.className="titlebar";

 const label=document.createElement("span");
 label.textContent="◆ "+title.toUpperCase();

 const controls=document.createElement("div");
 controls.className="window-controls";

 const max=document.createElement("button");
 max.textContent="□";
 max.title="Maximize";
 let saved=null;

 max.onclick=()=>{
  if(!saved){
   saved={
    left:win.style.left,top:win.style.top,
    width:win.style.width,height:win.style.height
   };
   Object.assign(win.style,{
    left:"0",top:"0",width:"100vw",
    height:"calc(100vh - 80px)",maxWidth:"none"
   });
  }else{
   Object.assign(win.style,{
    ...saved,maxWidth:"96vw"
   });
   saved=null;
  }
 };

 close.className="close";
 close.textContent="✕";

 bar.append(label,controls);

 area.className="window-content";
 win.append(bar,area);
 document.body.appendChild(win);

 win.addEventListener("pointerdown",()=>{
  win.style.zIndex=++topZ;
 });

 let dragging=false,sx=0,sy=0,ox=0,oy=0;

 bar.addEventListener("pointerdown",e=>{
  if(e.target.closest("button"))return;
  dragging=true;
  sx=e.clientX;sy=e.clientY;
  ox=win.offsetLeft;oy=win.offsetTop;
  bar.setPointerCapture(e.pointerId);
 });

 bar.addEventListener("pointermove",e=>{
  if(!dragging||saved)return;
  win.style.left=Math.max(0,Math.min(
   innerWidth-90,ox+e.clientX-sx
  ))+"px";
  win.style.top=Math.max(0,Math.min(
   innerHeight-90,oy+e.clientY-sy
  ))+"px";
 });

 bar.addEventListener("pointerup",()=>dragging=false);
 bar.addEventListener("pointercancel",()=>dragging=false);

 return area;
}

function browserApp(area){
 let history=[],historyIndex=-1;
 let currentURL="",mode="home",requestNumber=0;

 area.innerHTML=`
 <div class="browser-toolbar">
  <button class="btn" id="back">←</button>
  <button class="btn" id="forward">→</button>
  <button class="btn" id="refresh">⟳</button>
  <button class="btn" id="home">⌂</button>
  <input class="field" id="address"
   placeholder="Search the web or enter a URL">
  <button class="primary" id="go">GO</button>
 </div>
 <div class="browser-page" id="page"></div>
 <div class="muted" id="status">MYBROWSER // READY</div>`;

 const page=area.querySelector("#page");
 const address=area.querySelector("#address");
 const status=area.querySelector("#status");
 const back=area.querySelector("#back");
 const forward=area.querySelector("#forward");

 function buttons(){
  back.disabled=historyIndex<=0;
  forward.disabled=historyIndex>=history.length-1;
 }
 function record(entry){
  history=history.slice(0,historyIndex+1);
  history.push(entry);
  historyIndex=history.length-1;
  buttons();
 }

 function home(add=true){
  requestNumber++;
  mode="home";currentURL="";address.value="";
  page.innerHTML=`
   <div class="browser-home">
    <h1>MYBROWSER</h1>
    <p class="muted">WEB SEARCH // POWERED BY TAVILY</p>
    <p class="muted">Search for websites or enter an address.</p>
   </div>`;
  status.textContent="MYBROWSER // HOME";
  if(add)record({type:"home"});
 }

 async function search(query,add=true){
  const req=++requestNumber;
  mode="search";currentURL="";
  address.value=query;
  if(add)record({type:"search",value:query});

  page.replaceChildren();
  const heading=document.createElement("h2");
  heading.textContent="Search results: "+query;
  heading.style.padding="16px";
  page.appendChild(heading);
  status.textContent="Searching Tavily...";

  try{
   const response=await fetch(WORKER_URL,{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({action:"search",query})
   });
   const data=await response.json();
   if(!response.ok)throw Error(data.error||"Search failed");
   if(req!==requestNumber)return;

   const results=data.results||[];
   status.textContent=results.length+" results found";

   if(!results.length){
    const empty=document.createElement("p");
    empty.className="muted";
    empty.style.padding="16px";
    empty.textContent="No results found.";
    page.appendChild(empty);
   }

   for(const item of results){
    const card=document.createElement("div");
    card.className="result";

    const title=document.createElement("h3");
    title.textContent=item.title||"Untitled";

    const url=document.createElement("div");
    url.className="result-url";
    url.textContent=item.url||"";

    const description=document.createElement("p");
    description.textContent=item.description||"";

    const actions=document.createElement("div");
    actions.className="row";

    const open=document.createElement("button");
    open.className="primary";
    open.textContent="OPEN IN MYBROWSER";
    open.onclick=()=>navigate(item.url);

    const read=document.createElement("button");
    read.className="btn";
    read.textContent="READ PAGE";
    read.onclick=()=>readPage(item.url);

    actions.append(open,read);
    card.append(title,url,description,actions);
    page.appendChild(card);
   }
  }catch(e){
   if(req!==requestNumber)return;
   status.textContent="Search failed: "+e.message;
  }
 }

 function validURL(url){
  try{
   const parsed=new URL(url);
   if(!["http:","https:"].includes(parsed.protocol))return null;
   return parsed;
  }catch{return null}
 }

 function navigate(url,add=true){
  const parsed=validURL(url);
  if(!parsed){
   status.textContent="Invalid website address.";
   return;
  }
  requestNumber++;
  mode="website";currentURL=parsed.href;
  address.value=currentURL;
  if(add)record({type:"website",value:currentURL});

  page.replaceChildren();
  const frame=document.createElement("iframe");
  frame.className="website-frame";
  frame.title="Website Viewer";
  frame.src=currentURL;
  frame.referrerPolicy="no-referrer";
  page.appendChild(frame);

  status.textContent="Viewing "+parsed.hostname+
   " — some sites may block embedded viewing.";
 }

 async function readPage(url,add=true){
  const parsed=validURL(url);
  if(!parsed){
   status.textContent="Invalid website address.";
   return;
  }
  const req=++requestNumber;
  mode="read";currentURL=parsed.href;
  address.value=currentURL;
  if(add)record({type:"read",value:currentURL});

  page.replaceChildren();
  const heading=document.createElement("h2");
  heading.textContent="READ PAGE // "+parsed.hostname;
  heading.style.padding="16px 16px 0";

  const content=document.createElement("div");
  content.className="read-content";
  content.textContent="Loading readable content...";
  page.append(heading,content);
  status.textContent="Reading page with Jina AI...";

  try{
   const response=await fetch(WORKER_URL,{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({action:"read",url:parsed.href})
   });
   const data=await response.json();
   if(!response.ok)throw Error(data.error||"Read failed");
   if(req!==requestNumber)return;

   content.textContent=data.content||"No readable content found.";
   status.textContent="READ PAGE // "+parsed.hostname;
  }catch(e){
   if(req!==requestNumber)return;
   content.textContent="Unable to read page: "+e.message;
   status.textContent="READ PAGE // FAILED";
  }
 }

 function restore(){
  const entry=history[historyIndex];
  if(!entry)return;
  if(entry.type==="home")home(false);
  if(entry.type==="search")search(entry.value,false);
  if(entry.type==="website")navigate(entry.value,false);
  if(entry.type==="read")readPage(entry.value,false);
  buttons();
 }

 function go(){
  const value=address.value.trim();
  if(!value)return;
  if(/^https?:\/\//i.test(value))navigate(value);
  else if(/^[^\s]+\.[a-z]{2,}(?:[/:?#].*)?$/i.test(value))
   navigate("https://"+value);
  else search(value);
 }

 area.querySelector("#go").onclick=go;
 address.onkeydown=e=>{if(e.key==="Enter")go()};
 back.onclick=()=>{
  if(historyIndex>0){historyIndex--;restore()}
 };
 forward.onclick=()=>{
  if(historyIndex<history.length-1){historyIndex++;restore()}
 };
 area.querySelector("#refresh").onclick=restore;
 area.querySelector("#home").onclick=()=>home();
 home();
}

/* CALCULATOR */
function calculatorApp(area){
 area.innerHTML=`
 <h2>CALCULATOR</h2>
 <input class="field" id="display" readonly value="0"
  style="font-size:25px;text-align:right">
 <div class="calc-grid" id="keys"></div>`;

 const display=area.querySelector("#display");
 const grid=area.querySelector("#keys");
 let expression="";

 const keys=[
  "7","8","9","÷",
  "4","5","6","×",
  "1","2","3","−",
  "C","0",".","+",
  "(",")","⌫","="
 ];

 function calculate(source){
  const s=source.replaceAll("×","*")
   .replaceAll("÷","/").replaceAll("−","-");
  if(!/^[0-9+\-*/().\s]+$/.test(s))throw Error();

  const tokens=s.match(/\d+(?:\.\d+)?|\.\d+|[()+\-*/]/g);
  if(!tokens||tokens.join("")!==s.replace(/\s/g,""))
   throw Error();

  let i=0;
  function expr(){
   let v=term();
   while(tokens[i]==="+"||tokens[i]==="-"){
    const op=tokens[i++];
    const n=term();
    v=op==="+"?v+n:v-n;
   }
   return v;
  }
  function term(){
   let v=factor();
   while(tokens[i]==="*"||tokens[i]==="/"){
    const op=tokens[i++];
    const n=factor();
    v=op==="*"?v*n:v/n;
   }
   return v;
  }
  function factor(){
   const token=tokens[i++];
   if(token==="+")return factor();
   if(token==="-")return -factor();
   if(token==="("){
    const v=expr();
    if(tokens[i++]!==")")throw Error();
    return v;
   }
   const v=Number(token);
   if(!Number.isFinite(v))throw Error();
   return v;
  }
  const result=expr();
  if(i!==tokens.length||!Number.isFinite(result))
   throw Error();
  return String(Number(result.toPrecision(12)));
 }

 keys.forEach(key=>{
  const b=document.createElement("button");
  b.textContent=key;
  b.onclick=()=>{
   if(key==="C")expression="";
   else if(key==="⌫")expression=expression.slice(0,-1);
   else if(key==="="){
    try{expression=calculate(expression)}
    catch{expression="";display.value="ERROR";return}
   }else expression+=key;
   display.value=expression||"0";
  };
  grid.appendChild(b);
 });
}

/* MINESWEEPER */
function minesweeperApp(area){
 let rows=9,cols=9,mines=10;
 let cells=[],started=false,ended=false;
 let flags=0,seconds=0,timer=null,flagMode=false;

 area.innerHTML=`
 <h2>MINESWEEPER</h2>
 <div class="game-top">
  <select class="field" id="difficulty" style="width:auto">
   <option value="easy">Easy 9×9</option>
   <option value="medium">Medium 12×12</option>
   <option value="hard">Hard 16×16</option>
  </select>
  <button class="primary" id="restart">NEW GAME</button>
  <button class="btn" id="flagMode">FLAG: OFF</button>
 </div>
 <div class="game-top">
  <span class="muted" id="mineCount">MINES: 10</span>
  <span class="muted" id="mineTime">TIME: 0</span>
  <span class="muted" id="mineStatus">READY</span>
 </div>
 <div class="game-panel">
  <div class="mine-board" id="board"></div>
  <p class="muted">
   Left-click to reveal. Right-click to flag.
   On touchscreens, use Flag mode.
  </p>
 </div>`;

 const board=area.querySelector("#board");
 const counter=area.querySelector("#mineCount");
 const time=area.querySelector("#mineTime");
 const status=area.querySelector("#mineStatus");

 function neighbors(r,c){
  const result=[];
  for(let dr=-1;dr<=1;dr++){
   for(let dc=-1;dc<=1;dc++){
    if(!dr&&!dc)continue;
    const nr=r+dr,nc=c+dc;
    if(nr>=0&&nr<rows&&nc>=0&&nc<cols)
     result.push([nr,nc]);
   }
  }
  return result;
 }

 function stopTimer(){
  clearInterval(timer);
  timer=null;
 }

 function newGame(){
  stopTimer();
  const difficulty=area.querySelector("#difficulty").value;
  if(difficulty==="easy"){
   rows=9;cols=9;mines=10;
  }else if(difficulty==="medium"){
   rows=12;cols=12;mines=24;
  }else{
   rows=16;cols=16;mines=40;
  }

  cells=Array.from({length:rows},()=>Array.from(
   {length:cols},
   ()=>({mine:false,open:false,flag:false,count:0})
  ));
  started=false;ended=false;flags=0;seconds=0;
  flagMode=false;
  area.querySelector("#flagMode").textContent="FLAG: OFF";
  time.textContent="TIME: 0";
  status.textContent="READY";
  board.style.gridTemplateColumns=`repeat(${cols},1fr)`;
  board.replaceChildren();

  for(let r=0;r<rows;r++){
   for(let c=0;c<cols;c++){
    const b=document.createElement("button");
    b.className="mine-cell";
    b.dataset.r=r;b.dataset.c=c;
    b.onclick=()=>{
     if(flagMode)toggleFlag(r,c);
     else reveal(r,c);
    };
    b.oncontextmenu=e=>{
     e.preventDefault();
     toggleFlag(r,c);
    };
    board.appendChild(b);
   }
  }
  update();
 }

 function placeMines(safeR,safeC){
  const forbidden=new Set(
   [[safeR,safeC],...neighbors(safeR,safeC)]
   .map(([r,c])=>r+","+c)
  );
  const possible=[];
  for(let r=0;r<rows;r++)
   for(let c=0;c<cols;c++)
    if(!forbidden.has(r+","+c))possible.push([r,c]);

  for(let i=possible.length-1;i>0;i--){
   const j=Math.floor(Math.random()*(i+1));
   [possible[i],possible[j]]=[possible[j],possible[i]];
  }

  for(const [r,c] of possible.slice(0,mines))
   cells[r][c].mine=true;

  for(let r=0;r<rows;r++)
   for(let c=0;c<cols;c++)
    cells[r][c].count=neighbors(r,c)
     .filter(([nr,nc])=>cells[nr][nc].mine).length;
 }

 function toggleFlag(r,c){
  if(ended)return;
  const cell=cells[r][c];
  if(cell.open)return;
  cell.flag=!cell.flag;
  flags+=cell.flag?1:-1;
  update();
 }

 function reveal(r,c){
  if(ended)return;
  if(!started){
   started=true;
   placeMines(r,c);
   status.textContent="PLAYING";
   timer=setInterval(()=>{
    seconds++;
    time.textContent="TIME: "+seconds;
   },1000);
  }

  const cell=cells[r][c];
  if(cell.open||cell.flag)return;

  if(cell.mine){
   cell.open=true;
   ended=true;
   stopTimer();
   status.textContent="GAME OVER";
   for(const row of cells)
    for(const item of row)
     if(item.mine)item.open=true;
   update();
   return;
  }

  const queue=[[r,c]];
  while(queue.length){
   const [cr,cc]=queue.pop();
   const current=cells[cr][cc];
   if(current.open||current.flag||current.mine)continue;
   current.open=true;
   if(current.count===0){
    for(const [nr,nc] of neighbors(cr,cc)){
     const next=cells[nr][nc];
     if(!next.open&&!next.flag&&!next.mine)
      queue.push([nr,nc]);
    }
   }
  }

  const safeOpened=cells.flat().filter(
   x=>x.open&&!x.mine
  ).length;

  if(safeOpened===rows*cols-mines){
   ended=true;
   stopTimer();
   status.textContent="YOU WIN!";
  }
  update();
 }

 function update(){
  counter.textContent="MINES: "+(mines-flags);
  for(const button of board.children){
   const r=+button.dataset.r,c=+button.dataset.c;
   const cell=cells[r][c];
   button.className="mine-cell";
   button.textContent="";
   button.removeAttribute("data-number");

   if(cell.open){
    button.classList.add("open");
    if(cell.mine){
     button.textContent="✹";
     button.classList.add("bomb");
    }else if(cell.count){
     button.textContent=cell.count;
     button.dataset.number=cell.count;
    }
   }else if(cell.flag){
    button.textContent="⚑";
    button.classList.add("flag");
   }
  }
 }

 area.querySelector("#restart").onclick=newGame;
 area.querySelector("#difficulty").onchange=newGame;
 area.querySelector("#flagMode").onclick=()=>{
  flagMode=!flagMode;
  area.querySelector("#flagMode").textContent=
   "FLAG: "+(flagMode?"ON":"OFF");
 };

 newGame();

 const observer=new MutationObserver(()=>{
  if(!area.isConnected){
   stopTimer();
   observer.disconnect();
  }
 });
 observer.observe(document.body,{childList:true});
}

   <button class="btn" data-dir="right">→</button>
  </div>
  <p class="muted">Use arrow keys or WASD.</p>
 </div>`;

 const canvas=area.querySelector("#snakeCanvas");
 const ctx=canvas.getContext("2d");
 const scoreEl=area.querySelector("#score");
 const bestEl=area.querySelector("#best");
 const message=area.querySelector("#message");

 const N=20,S=20;
 let snake=[],food={x:10,y:10};
 let direction={x:1,y:0},next={x:1,y:0};
 let score=0,running=false,paused=false,timer=null;
 let best=Number(localStorage.getItem("mybrowser-snake-best")||0);
 bestEl.textContent="BEST: "+best;

 function randomFood(){
  const empty=[];
  for(let y=0;y<N;y++)
   for(let x=0;x<N;x++)
    if(!snake.some(p=>p.x===x&&p.y===y))
     empty.push({x,y});
  return empty.length?
   empty[Math.floor(Math.random()*empty.length)]:null;
 }

 function draw(){
  ctx.fillStyle="#0b0e14";
  ctx.fillRect(0,0,400,400);

  ctx.strokeStyle="#ffe65c0d";
  for(let i=0;i<=N;i++){
   ctx.beginPath();
   ctx.moveTo(i*S,0);ctx.lineTo(i*S,400);
   ctx.stroke();
   ctx.beginPath();
   ctx.moveTo(0,i*S);ctx.lineTo(400,i*S);
   ctx.stroke();
  }

  if(food){
   ctx.fillStyle="#ff5a76";
   ctx.shadowColor="#ff284c";
   ctx.shadowBlur=12;
   ctx.fillRect(food.x*S+4,food.y*S+4,S-8,S-8);
   ctx.shadowBlur=0;
  }

  snake.forEach((part,i)=>{
   ctx.fillStyle=i===0?"#fff4ad":"#ffe65c";
   ctx.shadowColor="#ffd400";
   ctx.shadowBlur=i===0?12:3;
   ctx.fillRect(part.x*S+2,part.y*S+2,S-4,S-4);
  });
  ctx.shadowBlur=0;
 }

 function stop(){
  clearInterval(timer);
  timer=null;
 }

 function start(){
  stop();
  snake=[{x:5,y:10},{x:4,y:10},{x:3,y:10}];
  direction={x:1,y:0};
  next={x:1,y:0};
  food=randomFood();
  score=0;running=true;paused=false;
  scoreEl.textContent="SCORE: 0";
  message.textContent="PLAYING";
  area.querySelector("#pause").textContent="PAUSE";
  draw();
  timer=setInterval(step,115);
 }

 function end(){
  running=false;
  stop();
  message.textContent="GAME OVER — PRESS RESTART";
 }

 function step(){
  if(!running||paused)return;
  direction=next;
  const head={
   x:snake[0].x+direction.x,
   y:snake[0].y+direction.y
  };

  const eating=food&&head.x===food.x&&head.y===food.y;
  const body=eating?snake:snake.slice(0,-1);

  if(
   head.x<0||head.y<0||head.x>=N||head.y>=N||
   body.some(p=>p.x===head.x&&p.y===head.y)
  ){
   end();return;
  }

  snake.unshift(head);

  if(eating){
   score+=10;
   scoreEl.textContent="SCORE: "+score;
   if(score>best){
    best=score;
    bestEl.textContent="BEST: "+best;
    localStorage.setItem("mybrowser-snake-best",best);
   }
   food=randomFood();
   if(!food){
    end();
    message.textContent="YOU WIN!";
   }
  }else snake.pop();

  draw();
 }

 function setDirection(name){
  const dirs={
   up:{x:0,y:-1},down:{x:0,y:1},
   left:{x:-1,y:0},right:{x:1,y:0}
  };
  const d=dirs[name];
  if(!d)return;
  if(d.x===-direction.x&&d.y===-direction.y)return;
  next=d;
 }

 function keyHandler(e){
  const win=area.closest(".window");
  if(!win||!win.isConnected){
   window.removeEventListener("keydown",keyHandler);
   stop();
   return;
  }
  if(document.activeElement?.matches("input,textarea"))return;
  if(win.style.zIndex!==String(topZ))return;

  const map={
   ArrowUp:"up",ArrowDown:"down",
   ArrowLeft:"left",ArrowRight:"right",
   w:"up",s:"down",a:"left",d:"right"
  };
  if(map[e.key]){
   e.preventDefault();
   setDirection(map[e.key]);
  }
 }

 window.addEventListener("keydown",keyHandler);

 area.querySelectorAll("[data-dir]").forEach(b=>{
  b.onclick=()=>setDirection(b.dataset.dir);
 });
 area.querySelector("#start").onclick=start;
 area.querySelector("#pause").onclick=()=>{
  if(!running)return;
  paused=!paused;
  message.textContent=paused?"PAUSED":"PLAYING";
  area.querySelector("#pause").textContent=
   paused?"RESUME":"PAUSE";
 };

 const observer=new MutationObserver(()=>{
  if(!area.isConnected){
   stop();
   window.removeEventListener("keydown",keyHandler);
   observer.disconnect();
  }
 });
 observer.observe(document.body,{childList:true});

 snake=[{x:5,y:10},{x:4,y:10},{x:3,y:10}];
 draw();
}

/* 2048 */
function game2048App(area){
 area.innerHTML=`
 <h2>2048</h2>
 <div class="game-top">
  <span class="muted" id="score">SCORE: 0</span>
  <span class="muted" id="best">BEST: 0</span>
  <button class="primary" id="new">NEW GAME</button>
 </div>
 <div class="game-panel">
  <div class="tiles2048" id="board"></div>
  <span class="muted" id="message">
   Combine tiles to reach 2048.
  </span>
  <div class="direction-pad">
   <span></span><button class="btn" data-dir="up">↑</button><span></span>
   <button class="btn" data-dir="left">←</button>
   <button class="btn" data-dir="down">↓</button>
   <button class="btn" data-dir="right">→</button>
  </div>
  <p class="muted">Use arrow keys or WASD.</p>
 </div>`;

 const boardEl=area.querySelector("#board");
 const scoreEl=area.querySelector("#score");
 const bestEl=area.querySelector("#best");
 const message=area.querySelector("#message");

 let board=[],score=0,won=false,ended=false;
 let best=Number(localStorage.getItem("mybrowser-2048-best")||0);
 bestEl.textContent="BEST: "+best;

 function emptyCells(){
  const result=[];
  for(let r=0;r<4;r++)
   for(let c=0;c<4;c++)
    if(board[r][c]===0)result.push([r,c]);
  return result;
 }

 function spawn(){
  const empty=emptyCells();
  if(!empty.length)return;
  const [r,c]=empty[Math.floor(Math.random()*empty.length)];
  board[r][c]=Math.random()<.9?2:4;
 }

 function render(){
  boardEl.replaceChildren();
  for(let r=0;r<4;r++){
   for(let c=0;c<4;c++){
    const value=board[r][c];
    const tile=document.createElement("div");
    tile.className="tile2048";
    tile.dataset.v=value;
    tile.textContent=value||"";
    if(value>4096){
     tile.style.background="#ad85ff";
    }
    boardEl.appendChild(tile);
   }
  }
  scoreEl.textContent="SCORE: "+score;
  bestEl.textContent="BEST: "+best;
 }

 function newGame(){
  board=Array.from({length:4},()=>[0,0,0,0]);
  score=0;won=false;ended=false;
  spawn();spawn();
  message.textContent="Combine tiles to reach 2048.";
  render();
 }

 function merge(line){
  const values=line.filter(v=>v!==0);
  const result=[];
  for(let i=0;i<values.length;i++){
   if(values[i]===values[i+1]){
    const value=values[i]*2;
    result.push(value);
    score+=value;
    if(value>=2048&&!won){
     won=true;
     message.textContent="YOU REACHED 2048!";
    }
    i++;
   }else result.push(values[i]);
  }
  while(result.length<4)result.push(0);
  return result;
 }

 function canMove(){
  if(emptyCells().length)return true;
  for(let r=0;r<4;r++){
   for(let c=0;c<4;c++){
    if(r<3&&board[r][c]===board[r+1][c])return true;
    if(c<3&&board[r][c]===board[r][c+1])return true;
   }
  }
  return false;
 }

 function move(direction){
  if(ended)return;
  const before=JSON.stringify(board);

  for(let i=0;i<4;i++){
   let line=[];

   for(let j=0;j<4;j++){
    if(direction==="left")line.push(board[i][j]);
    if(direction==="right")line.push(board[i][3-j]);
    if(direction==="up")line.push(board[j][i]);
    if(direction==="down")line.push(board[3-j][i]);
   }

   const merged=merge(line);

   for(let j=0;j<4;j++){
    if(direction==="left")board[i][j]=merged[j];
    if(direction==="right")board[i][3-j]=merged[j];
    if(direction==="up")board[j][i]=merged[j];
    if(direction==="down")board[3-j][i]=merged[j];
   }
  }

  if(JSON.stringify(board)!==before){
   spawn();
   if(score>best){
    best=score;
    localStorage.setItem("mybrowser-2048-best",best);
   }
  }

  if(!canMove()){
   ended=true;
   message.textContent="GAME OVER";
  }
  render();
 }

 function keyHandler(e){
  const win=area.closest(".window");
  if(!win||!win.isConnected){
   window.removeEventListener("keydown",keyHandler);
   return;
  }
  if(document.activeElement?.matches("input,textarea"))return;
  if(win.style.zIndex!==String(topZ))return;

  const map={
   ArrowUp:"up",ArrowDown:"down",
   ArrowLeft:"left",ArrowRight:"right",
   w:"up",s:"down",a:"left",d:"right"
  };
  if(map[e.key]){
   e.preventDefault();
   move(map[e.key]);
  }
 }

 window.addEventListener("keydown",keyHandler);
 area.querySelectorAll("[data-dir]").forEach(b=>{
  b.onclick=()=>move(b.dataset.dir);
 });
 area.querySelector("#new").onclick=newGame;

 newGame();
}

/* CINEMATIC STARTUP */
(function startReboot(){
 const boot=document.getElementById("md-boot");
 const typed=document.getElementById("boot-typed");
 const main=document.getElementById("boot-main");
 const bottom=document.getElementById("boot-bottom");

 const failed=Math.random()<.5;

 const lines=[
  "SYSTEM DESIGNATION: N - 0X0010010",
  "AUTO RUN COMPLETE",
  "INITIALIZING ABSOLUTE SOLVER...",
  "LOADING CORE MODULES...",
  "CHECKING SYSTEM INTEGRITY...",
  "RESTORING CORE MEMORY...",
  "REINITIALIZING DRONE SYSTEMS..."
 ];

 let line=0,character=0;

 function typeNext(){
  if(line>=lines.length){
   finish();
   return;
  }
  const current=lines[line];
  if(character<current.length){
   typed.textContent+=current[character++];
   setTimeout(typeNext,18+Math.random()*20);
  }else{
   typed.textContent+="\n";
   line++;character=0;
   setTimeout(typeNext,160);
  }
 }

 function setMain(text){
  main.textContent=text;
  main.dataset.text=text;
 }

 function exit(){
  boot.classList.add("boot-exit");
  setTimeout(()=>boot.remove(),1150);
 }

 function finish(){
  boot.classList.add("intense");
  bottom.innerHTML=
   "SYSTEM INTEGRITY CHECK<br>&gt; FINALIZING REBOOT...";

  setTimeout(()=>{
   boot.classList.remove("intense");

   if(!failed){
    boot.classList.add("success");
    setMain("REBOOT SUCCESSFUL : )");
    bottom.innerHTML="SYSTEM ONLINE<br>WELCOME BACK_";
    setTimeout(exit,2700);
    return;
   }

   boot.classList.add("failed");
   setMain("REBOOT FAILED X D");
   bottom.innerHTML="SYSTEM ERROR<br>CODE: 0XDEAD";

   setTimeout(()=>{
    boot.classList.add("intense","jk-glitch");

    setTimeout(()=>{
     boot.classList.remove("failed","intense","jk-glitch");
     boot.classList.add("joking");
     bottom.innerHTML=
      "SYSTEM RECOVERED<br>JUST KIDDING_";
    },380);

   },1700);

   setTimeout(exit,4700);

  },1800);
 }

 setTimeout(typeNext,450);
})();

restoreTab();
