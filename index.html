
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MyBrowser</title>
<link id="tabIcon" rel="icon" href="data:,">
<style>
:root{--yellow:#ffe65c;--gold:#ffc400;--bg:#101219}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden}
body{
  color:#f6f6f6;font-family:Arial,sans-serif;
  background:#08090e url("https://wallpapercave.com/wp/wp15347483.png")
  center/cover no-repeat fixed
}
body:before{
  content:"";position:fixed;inset:0;
  background:linear-gradient(120deg,#0009,#0002,#0009);
  pointer-events:none
}
button,input,textarea,select{font:inherit}
button{cursor:pointer}
button:hover{filter:brightness(1.13)}
#desktop{position:fixed;inset:0 0 78px;pointer-events:none}
.icon{
  position:absolute;width:92px;height:90px;display:flex;
  flex-direction:column;align-items:center;justify-content:center;
  gap:9px;border:1px solid #ffe65c35;border-radius:12px;
  background:#090a1090;cursor:grab;user-select:none;
  touch-action:none;pointer-events:auto
}
.icon:hover,.icon.dragging{
  background:#ffe65c25;border-color:var(--yellow);
  box-shadow:0 0 20px #ffc40066
}
.icon svg{
  width:36px;height:36px;fill:none;stroke:var(--yellow);
  stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;
  filter:drop-shadow(0 0 6px #ffc400)
}
.icon span{font-size:11px;text-align:center;text-shadow:0 0 5px #000}
#taskbar{
  position:fixed;bottom:12px;left:50%;transform:translateX(-50%);
  max-width:98vw;display:flex;align-items:center;gap:8px;
  padding:9px 13px;border:1px solid #ffe65c77;border-radius:14px;
  background:#080a10ee;box-shadow:0 0 25px #ffc40044;z-index:9999
}
#taskApps{display:flex;gap:3px}
.task{
  width:37px;height:37px;border:0;border-radius:8px;
  background:transparent;color:var(--yellow);display:grid;place-items:center
}
.task:hover{background:#ffe65c24}
.task svg{width:23px;height:23px;fill:none;stroke:currentColor;stroke-width:1.8}
#clock{font:11px monospace;color:var(--yellow);white-space:nowrap}
.win{
  position:fixed;display:flex;flex-direction:column;
  width:760px;height:520px;max-width:96vw;
  max-height:calc(100vh - 100px);
  border:1px solid #ffe65c88;border-radius:13px;
  background:#101219f5;box-shadow:0 25px 70px #000c,0 0 25px #ffc40033;
  overflow:hidden;backdrop-filter:blur(15px);
  animation:appear .22s ease
}
@keyframes appear{from{opacity:0;transform:scale(.97)}to{opacity:1;transform:scale(1)}}
.bar{
  height:46px;min-height:46px;background:#1b1d24;
  border-bottom:1px solid #ffe65c44;display:flex;
  align-items:center;justify-content:space-between;
  padding:0 14px;color:var(--yellow);font:12px monospace;
  letter-spacing:1px;cursor:grab;user-select:none;touch-action:none
}
.close{border:1px solid #ffffff44;background:#ffffff18;color:white;border-radius:6px;padding:5px 11px}
.close:hover{background:#9f2932}
.content{
  flex:1;min-height:0;display:flex;flex-direction:column;
  gap:12px;padding:18px;overflow:auto
}
h2{color:var(--yellow);font-size:19px;margin:0}
h3{color:var(--yellow);margin:5px 0}
p{line-height:1.5}
.muted{font-size:12px;color:#adb0bd}
.field,textarea,select{
  width:100%;padding:12px;border:1px solid #ffffff3b;
  border-radius:8px;background:#1c202a;color:white;outline:none
}
.field:focus,textarea:focus{border-color:var(--yellow)}
textarea{flex:1;min-height:130px;resize:none}
.btn{
  padding:11px 14px;border:1px solid #ffffff35;
  border-radius:8px;background:#ffffff12;color:white
}
.primary{
  padding:11px 16px;border:0;border-radius:8px;
  background:var(--yellow);color:#161616;font-weight:bold
}
.row{display:flex;gap:9px;align-items:center}
.row .field{flex:1;min-width:0}
.card{
  padding:15px;background:#161a23;border:1px solid #ffe65c40;
  border-radius:10px
}
.search-home{
  padding:30px 20px;text-align:center;
  border:1px solid #ffe65c40;border-radius:12px;
  background:radial-gradient(circle,#ffe65c12,#0b0e14)
}
.search-home h1{
  margin:0 0 10px;font-size:clamp(24px,5vw,42px);
  letter-spacing:4px;color:var(--yellow);
  text-shadow:0 0 18px #ffc40088
}
.result{padding:15px;margin-bottom:10px;border:1px solid #ffe65c35;border-radius:9px;background:#171b24}
.result h3{font-size:15px;margin:0 0 6px}
.result .url{font-size:11px;color:#aeb3c2;overflow-wrap:anywhere}
.result p{font-size:13px;line-height:1.5}
.terminal{
  flex:1;overflow:auto;white-space:pre-wrap;
  font:13px/1.6 monospace;color:var(--yellow)
}
.calc{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.calc button{
  padding:15px 4px;background:#ffffff15;color:white;
  border:1px solid #ffffff33;border-radius:8px;font-size:19px
}
#boot{
  position:fixed;inset:0;z-index:20000;background:#050608;
  display:flex;align-items:center;justify-content:center;
  flex-direction:column;gap:18px;color:var(--yellow);
  font:16px monospace;text-align:center;padding:20px
}
#boot h1{font-size:clamp(28px,7vw,55px);letter-spacing:5px;text-shadow:0 0 25px #ffc400}
#bootTrack{width:min(380px,80vw);height:10px;border:1px solid var(--yellow)}
#bootFill{height:100%;width:0;background:var(--yellow);box-shadow:0 0 15px #ffc400}
#boot.glitch{animation:glitch .12s infinite}
@keyframes glitch{
  0%{transform:translate(0)}
  30%{transform:translate(3px,-2px)}
  60%{transform:translate(-3px,2px)}
  100%{transform:translate(0)}
}
@media(max-width:600px){
  #taskbar{gap:4px;padding:7px}
  .task{width:31px;height:34px}
  .task svg{width:19px}
  .content{padding:12px}
  .icon{width:78px;height:82px}
}
</style>
</head>
<body>

<div id="desktop"></div>
<div id="taskbar">
  <span style="color:var(--yellow);font-weight:bold;font-size:12px">MB</span>
  <div id="taskApps"></div>
  <span id="clock"></span>
</div>

<div id="boot">
  <h1>MYBROWSER</h1>
  <div id="bootText">INITIALIZING SYSTEM...</div>
  <div id="bootTrack"><div id="bootFill"></div></div>
</div>

<script>
"use strict";

const WORKER_URL =
  "https://mybrowser-search.gosha7258.workers.dev/";

const APPS = [
  ["browser","Browser"],
  ["files","Files"],
  ["editor","Text Editor"],
  ["terminal","Terminal"],
  ["calculator","Calculator"],
  ["cloaking","Cloaking"],
  ["about","About"]
];

const ICONS = {
  browser:'<circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c-5 5-5 13 0 18M12 3c5 5 5 13 0 18"/>',
  files:'<path d="M3 7V5h7l2 3h9v11H3z"/>',
  editor:'<path d="M5 3h10l4 4v14H5zM15 3v5h4M8 12h8M8 16h7"/>',
  terminal:'<rect x="2" y="3" width="20" height="18" rx="2"/><path d="m6 8 4 4-4 4M12 16h6"/>',
  calculator:'<rect x="5" y="2" width="14" height="20" rx="2"/><path d="M8 6h8M8 11h2M14 11h2M8 15h2M14 15h2M8 19h8"/>',
  cloaking:'<path d="M12 3 3 7v5c0 6 4 9 9 10 5-1 9-4 9-10V7zM8 12l3 3 5-6"/>',
  about:'<circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7v1"/>'
};

function svg(id){
  return '<svg viewBox="0 0 24 24">'+ICONS[id]+'</svg>';
}

const desktop=document.getElementById("desktop");
const taskApps=document.getElementById("taskApps");
let topZ=20;
let windowCount=0;

let positions={};
try{
  positions=JSON.parse(
    localStorage.getItem("mybrowser-layout-v3")||"{}"
  );
}catch(e){positions={};}

function savePositions(){
  localStorage.setItem("mybrowser-layout-v3",JSON.stringify(positions));
}

APPS.forEach(([id,name],index)=>{
  const icon=document.createElement("div");
  icon.className="icon";
  icon.innerHTML=svg(id)+"<span>"+name+"</span>";
  icon.dataset.app=id;

  const fallback={x:20+(index%3)*105,y:20+Math.floor(index/3)*105};
  const pos=positions[id]||fallback;
  icon.style.left=pos.x+"px";
  icon.style.top=pos.y+"px";

  desktop.appendChild(icon);

  let startX,startY,initialX,initialY,moved=false;

  icon.addEventListener("pointerdown",e=>{
    if(e.button!==0)return;
    icon.setPointerCapture(e.pointerId);
    startX=e.clientX;startY=e.clientY;
    initialX=icon.offsetLeft;initialY=icon.offsetTop;
    moved=false;
    icon.classList.add("dragging");
  });

  icon.addEventListener("pointermove",e=>{
    if(!icon.hasPointerCapture(e.pointerId))return;
    const dx=e.clientX-startX,dy=e.clientY-startY;
    if(Math.abs(dx)+Math.abs(dy)>6)moved=true;
    if(!moved)return;

    const x=Math.max(0,Math.min(
      innerWidth-icon.offsetWidth,initialX+dx
    ));
    const y=Math.max(0,Math.min(
      innerHeight-100-icon.offsetHeight,initialY+dy
    ));

    icon.style.left=x+"px";
    icon.style.top=y+"px";
  });

  icon.addEventListener("pointerup",e=>{
    icon.classList.remove("dragging");
    positions[id]={x:icon.offsetLeft,y:icon.offsetTop};
    savePositions();
    if(!moved)openApp(id);
  });

  const task=document.createElement("button");
  task.className="task";
  task.title=name;
  task.innerHTML=svg(id);
  task.onclick=()=>openApp(id);
  taskApps.appendChild(task);
});

function makeWindow(id,title){
  const existing=document.querySelector(
    '.win[data-app="'+id+'"]'
  );
  if(existing){
    existing.style.zIndex=++topZ;
    return null;
  }

  const win=document.createElement("div");
  win.className="win";
  win.dataset.app=id;
  win.style.left=Math.max(5,Math.min(
    innerWidth-300,110+windowCount*25
  ))+"px";
  win.style.top=Math.max(5,Math.min(
    innerHeight-200,60+windowCount*22
  ))+"px";
  win.style.zIndex=++topZ;
  windowCount=(windowCount+1)%9;

  const bar=document.createElement("div");
  bar.className="bar";

  const heading=document.createElement("span");
  heading.textContent="◆ "+title.toUpperCase();

  const close=document.createElement("button");
  close.className="close";
  close.textContent="✕";
  close.onclick=()=>win.remove();

  bar.append(heading,close);

  const area=document.createElement("div");
  area.className="content";

  win.append(bar,area);
  document.body.appendChild(win);
  win.addEventListener("pointerdown",()=>win.style.zIndex=++topZ);

  let dragging=false,sx=0,sy=0,ox=0,oy=0;

  bar.addEventListener("pointerdown",e=>{
    if(e.target===close)return;
    dragging=true;
    sx=e.clientX;sy=e.clientY;
    ox=win.offsetLeft;oy=win.offsetTop;
    bar.setPointerCapture(e.pointerId);
    win.style.zIndex=++topZ;
  });

  bar.addEventListener("pointermove",e=>{
    if(!dragging)return;
    win.style.left=Math.max(0,Math.min(
      innerWidth-90,ox+e.clientX-sx
    ))+"px";
    win.style.top=Math.max(0,Math.min(
      innerHeight-90,oy+e.clientY-sy
    ))+"px";
  });

  bar.addEventListener("pointerup",()=>dragging=false);
  bar.addEventListener("pointercancel",()=>dragging=false);

  return area;
}

function openApp(id){
  const name=APPS.find(a=>a[0]===id)?.[1];
  if(!name)return;

  const area=makeWindow(id,name);
  if(!area)return;

  if(id==="browser")browserApp(area);
  if(id==="files")filesApp(area);
  if(id==="editor")editorApp(area);
  if(id==="terminal")terminalApp(area);
  if(id==="calculator")calculatorApp(area);
  if(id==="cloaking")cloakingApp(area);
  if(id==="about")aboutApp(area);
}

/* TAVILY BROWSER */

function browserApp(area){
  area.innerHTML=`
    <div class="search-home">
      <h1>MYBROWSER</h1>
      <p class="muted">WEB SEARCH // POWERED BY TAVILY</p>
      <div class="row" style="max-width:590px;margin:20px auto 0">
        <input class="field" id="query" placeholder="Search the web...">
        <button class="primary" id="search">SEARCH</button>
      </div>
    </div>
    <div id="searchStatus" class="muted"></div>
    <div id="results"></div>
  `;

  const query=area.querySelector("#query");
  const button=area.querySelector("#search");
  const status=area.querySelector("#searchStatus");
  const results=area.querySelector("#results");

  async function search(){
    const q=query.value.trim();
    if(!q)return;

    button.disabled=true;
    button.textContent="WAIT...";
    status.textContent="Searching the web...";
    results.replaceChildren();

    try{
      const response=await fetch(WORKER_URL,{
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body:JSON.stringify({query:q})
      });

      const data=await response.json();

      if(!response.ok){
        throw new Error(data.error||"Server error");
      }

      const items=data.results||[];
      status.textContent=items.length+
        " search results for \""+q+"\"";

      if(items.length===0){
        status.textContent="No results found. Try another search.";
      }

      for(const item of items){
        const card=document.createElement("div");
        card.className="result";

        const title=document.createElement("h3");
        title.textContent=item.title||"Untitled";

        const url=document.createElement("div");
        url.className="url";
        url.textContent=item.url||"";

        const description=document.createElement("p");
        description.textContent=item.description||"No description available.";

        const copy=document.createElement("button");
        copy.className="btn";
        copy.textContent="COPY WEBSITE LINK";
        copy.onclick=async()=>{
          try{
            await navigator.clipboard.writeText(item.url||"");
            copy.textContent="COPIED!";
          }catch(e){
            copy.textContent="COPY FAILED";
          }
        };

        card.append(title,url,description,copy);
        results.appendChild(card);
      }

    }catch(err){
      status.textContent=
        "Search connection failed: "+err.message+
        ". Check your Cloudflare Worker, API key, and allowed origin.";
    }finally{
      button.disabled=false;
      button.textContent="SEARCH";
    }
  }

  button.onclick=search;
  query.onkeydown=e=>{
    if(e.key==="Enter")search();
  };
}

/* FILES */

function filesApp(area){
  area.innerHTML=`
    <h2>FILE MANAGER</h2>
    <p class="muted">Select files from your device to view their details.</p>
    <input type="file" id="picker" multiple class="field">
    <div id="fileList"></div>
  `;

  area.querySelector("#picker").onchange=e=>{
    const list=area.querySelector("#fileList");
    list.replaceChildren();

    for(const file of e.target.files){
      const card=document.createElement("div");
      card.className="card";
      card.textContent=file.name+" — "+file.size+" bytes";
      list.appendChild(card);
    }
  };
}

/* TEXT EDITOR */

function editorApp(area){
  area.innerHTML=`
    <h2>TEXT EDITOR</h2>
    <p class="muted">Notes are saved in this browser.</p>
    <textarea id="notes" placeholder="Start typing..."></textarea>
    <div class="row">
      <button class="primary" id="save">SAVE NOTES</button>
      <span class="muted" id="saveStatus"></span>
    </div>
  `;

  const notes=area.querySelector("#notes");
  notes.value=localStorage.getItem("mybrowser-notes")||"";

  area.querySelector("#save").onclick=()=>{
    localStorage.setItem("mybrowser-notes",notes.value);
    area.querySelector("#saveStatus").textContent="Saved!";
  };
}

/* SIMULATED TERMINAL */

function terminalApp(area){
  area.innerHTML=`
    <h2>SYSTEM TERMINAL</h2>
    <div class="terminal" id="output">MYBROWSER TERMINAL v1.0
Type HELP to see available commands.

</div>
    <input class="field" id="command" placeholder="Enter command...">
  `;

  const output=area.querySelector("#output");
  const input=area.querySelector("#command");

  input.onkeydown=e=>{
    if(e.key!=="Enter")return;

    const command=input.value.trim();
    const cmd=command.toLowerCase();
    input.value="";

    if(cmd==="clear"){
      output.textContent="";
      return;
    }

    let answer="Unknown command. Type HELP.";

    if(cmd==="help"){
      answer="COMMANDS: HELP, DATE, TIME, ABOUT, APPS, CLEAR, REBOOT, ECHO";
    }else if(cmd==="date"){
      answer=new Date().toDateString();
    }else if(cmd==="time"){
      answer=new Date().toLocaleTimeString();
    }else if(cmd==="about"){
      answer="MyBrowser // Custom Web Desktop";
    }else if(cmd==="apps"){
      answer=APPS.map(a=>a[1]).join(", ");
    }else if(cmd==="reboot"){
      location.reload();
      return;
    }else if(cmd.startsWith("echo ")){
      answer=command.slice(5);
    }

    output.textContent+="> "+command+"\n"+answer+"\n\n";
    output.scrollTop=output.scrollHeight;
  };
}

/* CALCULATOR */

function calculatorApp(area){
  area.innerHTML=`
    <h2>CALCULATOR</h2>
    <input class="field" id="display" readonly value="0"
      style="font-size:25px;text-align:right">
    <div class="calc" id="keys"></div>
  `;

  const display=area.querySelector("#display");
  const keys=area.querySelector("#keys");
  const labels=[
    "7","8","9","÷",
    "4","5","6","×",
    "1","2","3","−",
    "C","0",".","+",
    "(",")","⌫","="
  ];

  let expression="";

  labels.forEach(label=>{
    const button=document.createElement("button");
    button.textContent=label;

    button.onclick=()=>{
      if(label==="C"){
        expression="";
      }else if(label==="⌫"){
        expression=expression.slice(0,-1);
      }else if(label==="="){
        try{
          const normalized=expression
            .replaceAll("×","*")
            .replaceAll("÷","/")
            .replaceAll("−","-");

          if(!/^[0-9+\-*/().\s]+$/.test(normalized)){
            throw new Error("Invalid expression");
          }

          const tokens=normalized.match(
            /\d+(?:\.\d+)?|\.\d+|[()+\-*/]/g
          );

          if(!tokens||tokens.join("")!==normalized.replace(/\s/g,"")){
            throw new Error("Invalid expression");
          }

          let index=0;
          function parseExpression(){
            let value=parseTerm();
            while(tokens[index]==="+"||tokens[index]==="-"){
              const op=tokens[index++];
              const next=parseTerm();
              value=op==="+"?value+next:value-next;
            }
            return value;
          }
          function parseTerm(){
            let value=parseFactor();
            while(tokens[index]==="*"||tokens[index]==="/"){
              const op=tokens[index++];
              const next=parseFactor();
              value=op==="*"?value*next:value/next;
            }
            return value;
          }
          function parseFactor(){
            const token=tokens[index++];
            if(token==="+")return parseFactor();
            if(token==="-")return -parseFactor();
            if(token==="("){
              const value=parseExpression();
              if(tokens[index++]!==")")throw new Error("Missing )");
              return value;
            }
            const value=Number(token);
            if(!Number.isFinite(value))throw new Error("Invalid number");
            return value;
          }

          const value=parseExpression();
          if(index!==tokens.length||!Number.isFinite(value)){
            throw new Error("Invalid result");
          }
          expression=String(Number(value.toPrecision(12)));
        }catch(e){
          expression="";
          display.value="ERROR";
          return;
        }
      }else{
        expression+=label;
      }

      display.value=expression||"0";
    };

    keys.appendChild(button);
  });
}

/* TAB CUSTOMIZATION */

const DEFAULT_ICON="data:,";
const CLOAK_PRESETS={
  "MyBrowser":{title:"MyBrowser",icon:DEFAULT_ICON},
  "Study Workspace":{title:"Study Workspace",icon:DEFAULT_ICON},
  "Learning Hub":{title:"Learning Hub",icon:DEFAULT_ICON},
  "Documents":{title:"Documents",icon:DEFAULT_ICON},
  "System Core":{title:"System Core",icon:DEFAULT_ICON}
};

function setTab(title,icon){
  document.title=title;
  document.getElementById("tabIcon").href=icon||DEFAULT_ICON;
}

function applySavedTab(){
  try{
    const saved=JSON.parse(localStorage.getItem("mybrowser-cloak"));
    if(saved&&saved.title)setTab(saved.title,saved.icon);
  }catch(e){}
}

function cloakingApp(area){
  area.innerHTML=`
    <h2>TAB CUSTOMIZATION</h2>
    <p class="muted">
      Change this page's tab title and favicon.
      This does not change its URL or hide activity from school management.
    </p>
    <div class="card">
      <p>Preset</p>
      <select id="preset" class="field">
        <option>MyBrowser</option>
        <option>Study Workspace</option>
        <option>Learning Hub</option>
        <option>Documents</option>
        <option>System Core</option>
        <option>Custom</option>
      </select>
      <p>Tab title</p>
      <input id="customTitle" class="field" placeholder="Custom tab title">
      <p>Favicon URL</p>
      <input id="customIcon" class="field" value="https://">
      <p class="muted" id="preview"></p>
      <div class="row" style="flex-wrap:wrap">
        <button class="primary" id="apply">APPLY</button>
        <button class="btn" id="reset">RESET TO DEFAULT</button>
      </div>
      <p class="muted" id="cloakStatus"></p>
    </div>
  `;

  const preset=area.querySelector("#preset");
  const title=area.querySelector("#customTitle");
  const icon=area.querySelector("#customIcon");
  const preview=area.querySelector("#preview");
  const status=area.querySelector("#cloakStatus");

  function updatePreview(){
    const chosen=CLOAK_PRESETS[preset.value];
    preview.textContent="Preview: "+
      (chosen?chosen.title:title.value||"Custom");
  }

  preset.onchange=()=>{
    const chosen=CLOAK_PRESETS[preset.value];
    if(chosen){
      title.value=chosen.title;
      icon.value="https://";
    }
    updatePreview();
  };

  title.oninput=updatePreview;
  preset.onchange();

  area.querySelector("#apply").onclick=()=>{
    const chosen=CLOAK_PRESETS[preset.value];
    const newTitle=chosen?chosen.title:title.value.trim();
    let newIcon=DEFAULT_ICON;

    if(!newTitle){
      status.textContent="Enter a tab title.";
      return;
    }

    if(!chosen&&icon.value.trim()!=="https://"){
      try{
        const parsed=new URL(icon.value.trim());
        if(parsed.protocol!=="https:")throw new Error();
        newIcon=parsed.href;
      }catch(e){
        status.textContent="Enter a valid HTTPS favicon URL.";
        return;
      }
    }

    setTab(newTitle,newIcon);
    localStorage.setItem("mybrowser-cloak",
      JSON.stringify({title:newTitle,icon:newIcon})
    );
    status.textContent="Cloak applied successfully.";
  };

  area.querySelector("#reset").onclick=()=>{
    localStorage.removeItem("mybrowser-cloak");
    setTab("MyBrowser",DEFAULT_ICON);
    preset.value="MyBrowser";
    preset.onchange();
    status.textContent="Restored default tab.";
  };
}

/* CLOCK */

function updateClock(){
  document.getElementById("clock").textContent=
    new Date().toLocaleTimeString([],{hour:"2-digit",minute:"2-digit"});
}
updateClock();
setInterval(updateClock,15000);

/* BOOT ANIMATION */

function reboot(){
  const boot=document.getElementById("boot");
  const fill=document.getElementById("bootFill");
  const text=document.getElementById("bootText");
  const failed=Math.random()<0.5;
  let progress=0;

  const timer=setInterval(()=>{
    progress=Math.min(100,progress+Math.random()*16+5);
    fill.style.width=progress+"%";

    if(progress<35)text.textContent="LOADING SYSTEM MODULES...";
    else if(progress<70)text.textContent="CONNECTING DESKTOP...";
    else text.textContent="FINALIZING BOOT...";

    if(progress>=100){
      clearInterval(timer);
      boot.classList.add("glitch");
      text.textContent=failed?
        "REBOOT FAILED X D":"REBOOT SUCCESSFUL : )";

      setTimeout(()=>{
        boot.remove();
      },1100);
    }
  },120);
}

applySavedTab();
reboot();
