
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#090a0e">
<title>MyBrowser // Desktop</title>
<link id="site-favicon" rel="icon" href="data:,">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700;800&family=Share+Tech+Mono&display=swap" rel="stylesheet">

<style>
:root {
  --yellow:#ffe65c;
  --gold:#ffc400;
  --panel:#0b0d13f2;
  --border:#ffe65c55;
  --text:#f3f0e6;
  --muted:#a9aab0;
}
* {box-sizing:border-box}
html,body {width:100%;height:100%;margin:0}
body {
  overflow:hidden;
  color:var(--text);
  font-family:Arial,Helvetica,sans-serif;
  background:#08090d
    url("https://wallpapercave.com/wp/wp15347483.png")
    center center/cover no-repeat fixed;
}
body::before {
  content:"";
  position:fixed;
  inset:0;
  pointer-events:none;
  background:linear-gradient(110deg,#0008,#0002 65%,#0007);
}
button,input,textarea,select {font:inherit}
button {cursor:pointer}
button:focus-visible,input:focus-visible,
select:focus-visible,textarea:focus-visible,
.app:focus-visible {
  outline:2px solid var(--yellow);
  outline-offset:2px;
}
::selection {background:#ffe65c66;color:white}

/* DESKTOP */
#desktop {
  position:absolute;
  top:20px;
  left:18px;
  bottom:90px;
  display:grid;
  grid-template-columns:repeat(4,91px);
  grid-auto-rows:96px;
  align-content:start;
  gap:9px;
  max-width:calc(100vw - 20px);
  overflow-y:auto;
  overflow-x:hidden;
  padding:5px 6px 20px 3px;
  scrollbar-width:thin;
  scrollbar-color:#ffe65c55 transparent;
}
.app {
  width:91px;
  height:96px;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  gap:10px;
  padding:10px 4px;
  border-radius:12px;
  border:1px solid #ffe65c18;
  background:#080a0e33;
  color:white;
  user-select:none;
  cursor:pointer;
  transition:
    transform .23s cubic-bezier(.2,.8,.2,1),
    background .23s,
    border-color .23s,
    box-shadow .23s;
}
.app:hover,.app:focus-visible {
  transform:translateY(-4px) scale(1.035);
  background:#ffe65c18;
  border-color:#ffe65cbb;
  box-shadow:
    0 0 14px #ffe65c55,
    0 0 30px #ffc40025,
    inset 0 0 12px #ffe65c12;
}
.app:active {transform:scale(.95)}
.app-icon {
  display:grid;
  place-items:center;
  width:42px;
  height:42px;
  flex:none;
}
.app-icon img {
  width:38px;
  height:38px;
  object-fit:contain;
  filter:
    drop-shadow(0 0 5px #ffe65c)
    drop-shadow(0 0 12px #ffd000)
    drop-shadow(0 0 19px #ffbf0066);
  transition:transform .23s,filter .23s;
}
.app-icon svg {
  width:35px;
  height:35px;
  fill:none;
  stroke:var(--yellow);
  stroke-width:1.7;
  stroke-linecap:round;
  stroke-linejoin:round;
  filter:
    drop-shadow(0 0 5px #ffe65c)
    drop-shadow(0 0 13px #ffc40088);
  transition:transform .23s,filter .23s;
}
.app:hover .app-icon img,
.app:hover .app-icon svg {
  transform:scale(1.1);
  filter:
    drop-shadow(0 0 8px #fff8c0)
    drop-shadow(0 0 20px #ffe000)
    drop-shadow(0 0 32px #ffc400);
}
.app-name {
  max-width:85px;
  font-size:11px;
  font-weight:500;
  line-height:1.3;
  text-align:center;
  text-shadow:0 1px 6px #000,0 0 10px #ffe65c77;
}

/* TASKBAR */
#dock {
  position:fixed;
  bottom:17px;
  left:50%;
  transform:translateX(-50%);
  display:flex;
  align-items:center;
  gap:6px;
  padding:9px 12px;
  max-width:97vw;
  border:1px solid #ffe65c8c;
  border-radius:15px;
  background:#090b10ee;
  box-shadow:0 0 26px #ffc40035,0 12px 40px #0008;
  backdrop-filter:blur(20px);
  z-index:9000;
  transition:box-shadow .25s;
}
#dock:hover {box-shadow:0 0 38px #ffc40055}
.system-label,#clock {
  color:var(--yellow);
  font:10px Orbitron,monospace;
  white-space:nowrap;
  text-shadow:0 0 9px #ffc400;
}
.system-label {margin-right:9px}
#clock {margin-left:9px}
.dock-button {
  width:39px;
  height:39px;
  display:grid;
  place-items:center;
  padding:7px;
  border:0;
  border-radius:9px;
  background:transparent;
  color:var(--yellow);
  transition:background .2s,transform .2s,filter .2s;
  filter:drop-shadow(0 0 5px #ffc40088);
}
.dock-button:hover {
  background:#ffe65c20;
  transform:translateY(-4px);
  filter:drop-shadow(0 0 12px #ffe000);
}
.dock-button svg {
  width:23px;
  height:23px;
  fill:none;
  stroke:currentColor;
  stroke-width:1.7;
  stroke-linecap:round;
  stroke-linejoin:round;
}

/* WINDOWS */
#windows {position:relative;z-index:10}
.window {
  position:absolute;
  display:flex;
  flex-direction:column;
  width:730px;
  height:490px;
  max-width:95vw;
  max-height:calc(100vh - 105px);
  overflow:hidden;
  border:1px solid var(--border);
  border-radius:12px;
  background:var(--panel);
  box-shadow:
    0 25px 75px #000b,
    0 0 23px #ffc40020;
  backdrop-filter:blur(18px);
  animation:windowIn .26s cubic-bezier(.2,.8,.2,1) both;
}
.window.closing {
  pointer-events:none;
  animation:windowOut .18s ease-in forwards;
}
@keyframes windowIn {
  from {opacity:0;transform:translateY(13px) scale(.97)}
  to {opacity:1;transform:translateY(0) scale(1)}
}
@keyframes windowOut {
  to {opacity:0;transform:translateY(9px) scale(.97)}
}
.titlebar {
  min-height:45px;
  padding:0 13px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  background:linear-gradient(90deg,#1a1a16,#101218);
  border-bottom:1px solid #ffe65c28;
  color:var(--yellow);
  font:11px Orbitron,monospace;
  letter-spacing:.6px;
  cursor:grab;
  user-select:none;
  touch-action:none;
}
.titlebar:active {cursor:grabbing}
.titlebar button {
  border:1px solid #ffffff25;
  border-radius:6px;
  background:#ffffff12;
  color:white;
  padding:5px 10px;
  transition:background .18s;
}
.titlebar button:hover {background:#ad2836}
.content {
  flex:1;
  min-height:0;
  overflow:auto;
  display:flex;
  flex-direction:column;
  gap:12px;
  padding:17px;
}
.content h2 {
  margin:0 0 4px;
  font:16px Orbitron,monospace;
  color:var(--yellow);
}
.content p {line-height:1.55}
.toolbar {display:flex;gap:8px;flex-wrap:wrap}
.action,.toolbar button {
  padding:10px 13px;
  border:1px solid #ffffff2c;
  border-radius:7px;
  background:#ffffff12;
  color:white;
  transition:border-color .2s,background .2s;
}
.action:hover,.toolbar button:hover {
  border-color:var(--yellow);
  background:#ffe65c16;
}
.field,.toolbar input {
  min-width:0;
  padding:11px;
  border:1px solid #ffffff30;
  border-radius:7px;
  background:#ffffff0d;
  color:white;
}
.toolbar input {flex:1}
select.field option {background:#181b23;color:white}
textarea {
  flex:1;
  min-height:120px;
  padding:13px;
  resize:none;
  border:1px solid #ffffff30;
  border-radius:8px;
  background:#ffffff0c;
  color:white;
}
iframe {
  flex:1;
  width:100%;
  min-height:150px;
  border:0;
  border-radius:7px;
  background:white;
}
.muted {font-size:12px;color:var(--muted)}
.calc {
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:9px;
}
.calc button {
  padding:15px;
  border:1px solid #ffffff20;
  border-radius:7px;
  background:#ffffff14;
  color:white;
  font-size:19px;
}
.calc button:hover {
  background:#ffe65c22;
  border-color:#ffe65c88;
}
.terminal-output {
  flex:1;
  min-height:150px;
  overflow:auto;
  white-space:pre-wrap;
  color:var(--yellow);
  font:14px "Share Tech Mono",monospace;
}

/* TAB CUSTOMIZATION */
.tab-panel {
  padding:17px;
  border:1px solid #ffe65c50;
  border-radius:12px;
  background:#101217;
}
.tab-section-label {
  margin:16px 0 8px;
  color:#e4cb70;
  font:11px Orbitron,monospace;
  letter-spacing:1px;
}
.tab-preview-shell {
  padding:12px 12px 0;
  border-radius:10px;
  background:#232630;
}
.tab-preview {
  display:flex;
  align-items:center;
  gap:10px;
  width:min(285px,100%);
  padding:12px;
  border-top:2px solid var(--yellow);
  border-radius:10px 10px 0 0;
  background:#383c46;
  font-size:13px;
}
.tab-preview img {
  width:19px;
  height:19px;
  object-fit:contain;
}
.tab-preview-title {
  flex:1;
  min-width:0;
  overflow:hidden;
  white-space:nowrap;
  text-overflow:ellipsis;
}
.tab-actions {display:flex;gap:10px;margin-top:18px}
.tab-actions button {flex:1}
.primary-action {
  padding:12px;
  border:0;
  border-radius:7px;
  background:var(--yellow);
  color:#17130a;
  font-weight:bold;
}
.primary-action:hover {background:#fff3a0}
.tab-feedback {min-height:17px;color:var(--yellow);font-size:12px}

/* REBOOT SCREEN */
#md-boot {
  position:fixed;
  inset:0;
  z-index:999999;
  overflow:hidden;
  background:#050507;
  color:#ffe65c;
  font-family:"Share Tech Mono",monospace;
  transition:opacity .9s ease;
}
#md-boot::before {
  content:"";
  position:absolute;
  inset:0;
  z-index:15;
  pointer-events:none;
  background:
    repeating-linear-gradient(
      0deg,#0006 0px,#0006 1px,
      transparent 2px,transparent 4px
    ),
    radial-gradient(ellipse at center,transparent 25%,#000a 100%);
}
#md-boot::after {
  content:"";
  position:absolute;
  inset:-100% 0;
  pointer-events:none;
  background:linear-gradient(transparent 47%,#ffd40012 50%,transparent 53%);
  animation:screenSweep 4s linear infinite;
}
.boot-logs {
  position:absolute;
  top:20px;
  left:22px;
  max-width:80vw;
  z-index:5;
  white-space:pre-wrap;
  font-size:clamp(11px,1.25vw,16px);
  line-height:1.55;
  letter-spacing:1.4px;
  color:#ffe86d;
  text-shadow:0 0 9px #ffc40088;
}
.boot-cursor {
  display:inline-block;
  width:9px;
  height:16px;
  vertical-align:middle;
  background:#ffe65c;
  box-shadow:0 0 10px #ffe000;
  animation:cursorBlink .7s steps(1) infinite;
}
.boot-right {
  position:absolute;
  right:20px;
  top:20px;
  z-index:5;
  text-align:right;
  font-size:12px;
  line-height:1.5;
  color:#d8b83c;
}
.boot-center {
  position:absolute;
  inset:0;
  display:grid;
  place-items:center;
  padding:20px;
  z-index:4;
}
#boot-main {
  position:relative;
  color:#fff5ac;
  font:800 clamp(23px,5.2vw,82px) Orbitron,monospace;
  letter-spacing:5px;
  text-align:center;
  white-space:nowrap;
  text-shadow:
    0 0 4px #fff,
    0 0 12px #ffe600,
    0 0 28px #ffd000,
    0 0 65px #ffb900,
    0 0 110px #ff9a00;
  animation:textFlicker 2.2s infinite,textJitter 3s infinite;
}
#boot-main::before,#boot-main::after {
  content:attr(data-text);
  position:absolute;
  inset:0;
  opacity:0;
  pointer-events:none;
}
#boot-main::before {
  color:#fff5b0;
  text-shadow:-9px 0 #ffbd00;
  animation:glitchSliceA 1.1s infinite;
}
#boot-main::after {
  color:white;
  text-shadow:9px 0 #ff9f00;
  animation:glitchSliceB 1.4s infinite;
}
.boot-bottom {
  position:absolute;
  right:22px;
  bottom:23px;
  z-index:5;
  text-align:right;
  color:#e6c74d;
  font-size:12px;
  letter-spacing:1.6px;
  text-shadow:0 0 10px #ffcc0088;
}
.boot-lowerlogs {
  position:absolute;
  bottom:22px;
  left:22px;
  z-index:5;
  color:#d6b43d;
  font-size:12px;
  line-height:1.5;
}
.glitch-strip {
  position:absolute;
  z-index:7;
  left:0;
  width:100%;
  height:4px;
  opacity:0;
  pointer-events:none;
  background:linear-gradient(90deg,transparent,#ffdd00,#fff8a5,#ffb800,transparent);
  box-shadow:0 0 20px #ffcc00;
}
.glitch-strip:nth-child(1) {top:32%;animation:stripGlitch .8s steps(2) infinite}
.glitch-strip:nth-child(2) {top:49%;animation:stripGlitch 1.1s steps(2) infinite .3s}
.glitch-strip:nth-child(3) {top:62%;animation:stripGlitch .65s steps(2) infinite .15s}
#md-boot.intense .glitch-strip {animation-duration:.18s}
#md-boot.intense #boot-main {animation-duration:.25s}
#md-boot.failed {
  background:#120205;
  box-shadow:inset 0 0 180px #ff000077;
}
#md-boot.failed #boot-main {
  color:#ff8080;
  text-shadow:0 0 8px red,0 0 25px red,0 0 70px #ff0000;
}
#md-boot.failed #boot-main::before,
#md-boot.failed #boot-main::after {
  color:#ff5555;
  text-shadow:8px 0 red;
}
#md-boot.failed .glitch-strip {
  background:#ff2538;
  box-shadow:0 0 30px red;
}
#md-boot.failed .boot-bottom {color:#ff5151}
@keyframes cursorBlink {50%{opacity:0}}
@keyframes screenSweep {to{transform:translateY(100%)}}
@keyframes textFlicker {
  0%,88%,92%,97%,100%{opacity:1}
  89%,95%{opacity:.4}
  90%,96%{opacity:.85}
}
@keyframes textJitter {
  0%,85%,100%{transform:translate(0)}
  86%{transform:translate(-5px,2px)}
  88%{transform:translate(7px,-2px)}
  90%{transform:translate(-3px,1px)}
}
@keyframes glitchSliceA {
  0%,72%,100%{opacity:0;clip-path:inset(100% 0 0 0)}
  74%{opacity:.95;transform:translate(-12px);clip-path:inset(15% 0 62% 0)}
  79%{opacity:.85;transform:translate(9px);clip-path:inset(58% 0 20% 0)}
  83%{opacity:0}
}
@keyframes glitchSliceB {
  0%,66%,100%{opacity:0;clip-path:inset(0 0 100% 0)}
  68%{opacity:.9;transform:translate(13px);clip-path:inset(42% 0 34% 0)}
  73%{opacity:.8;transform:translate(-9px);clip-path:inset(76% 0 8% 0)}
  77%{opacity:0}
}
@keyframes stripGlitch {
  0%,65%,100%{opacity:0;transform:translateX(0) scaleY(1)}
  67%{opacity:.9;transform:translateX(-18px) scaleY(3)}
  72%{opacity:.6;transform:translateX(24px) scaleY(1)}
  77%{opacity:0}
}
@media(max-width:720px) {
  #desktop {grid-template-columns:repeat(3,79px);gap:6px}
  .app {width:79px}
  .app-name {font-size:10px}
  .system-label {display:none}
  #dock {gap:2px;padding:7px}
  .dock-button {width:34px;height:36px}
  .window {max-width:96vw}
  #boot-main {font-size:clamp(17px,5vw,34px);letter-spacing:1px}
  .boot-right {display:none}
  .boot-logs {font-size:10px}
  .boot-lowerlogs,.boot-bottom {font-size:9px}
}
@media(prefers-reduced-motion:reduce) {
  .app,.dock-button,.window,#md-boot *,
  #md-boot::after {animation:none!important;transition:none!important}
}
</style>
</head>

<body>

<div id="desktop"></div>
<div id="windows"></div>

<!-- BOTTOM TASKBAR: NO SETTINGS -->
<div id="dock">
  <span class="system-label">MYBROWSER // ONLINE</span>

  <button class="dock-button" onclick="openApp('about')" title="Home">
    <svg viewBox="0 0 24 24">
      <path d="M3 10 12 3l9 7v11H3z"/>
      <path d="M9 21v-7h6v7"/>
    </svg>
  </button>

  <button class="dock-button" onclick="openApp('files')" title="Files">
    <svg viewBox="0 0 24 24">
      <path d="M3 6h7l3 3h8v11H3z"/>
    </svg>
  </button>

  <button class="dock-button" onclick="openApp('terminal')" title="Terminal">
    <svg viewBox="0 0 24 24">
      <rect x="2" y="4" width="20" height="16" rx="2"/>
      <path d="m6 9 4 3-4 3M12 16h6"/>
    </svg>
  </button>

  <button class="dock-button" onclick="openApp('browser')" title="Browser">
    <svg viewBox="0 0 24 24">
      <circle cx="12" cy="12" r="9"/>
      <path d="M3 12h18M12 3c-5 5-5 13 0 18M12 3c5 5 5 13 0 18"/>
    </svg>
  </button>

  <button class="dock-button" onclick="openApp('notes')" title="Text Editor">
    <svg viewBox="0 0 24 24">
      <path d="M5 3h11l4 4v14H5zM8 12h9M8 16h9"/>
    </svg>
  </button>

  <button class="dock-button" onclick="openApp('calculator')" title="Calculator">
    <svg viewBox="0 0 24 24">
      <rect x="5" y="2" width="14" height="20" rx="2"/>
      <path d="M8 6h8M8 11h2M14 11h2M8 15h2M14 15h2"/>
    </svg>
  </button>

  <button class="dock-button" onclick="openApp('tabs')" title="Tab Customization">
    <svg viewBox="0 0 24 24">
      <rect x="2" y="4" width="20" height="16" rx="2"/>
      <path d="M2 10h20M7 7h4"/>
    </svg>
  </button>

  <span id="clock"></span>
</div>

<!-- CINEMATIC REBOOT -->
<div id="md-boot">
  <div class="glitch-strip"></div>
  <div class="glitch-strip"></div>
  <div class="glitch-strip"></div>

  <div class="boot-logs">
    <span id="boot-typed"></span><span class="boot-cursor"></span>
  </div>

  <div class="boot-right">
    SYS://CORE<br>
    VER: ???.???<br>
    STATUS: UNKNOWN
  </div>

  <div class="boot-center">
    <div id="boot-main" data-text="REBOOTING...">REBOOTING...</div>
  </div>

  <div class="boot-lowerlogs">
    &gt; RESTORING DRONE SYSTEMS...<br>
    &gt; REINITIALIZING MEMORY BANKS...<br>
    &gt; ESTABLISHING CONNECTION...
  </div>

  <div class="boot-bottom" id="boot-bottom">
    DATA RESTORATION IN PROGRESS<br>
    &gt; PLEASE WAIT...
  </div>
</div>

<script>
/* APP ICONS */
const systemIcons={
  browser:'<circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c-5 5-5 13 0 18M12 3c5 5 5 13 0 18"/>',
  files:'<path d="M3 6h7l3 3h8v11H3z"/>',
  notes:'<path d="M5 3h11l4 4v14H5zM8 12h9M8 16h9"/>',
  terminal:'<rect x="2" y="4" width="20" height="16" rx="2"/><path d="m6 9 4 3-4 3M12 16h6"/>',
  calculator:'<rect x="5" y="2" width="14" height="20" rx="2"/><path d="M8 6h8M8 11h2M14 11h2M8 15h2M14 15h2M8 19h2M14 19h2"/>',
  tabs:'<rect x="2" y="4" width="20" height="16" rx="2"/><path d="M2 10h20M7 7h4"/>',
  about:'<circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7h.01"/>'
};

const builtinApps=[
  ["browser","Browser"],
  ["files","Files"],
  ["notes","Text Editor"],
  ["terminal","Terminal"],
  ["calculator","Calculator"],
  ["tabs","Tab Customization"],
  ["about","About"]
];

const webApps=[
  ["Google Classroom","classroom.google.com","https://classroom.google.com/"],
  ["YouTube","youtube.com","https://www.youtube.com/"],
  ["Google Drive","drive.google.com","https://drive.google.com/"],
  ["Google Docs","docs.google.com","https://docs.google.com/"],
  ["Gmail","mail.google.com","https://mail.google.com/"],
  ["Google Calendar","calendar.google.com","https://calendar.google.com/"],
  ["Wikipedia","wikipedia.org","https://www.wikipedia.org/"],
  ["GitHub","github.com","https://github.com/"],
  ["Google Maps","maps.google.com","https://maps.google.com/"],
  ["Google Sheets","sheets.google.com","https://sheets.google.com/"],
  ["Google Slides","slides.google.com","https://slides.google.com/"],
  ["Google Search","google.com","https://www.google.com/"],
  ["Khan Academy","khanacademy.org","https://www.khanacademy.org/"]
];

function faviconForDomain(domain){
  return "https://www.google.com/s2/favicons?domain="+
    encodeURIComponent(domain)+"&sz=128";
}

function addDesktopApp(name,icon,action){
  const app=document.createElement("div");
  app.className="app";
  app.tabIndex=0;
  app.setAttribute("role","button");
  app.setAttribute("aria-label","Open "+name);

  const iconBox=document.createElement("span");
  iconBox.className="app-icon";

  if(icon.startsWith("<svg")){
    iconBox.innerHTML=icon;
  }else{
    const img=document.createElement("img");
    img.src=icon;
    img.alt="";
    img.loading="lazy";
    iconBox.appendChild(img);
  }

  const label=document.createElement("span");
  label.className="app-name";
  label.textContent=name;

  app.append(iconBox,label);
  app.onclick=action;
  app.onkeydown=e=>{

      action();
    }
  };

  document.getElementById("desktop").appendChild(app);
}

/* TAB CUSTOMIZATION */
const tabPresets={
  mybrowser:{title:"MyBrowser // Desktop",icon:"system"},
  study:{title:"Study Workspace",icon:"study"},
  learning:{title:"Learning Hub",icon:"learning"},
  documents:{title:"Documents",icon:"documents"},
  core:{title:"System Core",icon:"core"}
};

const tabIconSVG={
  system:'<circle cx="32" cy="32" r="23"/><path d="M12 32h40M32 9c-14 13-14 33 0 46M32 9c14 13 14 33 0 46"/>',
  study:'<path d="M7 23 32 11l25 12-25 12zM17 30v13c10 8 20 8 30 0V30"/>',
  learning:'<path d="M8 14c10-4 18-3 24 2 6-5 14-6 24-2v35c-10-4-18-3-24 2-6-5-14-6-24-2zM32 16v35"/>',
  documents:'<path d="M16 7h23l10 10v40H16zM39 7v11h10M23 29h19M23 38h19M23 47h14"/>',
  core:'<circle cx="32" cy="32" r="12"/><circle cx="32" cy="32" r="23" stroke-dasharray="6 6"/>'
};

function tabIconData(icon){
  const paths=tabIconSVG[icon]||tabIconSVG.system;
  const svg='<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">'+
    '<rect width="64" height="64" rx="13" fill="#12141a"/>'+
    '<g fill="none" stroke="#ffe65c" stroke-width="3.5" '+
    'stroke-linecap="round" stroke-linejoin="round">'+paths+'</g></svg>';
  return "data:image/svg+xml,"+encodeURIComponent(svg);
}

function defaultTabChoice(){
  return {...tabPresets.mybrowser};
}

function getTabChoice(){
  try{
    const saved=JSON.parse(
      localStorage.getItem("mybrowser-tab-choice")
    );
    if(saved&&typeof saved.title==="string"){
      return {
        title:saved.title,
        icon:tabIconSVG[saved.icon]?saved.icon:"system"
      };
    }
  }catch(e){}
  return defaultTabChoice();
}

function applyTabChoice(choice,save=true){
  const title=String(choice.title||"MyBrowser").slice(0,60);
  const icon=tabIconSVG[choice.icon]?choice.icon:"system";

  document.title=title;
  document.getElementById("site-favicon").href=
    tabIconData(icon);

  if(save){
    localStorage.setItem(
      "mybrowser-tab-choice",
      JSON.stringify({title,icon})
    );
  }
}

applyTabChoice(getTabChoice(),false);

/* WINDOWS */
let topZ=10;
let windowCount=0;

const appTitles={
  browser:"MYBROWSER // BROWSER",
  files:"FILE MANAGER",
  notes:"TEXT EDITOR",
  terminal:"SYSTEM TERMINAL",
  calculator:"CALCULATOR",
  tabs:"TAB CUSTOMIZATION",
  about:"ABOUT MYBROWSER"
};

function closeWindow(w){
  if(w.classList.contains("closing"))return;
  w.classList.add("closing");
  setTimeout(()=>w.remove(),180);
}

function openApp(type){
  const w=document.createElement("div");
  w.className="window";
  w.style.zIndex=++topZ;

  const offset=windowCount++%6;
  w.style.left=Math.min(
    Math.max(8,(innerWidth-730)/2+offset*22),
    Math.max(8,innerWidth-150)
  )+"px";
  w.style.top=Math.min(
    65+offset*20,
    Math.max(8,innerHeight-140)
  )+"px";

  const bar=document.createElement("div");
  bar.className="titlebar";

  const heading=document.createElement("strong");
  heading.textContent=appTitles[type]||"MYBROWSER";

  const close=document.createElement("button");
  close.textContent="×";
  close.setAttribute("aria-label","Close window");
  close.onclick=()=>closeWindow(w);

  bar.append(heading,close);

  const area=document.createElement("div");
  area.className="content";

  w.append(bar,area);
  document.getElementById("windows").appendChild(w);

  w.addEventListener("pointerdown",()=>{
    w.style.zIndex=++topZ;
  });

  makeDraggable(w,bar);

  if(type==="browser")browserApp(area);
  if(type==="files")filesApp(area);
  if(type==="notes")notesApp(area);
  if(type==="terminal")terminalApp(area);
  if(type==="calculator")calculatorApp(area);
  if(type==="tabs")tabCustomizationApp(area);
  if(type==="about")aboutApp(area);
}

function makeDraggable(w,bar){
  let dragging=false,dx=0,dy=0;

  bar.addEventListener("pointerdown",e=>{
    if(e.target.closest("button"))return;
    dragging=true;
    dx=e.clientX-w.offsetLeft;
    dy=e.clientY-w.offsetTop;
    bar.setPointerCapture(e.pointerId);
  });

  bar.addEventListener("pointermove",e=>{
    if(!dragging)return;
    const maxX=Math.max(0,innerWidth-100);
    const maxY=Math.max(0,innerHeight-80);

    w.style.left=Math.max(0,Math.min(
      maxX,e.clientX-dx
    ))+"px";
    w.style.top=Math.max(0,Math.min(
      maxY,e.clientY-dy
    ))+"px";
  });

  bar.addEventListener("pointerup",()=>dragging=false);
  bar.addEventListener("pointercancel",()=>dragging=false);
}

/* BROWSER */
function browserApp(area){
  area.innerHTML=`
    <div class="toolbar">
      <button id="browser-home" title="Home">HOME</button>
      <input id="browser-address" placeholder="Search or enter a URL">
      <button id="browser-go">GO</button>
      <button id="browser-external" title="Open in new tab">OPEN ↗</button>
    </div>
    <p class="muted" style="margin:0">
      Some websites do not allow embedded browsing. Use OPEN if a page is blocked.
    </p>
    <iframe title="Embedded browser" src="about:blank"></iframe>`;

  const address=area.querySelector("#browser-address");
  const frame=area.querySelector("iframe");
  let current="";

  function navigate(){
    const value=address.value.trim();
    if(!value)return;

    if(/^https?:\/\//i.test(value)){
      current=value;
    }else if(value.includes(".")&&!value.includes(" ")){
      current="https://"+value;
    }else{
      current="https://www.google.com/search?q="+
        encodeURIComponent(value);
    }
    frame.src=current;
  }

  area.querySelector("#browser-go").onclick=navigate;
  address.onkeydown=e=>{
    if(e.key==="Enter")navigate();
  };
  area.querySelector("#browser-home").onclick=()=>{
    current="";
    address.value="";
    frame.src="about:blank";
  };
  area.querySelector("#browser-external").onclick=()=>{
    if(current)window.open(current,"_blank","noopener,noreferrer");
  };
}

/* TERMINAL SIMULATOR */
function terminalApp(area){
  area.innerHTML=`
    <div class="terminal-output">MYBROWSER SYSTEM TERMINAL
SIMULATION MODE ACTIVE
Type HELP for available commands.

</div>
    <input class="field" placeholder="Enter command">`;

  const output=area.querySelector(".terminal-output");
  const input=area.querySelector("input");

  input.onkeydown=e=>{
    if(e.key!=="Enter")return;

    const command=input.value.trim();
    const lower=command.toLowerCase();
    input.value="";

    if(lower==="clear"){
      output.textContent="";
      return;
    }

    let answer={
      help:"HELP, DATE, WHOAMI, STATUS, CLEAR, ECHO TEXT",
      date:new Date().toString(),
      whoami:"mybrowser-user",
      status:"SYSTEM ONLINE // CORE STABLE"
    }[lower];

    if(lower.startsWith("echo "))answer=command.slice(5);

    output.textContent+="> "+command+"\n"+
      (answer??"Unknown command")+"\n\n";
    output.scrollTop=output.scrollHeight;
  };
}

/* CALCULATOR */
function calculatorApp(area){
  area.innerHTML=`
    <h2>CALCULATOR</h2>
    <input class="field" id="calc-display" readonly value="0">
    <div class="calc"></div>`;

  const display=area.querySelector("#calc-display");
  const grid=area.querySelector(".calc");
  let expression="";

  for(const key of [
    "7","8","9","/",
    "4","5","6","*",
    "1","2","3","-",
    "C","0","=","+"
  ]){
    const button=document.createElement("button");
    button.textContent=key;

    button.onclick=()=>{
      if(key==="C"){
        expression="";
      }else if(key==="="){
        try{
          if(!/^[0-9+\-*/. ()]+$/.test(expression))
            throw Error("Invalid");
          const result=Function(
            '"use strict";return ('+expression+')'
          )();
          if(!Number.isFinite(result))throw Error("Invalid");
          expression=String(result);
        }catch{
          expression="Error";
        }
      }else{
        if(expression==="Error")expression="";
        expression+=key;
      }
      display.value=expression||"0";
    };
    grid.appendChild(button);
  }
}

  const preset=area.querySelector("#tab-preset");
  const title=area.querySelector("#tab-title");
  const icon=area.querySelector("#tab-icon");
  const previewTitle=area.querySelector("#preview-title");

  icon.value=saved.icon;

  function updatePreview(){
    previewTitle.textContent=title.value||"MyBrowser";
    previewIcon.src=tabIconData(icon.value);
  }

  preset.onchange=()=>{
    if(preset.value==="custom")return;
    const choice=tabPresets[preset.value];
    title.value=choice.title;
    icon.value=choice.icon;
    updatePreview();
  };

  title.oninput=()=>{

  };

  icon.onchange=()=>{

  };

  area.querySelector("#apply-tab").onclick=()=>{

  area.querySelector("#reset-tab").onclick=()=>{
    preset.value="mybrowser";
    title.value=tabPresets.mybrowser.title;
    icon.value=tabPresets.mybrowser.icon;
    applyTabChoice(tabPresets.mybrowser);
    updatePreview();
    feedback.textContent="DEFAULT APPEARANCE RESTORED";
  };

  updatePreview();
}

/* REBOOT SEQUENCE */
(function startReboot(){
  const boot=document.getElementById("md-boot");
  const typed=document.getElementById("boot-typed");
  const main=document.getElementById("boot-main");
  const bottom=document.getElementById("boot-bottom");

  const failed=Math.random()<0.5;

  const lines=[
    "> SERIAL DESIGNATION: ???",
    "> AUTO RUN COMPLETE.",
    "> INITIALIZING ABSOLUTE SOLVER...",
    "> LOADING CORE MODULES...",
    "> CHECKING SYSTEM INTEGRITY...",
    "> RESTORING CORE MEMORY...",
    "> REBOOTING, PLEASE WAIT..."
  ];

  let line=0;
  let character=0;

  function typeNext(){
    if(line>=lines.length){
      beginFinalSequence();
      return;
    }

    const current=lines[line];

    if(character<current.length){
      typed.textContent+=current[character];
      character++;
      setTimeout(typeNext,20+Math.random()*18);
    }else{
      typed.textContent+="\n";
      line++;
      character=0;
      setTimeout(typeNext,180);
    }
  }

  function setMain(text){
    main.textContent=text;
    main.setAttribute("data-text",text);
  }

  function beginFinalSequence(){
    boot.classList.add("intense");
    bottom.innerHTML=
      "SYSTEM INTEGRITY CHECK<br>&gt; FINALIZING REBOOT...";

    setTimeout(()=>{
      boot.classList.remove("intense");

      if(failed){
        boot.classList.add("failed");
        setMain("REBOOT FAILED X D");
        bottom.innerHTML=
          "CRITICAL SYSTEM ERROR<br>&gt; CODE: 0xDEAD";
      }else{
        boot.classList.add("success");
        setMain("REBOOT SUCCESSFUL : )");
        bottom.innerHTML=
          "SYSTEM ONLINE<br>&gt; WELCOME BACK_";
      }

      setTimeout(()=>{
        boot.style.opacity="0";
        setTimeout(()=>boot.remove(),900);
      },2700);
    },2300);
  }

  setTimeout(typeNext,500);
})();
</script>
