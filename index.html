
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gosha's Browser</title>
<link id="tabIcon" rel="icon" href="data:,">

<style>
:root {
  --yellow: #ffe65c;
  --gold: #ffc400;
  --panel: #101219f5;
  --border: #ffe65c77;
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
}

body {
  color: white;
  font-family: Arial, sans-serif;
  background: #090a10
    url("https://wallpapercave.com/wp/wp15347483.png")
    center / cover no-repeat fixed;
}

body::before {
  content: "";
  position: fixed;
  inset: 0;
  background: linear-gradient(120deg, #000a, #0002, #0009);
  pointer-events: none;
}

button, input, textarea, select { font: inherit; }
button { cursor: pointer; }
button:hover { filter: brightness(1.14); }
button:disabled { opacity: .4; cursor: not-allowed; }

h2 {
  color: var(--yellow);
  font-size: 19px;
  margin: 0;
}

h3 { color: var(--yellow); }

.muted {
  color: #b1b5c2;
  font-size: 12px;
  line-height: 1.5;
}

.field, textarea, select {
  width: 100%;
  min-width: 0;
  padding: 11px;
  color: white;
  background: #1b202a;
  border: 1px solid #ffffff40;
  border-radius: 8px;
  outline: none;
}

.field:focus, textarea:focus, select:focus {
  border-color: var(--yellow);
}

textarea {
  flex: 1;
  min-height: 130px;
  resize: none;
}

.btn {
  padding: 10px 13px;
  color: white;
  background: #ffffff13;
  border: 1px solid #ffffff38;
  border-radius: 8px;
}

.primary {
  padding: 10px 15px;
  color: #171717;
  background: var(--yellow);
  border: none;
  border-radius: 8px;
  font-weight: bold;
}

.row {
  display: flex;
  align-items: center;
  gap: 8px;
}

.card {
  padding: 15px;
  background: #161a23;
  border: 1px solid #ffe65c40;
  border-radius: 10px;
}

/* DESKTOP */

#desktop {
  position: fixed;
  inset: 0 0 82px;
  pointer-events: auto;
  touch-action: none;
}

.desktop-icon {
  position: absolute;
  width: 94px;
  height: 94px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 9px;
  background: #090a1090;
  border: 1px solid #ffe65c35;
  border-radius: 12px;
  cursor: grab;
  user-select: none;
  touch-action: none;
  pointer-events: auto;
}

.desktop-icon:hover,
.desktop-icon.dragging {
  background: #ffe65c25;
  border-color: var(--yellow);
  box-shadow: 0 0 20px #ffc40066;
}

.desktop-icon svg {
  width: 36px;
  height: 36px;
  fill: none;
  stroke: var(--yellow);
  stroke-width: 1.8;
  stroke-linecap: round;
  stroke-linejoin: round;
  filter: drop-shadow(0 0 7px #ffc400);
}

.desktop-icon span {
  font-size: 11px;
  text-align: center;
  text-shadow: 0 0 7px black;
}

/* [NULL] desktop shortcut: white instead of the global yellow theme */
.desktop-icon[data-app="null"]{border-color:rgba(255,255,255,.48);background:rgba(12,12,14,.66)}
.desktop-icon[data-app="null"] svg{stroke:#fff;filter:drop-shadow(0 0 7px rgba(255,255,255,.85))}
.desktop-icon[data-app="null"] span{color:#fff;text-shadow:0 0 7px rgba(255,255,255,.5)}
.desktop-icon[data-app="null"]:hover,.desktop-icon[data-app="null"].dragging{background:rgba(255,255,255,.16);border-color:#fff;box-shadow:0 0 19px rgba(255,255,255,.52)}
.desktop-icon[data-app="null"].selected{background:rgba(255,255,255,.22);border-color:#fff;box-shadow:0 0 15px rgba(255,255,255,.5),inset 0 0 10px rgba(255,255,255,.14)}
.desktop-icon[data-app="null"].selected svg{filter:drop-shadow(0 0 9px #fff)}
/* White selection rectangle matches the [NULL] desktop interaction. */
#desktop-selection{border-color:rgba(255,255,255,.92);background:rgba(255,255,255,.1);box-shadow:0 0 9px rgba(255,255,255,.3),inset 0 0 15px rgba(255,255,255,.1)}

/* TASKBAR */

#taskbar {
  position: fixed;
  bottom: 12px;
  left: 50%;
  transform: translateX(-50%);
  display: flex;
  align-items: center;
  gap: 8px;
  max-width: 98vw;
  padding: 9px 13px;
  background: #080a10f0;
  border: 1px solid var(--border);
  border-radius: 15px;
  box-shadow: 0 0 25px #ffc40044;
  z-index: 9000;
}

#taskApps {
  display: flex;
  gap: 3px;
}

.task-button {
  width: 37px;
  height: 37px;
  display: grid;
  place-items: center;
  background: transparent;
  border: none;
  border-radius: 8px;
  color: var(--yellow);
}

.task-button:hover { background: #ffe65c25; }

.task-button svg {
  width: 23px;
  height: 23px;
  fill: none;
  stroke: currentColor;
  stroke-width: 1.8;
}

#clock {
  color: var(--yellow);
  font: 11px monospace;
  white-space: nowrap;
}

/* WINDOWS */

.window {
  position: fixed;
  width: 790px;
  height: 540px;
  max-width: 96vw;
  max-height: calc(100vh - 100px);
  display: flex;
  flex-direction: column;
  overflow: hidden;
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 13px;
  box-shadow: 0 25px 70px #000c, 0 0 25px #ffc40033;
  backdrop-filter: blur(16px);
  animation: windowAppear .2s ease;
}

@keyframes windowAppear {
  from { opacity: 0; transform: scale(.97); }
  to { opacity: 1; transform: scale(1); }
}

.titlebar {
  height: 46px;
  min-height: 46px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 13px;
  background: #1b1d24;
  border-bottom: 1px solid #ffe65c44;
  color: var(--yellow);
  font: 12px monospace;
  letter-spacing: 1px;
  cursor: grab;
  user-select: none;
  touch-action: none;
}

.window-controls {
  display: flex;
  gap: 6px;
}

.window-controls button {
  padding: 5px 10px;
  background: #ffffff18;
  border: 1px solid #ffffff38;
  border-radius: 6px;
  color: white;
}

.window-controls .close:hover {
  background: #a72e3b;
}

.window-content {
  flex: 1;
  min-height: 0;
  display: flex;
  flex-direction: column;
  gap: 12px;
  padding: 16px;
  overflow: auto;
}

/* BROWSER */

.browser-toolbar {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 6px;
}

.browser-toolbar .field {
  flex: 1;
  min-width: 170px;
}

.browser-page {
  flex: 1;
  min-height: 0;
  overflow: auto;
  background: #0b0e14;
  border: 1px solid #ffe65c44;
  border-radius: 10px;
}

.browser-home {
  min-height: 100%;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 15px;
  padding: 25px;
  text-align: center;
  background: radial-gradient(circle, #ffe65c13, #0b0e14);
}

.browser-home h1 {
  margin: 0;
  color: var(--yellow);
  font-size: clamp(26px, 5vw, 43px);
  letter-spacing: 4px;
  text-shadow: 0 0 20px #ffc40088;
}

.result {
  margin: 12px;
  padding: 15px;
  background: #161b24;
  border: 1px solid #ffe65c44;
  border-radius: 10px;
}

.result h3 {
  margin: 0 0 7px;
  font-size: 15px;
}

.result p {
  font-size: 13px;
  line-height: 1.5;
}

.result-url {
  color: #aeb5c4;
  font-size: 11px;
  overflow-wrap: anywhere;
}

.website-frame {
  display: block;
  width: 100%;
  height: 100%;
  min-height: 300px;
  border: 0;
  background: white;
}

/* TERMINAL */

.terminal-output {
  flex: 1;
  overflow: auto;
  white-space: pre-wrap;
  color: var(--yellow);
  font: 13px/1.6 monospace;
}

/* CALCULATOR */

.calculator-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 8px;
}

.calculator-grid button {
  padding: 15px 4px;
  background: #ffffff15;
  color: white;
  border: 1px solid #ffffff33;
  border-radius: 8px;
  font-size: 19px;
}

/* REBOOT */

#boot {
  position: fixed;
  inset: 0;
  z-index: 20000;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 18px;
  padding: 20px;
  background: #050608;
  color: var(--yellow);
  text-align: center;
  font: 16px monospace;
}

#boot h1 {
  font-size: clamp(28px, 7vw, 55px);
  letter-spacing: 5px;
  text-shadow: 0 0 25px #ffc400;
}

#bootTrack {
  width: min(380px, 80vw);
  height: 10px;
  border: 1px solid var(--yellow);
}

#bootFill {
  width: 0;
  height: 100%;
  background: var(--yellow);
  box-shadow: 0 0 15px #ffc400;
}

#boot.glitch {
  animation: glitch .12s infinite;
}

@keyframes glitch {
  0%, 100% { transform: translate(0); }
  30% { transform: translate(3px, -2px); }
  60% { transform: translate(-3px, 2px); }
}

@media (max-width: 600px) {
  #taskbar { gap: 4px; padding: 7px; }
  .task-button { width: 31px; height: 34px; }
  .task-button svg { width: 19px; }
  .window-content { padding: 10px; }
  .desktop-icon { width: 79px; height: 82px; }
  .browser-toolbar .btn { padding: 8px; }
}

/* GAMES: original theme, additional controls only */
.game-top {display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.game-board {display:grid;gap:3px;align-content:start;justify-content:start;user-select:none;touch-action:manipulation}
.game-cell {display:grid;place-items:center;min-width:0;min-height:0;padding:0;border:1px solid #ffe65c55;border-radius:5px;background:#242832;color:#ffe65c;font-weight:bold;cursor:pointer}
.game-cell:hover {background:#44402a}
.game-cell.revealed {background:#0d1017;border-color:#ffffff20;cursor:default}
.game-cell.flagged {color:#ffce54}
.game-cell.mine {color:#ff6767;background:#3a1820}
.game-cell[data-number="1"] {color:#6fb5ff}.game-cell[data-number="2"] {color:#7ce3a6}.game-cell[data-number="3"] {color:#ff8484}.game-cell[data-number="4"] {color:#c4a1ff}
.game-2048-tile {border-radius:7px;display:grid;place-items:center;font-size:clamp(17px,3vw,27px);font-weight:900;color:#171717;background:#e3dcb9;min-height:0}
.game-2048-tile[data-value="0"] {background:#262933;color:transparent}
.game-2048-tile[data-value="2"] {background:#f4edc0}.game-2048-tile[data-value="4"] {background:#f8e091}.game-2048-tile[data-value="8"] {background:#ffcb64}.game-2048-tile[data-value="16"] {background:#ffb44e}.game-2048-tile[data-value="32"] {background:#ffa168}.game-2048-tile[data-value="64"] {background:#ff8575}.game-2048-tile[data-value="128"] {background:#ffe75d}.game-2048-tile[data-value="256"] {background:#f8da27}.game-2048-tile[data-value="512"] {background:#f9c700}.game-2048-tile[data-value="1024"] {background:#f7a500}.game-2048-tile[data-value="2048"] {background:#fff176}
.snake-canvas {width:min(100%,440px);aspect-ratio:1;background:#0c1015;border:1px solid #ffe65c77;border-radius:8px;image-rendering:pixelated;touch-action:none}

.game-pad button {height:42px}

/* ====================================
   CINEMATIC REBOOT SCREEN
==================================== */
#md-boot {
  position:fixed;
  inset:0;
  z-index:999999;
  overflow:hidden;
  background:#050507;
  color:var(--yellow);
  font-family:"Share Tech Mono",monospace;
  transition:opacity .9s ease;
}
#md-boot::before {
  content:"";
  position:absolute;
  inset:0;
  z-index:15;
  pointer-events:none;
  background:
    repeating-linear-gradient(
      0deg,
      #0006 0px,
      #0006 1px,
      transparent 2px,
      transparent 4px
    ),
    radial-gradient(
      ellipse at center,
      transparent 25%,
      #000a 100%
    );
}
#md-boot::after {
  content:"";
  position:absolute;
  inset:-100% 0;
  pointer-events:none;
  background:linear-gradient(
    transparent 47%,
    #ffd40012 50%,
    transparent 53%
  );
  animation:screenSweep 4s linear infinite;
}
.boot-logs {
  position:absolute;
  top:20px;
  left:22px;
  max-width:80vw;
  font-size:clamp(11px,1.25vw,16px);
  line-height:1.55;
  letter-spacing:1.4px;
  white-space:pre-wrap;
  color:#ffe86d;
  text-shadow:0 0 9px #ffc40088;
  z-index:5;
}
.boot-cursor {
  display:inline-block;
  width:9px;
  height:16px;
  background:#ffe65c;
  vertical-align:middle;
  box-shadow:0 0 10px #ffe000;
  animation:cursorBlink .7s steps(1) infinite;
}
.boot-right {
  position:absolute;
  right:20px;
  top:20px;
  text-align:right;
  font-size:12px;
  line-height:1.5;
  color:#d8b83c;
  z-index:5;
}
.boot-center {
  position:absolute;
  inset:0;
  display:grid;
  place-items:center;
  padding:20px;
  z-index:4;
}
#boot-main {
  position:relative;
  font-family:Orbitron,monospace;
  font-weight:800;
  font-size:clamp(23px,5.2vw,82px);
  letter-spacing:5px;
  text-align:center;
  color:#fff5ac;
  white-space:nowrap;
  text-shadow:
    0 0 4px #fff,
    0 0 12px #ffe600,
    0 0 28px #ffd000,
    0 0 65px #ffb900,
    0 0 110px #ff9a00;
  animation:
    textFlicker 2.2s infinite,
    textJitter 3s infinite;
}
#boot-main::before,
#boot-main::after {
  content:attr(data-text);
  position:absolute;
  inset:0;
  opacity:0;
  pointer-events:none;
}
#boot-main::before {
  color:#fff5b0;
  text-shadow:-9px 0 #ffbd00;
  animation:glitchSliceA 1.1s infinite;
}
#boot-main::after {
  color:#fff;
  text-shadow:9px 0 #ff9f00;
  animation:glitchSliceB 1.4s infinite;
}
.boot-bottom {
  position:absolute;
  right:22px;
  bottom:23px;
  z-index:5;
  text-align:right;
  color:#e6c74d;
  font-size:12px;
  letter-spacing:1.6px;
  text-shadow:0 0 10px #ffcc0088;
}
.boot-lowerlogs {
  position:absolute;
  bottom:22px;
  left:22px;
  z-index:5;
  font-size:12px;
  line-height:1.5;
  color:#d6b43d;
}
.glitch-strip {
  position:absolute;
  z-index:7;
  left:0;
  width:100%;
  height:4px;
  opacity:0;
  background:linear-gradient(
    90deg,
    transparent,
    #ffdd00,
    #fff8a5,
    #ffb800,
    transparent
  );
  box-shadow:0 0 20px #ffcc00;
  pointer-events:none;
}
.glitch-strip:nth-child(1) {
  top:32%;
  animation:stripGlitch .8s steps(2) infinite;
}
.glitch-strip:nth-child(2) {
  top:49%;
  animation:stripGlitch 1.1s steps(2) infinite .3s;
}
.glitch-strip:nth-child(3) {
  top:62%;
  animation:stripGlitch .65s steps(2) infinite .15s;
}
#md-boot.intense .glitch-strip {
  animation-duration:.18s;
}
#md-boot.intense #boot-main {
  animation-duration:.25s;
}
#md-boot.failed {
  background:#120205;
  box-shadow:inset 0 0 180px #ff000077;
}
#md-boot.failed #boot-main {
  color:#ff8080;
  text-shadow:
    0 0 8px red,
    0 0 25px red,
    0 0 70px #ff0000;
}
#md-boot.failed #boot-main::before,
#md-boot.failed #boot-main::after {
  color:#ff5555;
  text-shadow:8px 0 #f00;
}
#md-boot.failed .glitch-strip {
  background:#ff2538;
  box-shadow:0 0 30px red;
}
#md-boot.failed .boot-bottom {
  color:#ff5151;
}
#md-boot.success #boot-main {
  color:#fff7a6;
  text-shadow:
    0 0 8px #fff,
    0 0 25px #ffdd00,
    0 0 65px #ffb000;
}

@keyframes cursorBlink {
  50% {opacity:0}
}
@keyframes screenSweep {
  to {transform:translateY(100%)}
}
@keyframes textFlicker {
  0%,88%,92%,97%,100% {opacity:1}
  89%,95% {opacity:.4}
  90%,96% {opacity:.85}
}
@keyframes textJitter {
  0%,85%,100% {transform:translate(0)}
  86% {transform:translate(-5px,2px)}
  88% {transform:translate(7px,-2px)}
  90% {transform:translate(-3px,1px)}
}
@keyframes glitchSliceA {
  0%,72%,100% {
    opacity:0;
    clip-path:inset(100% 0 0 0);
  }
  74% {
    opacity:.95;
    transform:translate(-12px);
    clip-path:inset(15% 0 62% 0);
  }
  79% {
    opacity:.85;
    transform:translate(9px);
    clip-path:inset(58% 0 20% 0);
  }
  83% {opacity:0}
}
@keyframes glitchSliceB {
  0%,66%,100% {
    opacity:0;
    clip-path:inset(0 0 100% 0);
  }
  68% {
    opacity:.9;
    transform:translate(13px);
    clip-path:inset(42% 0 34% 0);
  }
  73% {
    opacity:.8;
    transform:translate(-9px);
    clip-path:inset(76% 0 8% 0);
  }
  77% {opacity:0}
}
@keyframes stripGlitch {
  0%,65%,100% {
    opacity:0;
    transform:translateX(0) scaleY(1);
  }
  67% {
    opacity:.9;
    transform:translateX(-18px) scaleY(3);
  }
  72% {
    opacity:.6;
    transform:translateX(24px) scaleY(1);
  }
  77% {opacity:0}
}
@media(max-width:700px) {
  #boot-main {
    font-size:clamp(17px,5vw,34px);
    letter-spacing:1px;
  }
  .boot-right {display:none}
  .boot-logs {font-size:10px}
  .boot-lowerlogs,.boot-bottom {font-size:9px}
}
@media(prefers-reduced-motion:reduce) {
  #md-boot *,
  #md-boot::after {
    animation:none!important;
  }
}

/* SMOOTH CINEMATIC REBOOT — Cyn wallpaper appears only on desktop */
#md-boot {
  isolation:isolate;
  background:#040407;
  transition:opacity 1.15s cubic-bezier(.22,1,.36,1),
             filter 1.15s ease;
}
#md-boot .ambient-glow {
  position:absolute;inset:0;z-index:1;pointer-events:none;
  background:radial-gradient(ellipse 55% 34% at 50% 50%,#ffc40012,transparent 78%);
  animation:ambientPulse 3.8s ease-in-out infinite alternate;
}
#md-boot.failed .ambient-glow {
  background:radial-gradient(ellipse 55% 30% at 50% 50%,#ff172e38,transparent 78%);
}
#md-boot.joking .ambient-glow {
  background:radial-gradient(ellipse 55% 30% at 50% 50%,#a45aff29,#ffd0000c 45%,transparent 85%);
}
#boot-main {
  animation:textFlicker 3.7s infinite,textJitter 5.1s infinite;
  transition:color .45s ease,text-shadow .55s ease,filter .55s ease;
  will-change:transform,opacity;
}
#md-boot .glitch-strip {opacity:0;filter:blur(.5px)}
#md-boot .glitch-strip:nth-child(1) {animation-duration:2.5s}
#md-boot .glitch-strip:nth-child(2) {animation-duration:3.2s}
#md-boot .glitch-strip:nth-child(3) {animation-duration:2.8s}
#md-boot.intense .glitch-strip {animation-duration:.55s}
#md-boot .boot-logs,#md-boot .boot-bottom,#md-boot .boot-lowerlogs {
  transition:color .45s ease,text-shadow .45s ease;

        left: win.style.left,

        height: win.style.height,
        maxWidth: win.style.maxWidth,
        maxHeight: win.style.maxHeight

      win.style.maxHeight = "none";
    } else {
      win.style.left = savedSize.left;
      win.style.top = savedSize.top;
      win.style.width = savedSize.width;
      win.style.height = savedSize.height;
      win.style.maxWidth = savedSize.maxWidth;
      win.style.maxHeight = savedSize.maxHeight;
      savedSize = null;
      win.classList.remove("window-fullscreen");
      maximize.textContent = "□";

    }
  };

  const close = document.createElement("button");
  close.className = "close";
  close.textContent = "✕";
  close.onclick = () => {
    window.dispatchEvent(new CustomEvent('mybrowser-action',{detail:{type:'close',app:id}}));
    if (win.dataset.closing === 'true') return;
    win.dataset.closing = 'true';
    syncNullAtmosphere();
    setTimeout(syncNullAtmosphere,600);
    win.classList.add('app-awaiting-glitch');
    launchAppGlitch(win, () => win.remove());
  };

  controls.append(maximize, close);
  bar.append(heading, controls);

  const area = document.createElement("div");
  area.className = "window-content";

  const statusBar = document.createElement("div");
  statusBar.className = "window-statusbar";
  statusBar.innerHTML = '<span class="status-online">● SYSTEM ONLINE</span><span>GOSHA // v1.0 · LOCAL</span>';
  win.append(bar, area, statusBar);
  document.body.appendChild(win);

  function activateWindow(){
    document.querySelectorAll('.window.window-active').forEach(w=>w.classList.remove('window-active'));
    win.classList.add('window-active');
    win.style.zIndex = ++topZ;
    syncNullAtmosphere();
  }
  win.addEventListener("pointerdown", activateWindow);
  activateWindow();

  let dragging = false;
  let sx = 0, sy = 0, ox = 0, oy = 0;

  bar.addEventListener("pointerdown", event => {
    if (event.target.closest("button")) return;

    dragging = true;
    win.classList.add("window-dragging");

    sx = event.clientX;
    sy = event.clientY;
    ox = win.offsetLeft;
    oy = win.offsetTop;

    bar.setPointerCapture(event.pointerId);
  });

  bar.addEventListener("pointermove", event => {
    if (!dragging || savedSize) return;

    win.style.left = Math.max(0, Math.min(
      innerWidth - 90,
      ox + event.clientX - sx
    )) + "px";

    win.style.top = Math.max(0, Math.min(
      innerHeight - 90,
      oy + event.clientY - sy
    )) + "px";
  });

  bar.addEventListener("pointerup", event => {
    if(dragging && !savedSize){
      const threshold=24;
      if(event.clientX < threshold || event.clientX > innerWidth-threshold){
        const left=event.clientX < threshold;
        win.style.left=left?'0px':'50vw';win.style.top='0px';win.style.width='50vw';win.style.height='calc(100dvh - 80px)';win.style.maxWidth='none';win.style.maxHeight='none';

        win.style.left='0px';win.style.top='0px';win.style.width='100vw';win.style.height='calc(100dvh - 80px)';win.style.maxWidth='none';win.style.maxHeight='none';
      }
    }
    dragging = false;
    win.classList.remove("window-dragging");
  });

  bar.addEventListener("pointercancel", () => {
    dragging = false;
    win.classList.remove("window-dragging");
  });

  return area;
}


/* Fragmented launch/close glitch: transparent, irregular fragments with no rectangular mask. */
const launchGlitchCanvas = document.getElementById('launch-glitch');
const launchGlitchCtx = launchGlitchCanvas.getContext('2d', {alpha:true});
let launchGlitchFrame = 0;
let launchGlitchFinish = null;
function launchAppGlitch(targetWindow, onComplete) {
  if (launchGlitchFinish) {
    const previous = launchGlitchFinish;
    launchGlitchFinish = null;
    previous();
  }
  cancelAnimationFrame(launchGlitchFrame);
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) {
    launchGlitchCanvas.classList.remove('active');
    onComplete?.();
    return;
  }
  const rect = targetWindow.getBoundingClientRect();
  const vw = window.innerWidth, vh = window.innerHeight;
  const dpr = Math.min(devicePixelRatio || 1, 1.5);
  launchGlitchCanvas.width = Math.ceil(vw*dpr);
  launchGlitchCanvas.height = Math.ceil(vh*dpr);
  Object.assign(launchGlitchCanvas.style, {
    left:'0px', top:'0px', width:vw+'px', height:vh+'px'
  });
  launchGlitchCtx.setTransform(dpr,0,0,dpr,0,0);
  launchGlitchCanvas.classList.add('active');
  let finished = false;
  const finish = () => {
    if (finished) return;
    finished = true;
    launchGlitchCanvas.classList.remove('active');
    launchGlitchCtx.clearRect(0,0,vw,vh);
    onComplete?.();
  };
  launchGlitchFinish = finish;
  const started = performance.now();
  // [NULL] uses white static for both opening and closing; other apps keep their original palette.
  const isNullGlitch = targetWindow.dataset.app === 'null';
  const palette = isNullGlitch
    ? ['#ffffff','#ffffff','#f8f8f8','#eaeaea','#d7d7d7','#bcbcbc','#ffffff']
    : ['#ffe83a','#ffe83a','#fff37a','#f5c500','#ba46ff','#a02dff','#7922d5','#f13a58'];
  const pick = a => a[Math.floor(Math.random()*a.length)];
  const random = (min,max) => min + Math.random()*(max-min);
  const fragments = [];
  // Each fragment has its own size, location, lifetime and movement.
  // A few spill outside the future window, so no rectangle is visible.
  for(let i=0;i<240;i++){
    const r=Math.random();
    const width = r<.32 ? random(2,15) : r<.73 ? random(16,85) : random(90,Math.max(110,rect.width*.75));
    const height = r<.48 ? random(1,5) : r<.83 ? random(6,18) : random(19,55);
    fragments.push({
      x:random(rect.left-65,rect.right+25),
      y:random(rect.top-55,rect.bottom+35),
      w:width,h:height,
      color:pick(palette),
      alpha:random(.35,.98),
      delay:random(0,210),
      life:random(75,240),
      drift:random(-75,75),
      type:Math.random()
    });
  }
  function draw(now){
    const elapsed=now-started, duration=510;
    if(elapsed>=duration){ launchGlitchFinish=null; finish(); return; }
    launchGlitchCtx.clearRect(0,0,vw,vh);
    for(const f of fragments){
      const age=elapsed-f.delay;
      if(age<0 || age>f.life) continue;
      const t=age/f.life;
      const strength=Math.min(1,t*5,(1-t)*5);
      launchGlitchCtx.globalAlpha=f.alpha*Math.max(0,strength);
      launchGlitchCtx.fillStyle=f.color;
      const jitter=(Math.random()-.5)*14;
      const x=f.x+f.drift*t+jitter;
      const y=f.y+(Math.random()-.5)*5;
      launchGlitchCtx.fillRect(x,y,f.w,f.h);
      if(f.type>.82){
        launchGlitchCtx.fillStyle=isNullGlitch?'#161616':'#0b0710';
        launchGlitchCtx.fillRect(x+random(0,f.w*.6),y,random(2,Math.max(3,f.w*.25)),f.h);
      }
    }
    // Sparse individual code fragments, not a rectangular background.
    launchGlitchCtx.font='bold 11px Consolas, monospace';
    for(let i=0;i<5;i++){
      if(Math.random()>.42) continue;
      launchGlitchCtx.globalAlpha=random(.2,.7);
      launchGlitchCtx.fillStyle=pick(palette);
      launchGlitchCtx.fillText(pick(['0x7F','// ERR','101101','▓▒░','[NULL]']),random(rect.left-25,rect.right),random(rect.top-15,rect.bottom+15));
    }
    launchGlitchCtx.globalAlpha=1;
    launchGlitchFrame=requestAnimationFrame(draw);
  }
  launchGlitchFrame=requestAnimationFrame(draw);
}

/* [NULL] — draggable black hole with interactive gravitational effects */
function nullApp(area){
  area.innerHTML=`<div class="null-stage"><div class="null-orbit" role="button" tabindex="0" aria-label="Drag the void or click to pulse" title="Drag the void"><div class="null-glow"></div><div class="null-smoke"></div><div class="null-smoke-extra"></div><div class="null-void"><span>[null]</span></div></div></div>`;
  const stage=area.querySelector('.null-stage'),orb=area.querySelector('.null-orbit');
  let x=.5,y=.5,drag=false,moved=false,startX=0,startY=0,lastX=0,lastY=0,lastTime=0,vx=0,vy=0,raf=0;
  const reduced=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  function position(){
    const r=stage.getBoundingClientRect(),size=orb.getBoundingClientRect().width;
    const margin=Math.min(size*.2,65);
    const px=Math.max(margin,Math.min(r.width-margin,x*r.width));
    const py=Math.max(margin,Math.min(r.height-margin,y*r.height));
    orb.style.left=px+'px';orb.style.top=py+'px';
    stage.style.setProperty('--glow-x',px+'px');stage.style.setProperty('--glow-y',py+'px');
    return {px,py};
  }
  function sparks(n=12,spread=90){
    if(reduced)return;
    const {px,py}=position();
    for(let i=0;i<n;i++){
      const dot=document.createElement('i');dot.className='null-spark';
      const a=Math.random()*Math.PI*2,dist=20+Math.random()*spread;
      dot.style.left=px+(Math.random()-.5)*60+'px';
      dot.style.top=py+(Math.random()-.5)*60+'px';
      dot.style.setProperty('--dx',Math.cos(a)*dist+'px');
      dot.style.setProperty('--dy',Math.sin(a)*dist+'px');
      dot.style.setProperty('--w',(2+Math.random()*6)+'px');
      dot.style.setProperty('--life',(420+Math.random()*500)+'ms');
      dot.style.setProperty('--c',Math.random()<.08?'#a59b8c':'#cbb89c');
      stage.appendChild(dot);dot.addEventListener('animationend',()=>dot.remove(),{once:true});
      setTimeout(()=>dot.remove(),1100);
    }
  }
  function pulse(){
    stage.classList.add('null-pulse');sparks(24,150);
    setTimeout(()=>stage.classList.remove('null-pulse'),420);
  }
  function stopMomentum(){cancelAnimationFrame(raf);raf=0}
  orb.addEventListener('pointerdown',e=>{
    if(e.button!==0)return;
    stopMomentum();drag=true;moved=false;startX=e.clientX;startY=e.clientY;
    lastX=e.clientX;lastY=e.clientY;lastTime=performance.now();vx=vy=0;
    orb.classList.add('dragging');orb.setPointerCapture(e.pointerId);
    e.preventDefault();
  });

    if(!drag)return;
    const r=stage.getBoundingClientRect(),now=performance.now(),dt=Math.max(8,now-lastTime);
    x+=(e.clientX-lastX)/Math.max(1,r.width);
    y+=(e.clientY-lastY)/Math.max(1,r.height);
    vx=(e.clientX-lastX)/dt;vy=(e.clientY-lastY)/dt;
    if(Math.hypot(e.clientX-startX,e.clientY-startY)>6)moved=true;
    lastX=e.clientX;lastY=e.clientY;lastTime=now;
    position();
    if(moved&&Math.random()<.28)sparks(1,50);
  });
  function release(){
    if(!drag)return;drag=false;orb.classList.remove('dragging');
    if(!moved){pulse();return}
    if(reduced)return;
    let frames=0;
    function glide(){
      const r=stage.getBoundingClientRect();
      x+=vx*13/Math.max(1,r.width);y+=vy*13/Math.max(1,r.height);
      vx*=.89;vy*=.89;frames++;position();
      if(frames<65&&Math.hypot(vx,vy)>.015)raf=requestAnimationFrame(glide);
    }
    raf=requestAnimationFrame(glide);
  }
  orb.addEventListener('pointerup',release);
  orb.addEventListener('pointercancel',()=>{drag=false;orb.classList.remove('dragging')});
  orb.addEventListener('keydown',e=>{
    const step=e.shiftKey?.08:.025;
    if(e.key==='Enter'||e.key===' '){e.preventDefault();pulse();return}
    const keys={ArrowLeft:[-step,0],ArrowRight:[step,0],ArrowUp:[0,-step],ArrowDown:[0,step]};

  });
  const observer=new ResizeObserver(()=>position());observer.observe(stage);
  const cleanup=new MutationObserver(()=>{if(!area.isConnected){observer.disconnect();cleanup.disconnect();stopMomentum()}});
  cleanup.observe(document.body,{childList:true,subtree:true});
  position();
}

  async function api(path,options={}){
    const controller=new AbortController(),timer=setTimeout(()=>controller.abort(),18000);

      const response=await fetch(CHAT_WORKER_URL+path,{...options,signal:controller.signal,cache:'no-store',headers:{'Content-Type':'application/json',...(options.headers||{})}});
      const raw=await response.text();let data={};
      try{data=raw?JSON.parse(raw):{}}catch{throw Error('Chat server returned an invalid response (HTTP '+response.status+')')}
      if(!response.ok)throw Error(data.error||data.message||('HTTP '+response.status));
      return data;
    }catch(err){if(err.name==='AbortError')throw Error('Chat server timed out. Try again.');throw err}

  }

  const area = makeWindow(id, name);

  const newWindow = area.closest(".window");

/* BROWSER WITH TAVILY AND INTERNAL WEBSITE VIEWER */

function browserApp(area) {
  let history = [];
  let historyIndex = -1;
  let currentURL = "";
  let mode = "home";
  let searchRequest = 0;

  area.innerHTML = `
    <div class="browser-toolbar">
      <button class="btn" id="backBtn" title="Back">←</button>
      <button class="btn" id="forwardBtn" title="Forward">→</button>
      <button class="btn" id="refreshBtn" title="Refresh">⟳</button>
      <button class="btn" id="homeBtn" title="Home">⌂</button>
      <input class="field" id="address"
        placeholder="Search the web or enter a URL">
      <button class="primary" id="goBtn">GO</button>
    </div>

    <div class="browser-page" id="browserPage"></div>

    <div class="muted" id="browserStatus">
      GOSHA // READY
    </div>
  `;

  const page = area.querySelector("#browserPage");
  const address = area.querySelector("#address");
  const status = area.querySelector("#browserStatus");

  const backBtn = area.querySelector("#backBtn");
  const forwardBtn = area.querySelector("#forwardBtn");

  function updateButtons() {
    backBtn.disabled = historyIndex <= 0;
    forwardBtn.disabled =
      historyIndex >= history.length - 1;
  }

  function record(entry) {
    history = history.slice(0, historyIndex + 1);
    history.push(entry);
    historyIndex = history.length - 1;
    updateButtons();
  }

  function showHome(addHistory = true) {
    searchRequest++;
    mode = "home";
    currentURL = "";
    address.value = "";

    page.innerHTML = `
      <div class="browser-home">
        <h1>MYBROWSER</h1>
        <p class="muted">
          WEB SEARCH // POWERED BY TAVILY
        </p>
        <p class="muted">
          Search for websites or enter an address above.
        </p>
      </div>
    `;

    status.textContent = "MYBROWSER // HOME";

    if (addHistory) record({type: "home"});
  }

  async function searchWeb(query, addHistory = true) {
    const requestId = ++searchRequest;

    mode = "search";
    currentURL = "";
    address.value = query;

    if (addHistory) {
      record({type: "search", value: query});
    }

    page.replaceChildren();
    status.textContent = "Searching Tavily...";

    const heading = document.createElement("h2");
    heading.textContent = "Search results: " + query;
    heading.style.padding = "16px";
    page.appendChild(heading);

    try {
      const response = await fetch(WORKER_URL, {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({query})
      });

      const data = await response.json();

      if (!response.ok) {
        throw new Error(data.error || "Search failed");
      }

      if (requestId !== searchRequest) return;

      const items = data.results || [];

      status.textContent = items.length + " results found";

      if (!items.length) {
        const empty = document.createElement("p");
        empty.className = "muted";
        empty.style.padding = "16px";
        empty.textContent = "No results found.";
        page.appendChild(empty);
      }

      for (const item of items) {
        const card = document.createElement("div");
        card.className = "result";

        const title = document.createElement("h3");
        title.textContent = item.title || "Untitled";

        const urlText = document.createElement("div");
        urlText.className = "result-url";
        urlText.textContent = item.url || "";

        const description = document.createElement("p");
        description.textContent = item.description || "";

        const open = document.createElement("button");
        open.className = "primary";
        open.textContent = "OPEN IN MYBROWSER";
        open.onclick = () => navigate(item.url);

        const read = document.createElement("button");
        read.className = "btn";
        read.textContent = "READ PAGE";
        read.style.marginLeft = "8px";
        read.onclick = () => readPage(item.url);

        card.append(title, urlText, description, open, read);
        page.appendChild(card);
      }

    } catch (error) {
      if (requestId !== searchRequest) return;

      status.textContent =
        "Search failed: " + error.message +
        ". Check your Cloudflare Worker connection.";
    }
  }

  function navigate(url, addHistory = true) {
    let parsed;

    try {
      parsed = new URL(url);

      if (!["https:", "http:"].includes(parsed.protocol)) {
        throw new Error("Unsupported URL");
      }
    } catch (error) {
      status.textContent = "Invalid website address.";
      return;
    }

    searchRequest++;
    mode = "website";
    currentURL = parsed.href;
    address.value = currentURL;

    if (addHistory) {
      record({type: "website", value: currentURL});
    }

    page.replaceChildren();

    const frame = document.createElement("iframe");
    frame.className = "website-frame";
    frame.title = "MyBrowser Website Viewer";
    frame.src = currentURL;
    frame.referrerPolicy = "no-referrer";

    page.appendChild(frame);

    status.textContent =
      "Viewing " + parsed.hostname +
      " — some websites may refuse embedded viewing.";

    // Cross-origin security means we cannot reliably
    // detect whether a website rejected iframe embedding.
  }

  async function readPage(url, addHistory = true) {
    let parsed;
    try {
      parsed = new URL(url);
      if (!["https:", "http:"].includes(parsed.protocol)) {
        throw new Error("Unsupported URL");
      }
    } catch (error) {
      status.textContent = "Invalid website address.";
      return;
    }

    const requestId = ++searchRequest;
    mode = "read";
    currentURL = parsed.href;
    address.value = currentURL;

    if (addHistory) {
      record({type: "read", value: currentURL});
    }

    page.replaceChildren();
    const reading = document.createElement("div");
    reading.style.padding = "16px";
    const heading = document.createElement("h2");
    heading.textContent = "READ PAGE // " + parsed.hostname;
    const content = document.createElement("div");
    content.style.whiteSpace = "pre-wrap";
    content.style.overflowWrap = "anywhere";
    content.style.lineHeight = "1.6";
    content.style.fontSize = "13px";
    content.style.marginTop = "14px";
    content.textContent = "Loading readable content...";
    reading.append(heading, content);
    page.appendChild(reading);
    status.textContent = "Reading " + parsed.hostname + " with Jina...";

    try {
      const response = await fetch(WORKER_URL, {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({action: "read", url: currentURL})
      });
      const data = await response.json();
      if (!response.ok) {
        throw new Error(data.error || "Unable to read page");
      }
      if (requestId !== searchRequest) return;
      content.textContent = data.content || "No readable content found.";
      status.textContent = "READ PAGE // " + parsed.hostname;
    } catch (error) {
      if (requestId !== searchRequest) return;
      content.textContent = "Could not read this page: " + error.message;
      status.textContent = "READ PAGE // FAILED";
    }
  }

  function restoreHistory() {
    const entry = history[historyIndex];
    if (!entry) return;

    if (entry.type === "home") {
      showHome(false);
    } else if (entry.type === "search") {
      searchWeb(entry.value, false);
    } else if (entry.type === "website") {
      navigate(entry.value, false);
    } else if (entry.type === "read") {
      readPage(entry.value, false);
    }

    updateButtons();
  }

  function go() {
    const value = address.value.trim();
    if (!value) return;

    if (/^https?:\/\//i.test(value)) {
      navigate(value);
    } else if (
      /^[^\s]+\.[a-z]{2,}(?:[/:?#].*)?$/i.test(value)
    ) {
      navigate("https://" + value);
    } else {
      searchWeb(value);
    }
  }

  area.querySelector("#goBtn").onclick = go;

  address.onkeydown = event => {
    if (event.key === "Enter") go();
  };

  backBtn.onclick = () => {
    if (historyIndex > 0) {
      historyIndex--;
      restoreHistory();
    }
  };

  forwardBtn.onclick = () => {
    if (historyIndex < history.length - 1) {
      historyIndex++;
      restoreHistory();
    }
  };

  area.querySelector("#refreshBtn").onclick = () => {
    if (mode === "website") {
      navigate(currentURL, false);
    } else {
      restoreHistory();
    }
  };

  area.querySelector("#homeBtn").onclick = () => {
    showHome();
  };

  showHome();
}

  function edit(i){editIndex=i;q('fsEdit').style.display='block';q('fsName').value=i<0?'Untitled.txt':fs.files[i].name;q('fsText').value=i<0?'':fs.files[i].text;q('fsText').focus();}

  q('fsCancel').onclick=()=>q('fsEdit').style.display='none';q('fsSave').onclick=()=>{const name=q('fsName').value.trim()||'Untitled.txt',text=q('fsText').value;if(editIndex<0)fs.files.push({folder,name,text});else Object.assign(fs.files[editIndex],{name,text});if(!saveFS(fs))alert('Could not save: browser storage may be full');q('fsEdit').style.display='none';render()};
  q('fsImport').onclick=()=>q('fsPick').click();q('fsPick').onchange=async e=>{for(const file of e.target.files){if(file.size>500000){alert('Text files must be under 500 KB');continue;}fs.files.push({folder,name:file.name,text:await file.text()});}if(!saveFS(fs))alert('Could not save imported files');render();e.target.value='';};render();

 const pick=area.querySelector('#musicPick'),list=area.querySelector('#musicList'),audio=area.querySelector('#musicAudio');let tracks=[],idx=-1;

/* LIVE VISITOR PRESENCE
   Set this to your deployed Cloudflare presence Worker URL.
   Requires the separate mybrowser-active-worker.js backend.
*/
const ACTIVE_WORKER_URL = "https://mybrowser-active-workerjs.gosha7258.workers.dev";
const ACTIVE_SESSION_ID = (() => {
  const bytes = new Uint8Array(16);
  crypto.getRandomValues(bytes);
  return Array.from(bytes, b => b.toString(16).padStart(2, "0")).join("");
})();

async function updateActivePresence() {
  if (ACTIVE_WORKER_URL.includes("YOUR-SUBDOMAIN")) return;
  try {
    await fetch(ACTIVE_WORKER_URL + "/heartbeat", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({session: ACTIVE_SESSION_ID}),
      cache: "no-store"
    });
  } catch (error) { console.warn("Presence update failed", error); }
}
updateActivePresence();
setInterval(updateActivePresence, 30000);
document.addEventListener("visibilitychange", () => {
  if (!document.hidden) updateActivePresence();
});

async function fetchActiveCount() {
  if (ACTIVE_WORKER_URL.includes("YOUR-SUBDOMAIN")) {
    return "Not configured. Deploy the Cloudflare presence Worker and set ACTIVE_WORKER_URL.";
  }
  const response = await fetch(ACTIVE_WORKER_URL + "/active", {cache:"no-store"});
  if (!response.ok) throw new Error("Visitor service returned " + response.status);
  const data = await response.json();
  if (typeof data.online !== "number") throw new Error("Invalid visitor count response");
  return "ONLINE RIGHT NOW: " + data.online + " active session" + (data.online === 1 ? "" : "s") +
    "\\n(Approximate; active within the last 120 seconds.)";
}

      return;
    }

    if (cmd === "out") {
      const wasOwner = !!sessionStorage.getItem('gosha-owner-session');
      const wasHatred = localStorage.getItem('gosha-chat-nickname') === 'HATRED';
      sessionStorage.removeItem('gosha-owner-session');
      if (wasOwner || wasHatred) {
        localStorage.removeItem('gosha-chat-nickname');
        // Reset the open Global Chat window immediately, without a page refresh.
        window.dispatchEvent(new Event('gosha-chat-identity-out'));
        if (wasOwner) window.dispatchEvent(new Event('gosha-owner-logout'));
        output.textContent += "> OUT\n" + (wasOwner ? "OWNER ACCESS DISABLED.\n" : "HATRED IDENTITY DISABLED.\n") + "Set a guest nickname in Global Chat.\n\n";
      } else {
        output.textContent += "> OUT\nNo special chat identity is active.\n\n";
      }
      output.scrollTop = output.scrollHeight;
      return;
    }

    if (cmd === "nat321") {
      if (sessionStorage.getItem('gosha-owner-session')) {
        output.textContent += "> nat321\nLog out of owner mode before switching chat identities.\n\n";
      } else {
        localStorage.setItem('gosha-chat-nickname', 'HATRED');
        window.dispatchEvent(new Event('gosha-hatred-identity'));
        output.textContent += "> nat321\nSOUL ACTIVATED. Global Chat display name: HATRED\nOpen Global Chat and send a message to claim the name.\n\n";
      }
      output.scrollTop=output.scrollHeight;
      return;
    }

    if (cmd === "clear") {
      output.textContent = "";
      return;
    }

    let answer = "Unknown command. Type HELP.";

    if (cmd === "help") {
      answer =
        "HELP, DATE, TIME, ABOUT, APPS, ACTIVE, CLEAR, REBOOT, ECHO, OUT, NAT321";
    } else if (cmd === "date") {
      answer = new Date().toDateString();
    } else if (cmd === "time") {
      answer = new Date().toLocaleTimeString();
    } else if (cmd === "about") {
      answer = "MyBrowser // Custom Web Desktop";
    } else if (cmd === "apps") {
      answer = APPS.map(app => app[1]).join(", ");
    } else if (cmd === "active") {
      answer = "Checking live visitors...";
      try { answer = await fetchActiveCount(); }
      catch (error) { answer = "Could not retrieve active visitors: " + error.message; }
    } else if (cmd === "reboot") {
      location.reload();
      return;
    } else if (cmd.startsWith("echo ")) {
      answer = command.slice(5);
    }

    output.textContent +=
      "> " + command + "\n" + answer + "\n\n";

    output.scrollTop = output.scrollHeight;
  };
}

/* CALCULATOR */

function calculatorApp(area) {
  area.innerHTML = `
    <h2>CALCULATOR</h2>
    <input class="field" id="display" readonly value="0"
      style="font-size:25px;text-align:right">
    <div class="calculator-grid" id="keys"></div>
  `;

  const display = area.querySelector("#display");
  const keys = area.querySelector("#keys");

  const labels = [
    "7", "8", "9", "÷",
    "4", "5", "6", "×",
    "1", "2", "3", "−",
    "C", "0", ".", "+",
    "(", ")", "⌫", "="
  ];

  let expression = "";

  labels.forEach(label => {
    const button = document.createElement("button");
    button.textContent = label;

    button.onclick = () => {
      if (label === "C") {
        expression = "";
      } else if (label === "⌫") {
        expression = expression.slice(0, -1);
      } else if (label === "=") {
        try {
          const normalized = expression
            .replaceAll("×", "*")
            .replaceAll("÷", "/")
            .replaceAll("−", "-");

          if (!/^[0-9+\-*/().\s]+$/.test(normalized)) {
            throw new Error("Invalid");
          }

          const tokens = normalized.match(
            /\d+(?:\.\d+)?|\.\d+|[()+\-*/]/g
          );

          if (
            !tokens ||
            tokens.join("") !== normalized.replace(/\s/g, "")
          ) {
            throw new Error("Invalid");
          }

          let index = 0;

          function parseExpression() {
            let value = parseTerm();

            while (
              tokens[index] === "+" ||
              tokens[index] === "-"
            ) {
              const operator = tokens[index++];
              const next = parseTerm();

              value = operator === "+"
                ? value + next
                : value - next;
            }

            return value;
          }

          function parseTerm() {
            let value = parseFactor();

            while (
              tokens[index] === "*" ||
              tokens[index] === "/"
            ) {
              const operator = tokens[index++];
              const next = parseFactor();

              value = operator === "*"
                ? value * next
                : value / next;
            }

            return value;
          }

          function parseFactor() {
            const token = tokens[index++];

            if (token === "+") return parseFactor();
            if (token === "-") return -parseFactor();

            if (token === "(") {
              const value = parseExpression();

              if (tokens[index++] !== ")") {
                throw new Error("Missing parenthesis");
              }

              return value;
            }

            const value = Number(token);

            if (!Number.isFinite(value)) {
              throw new Error("Invalid number");
            }

            return value;
          }

          const result = parseExpression();

          if (
            index !== tokens.length ||
            !Number.isFinite(result)
          ) {
            throw new Error("Invalid result");
          }

          expression = String(
            Number(result.toPrecision(12))
          );

        } catch (error) {
          expression = "";
          display.value = "ERROR";
          return;
        }
      } else {
        expression += label;
      }

      display.value = expression || "0";
    };

    keys.appendChild(button);
  });
}

const DEFAULT_ICON = "data:,";

const PRESETS = {
  "MyBrowser": "MyBrowser",
  "Study Workspace": "Study Workspace",

  "System Core": "System Core"
};

function setTab(title, icon) {
  document.title = title;
  document.getElementById("tabIcon").href =
    icon || DEFAULT_ICON;
}

function restoreTab() {
  try {
    const saved = JSON.parse(
      localStorage.getItem("mybrowser-cloak")
    );

    if (saved && saved.title) {
      setTab(saved.title, saved.icon);
    }
  } catch (error) {}
}

function cloakingApp(area) {
  area.innerHTML = `

      Customize this tab's title and icon.
      This does not change its actual URL.
    </p>

        <option>MyBrowser</option>

        <option>System Core</option>
        <option>Custom</option>
      </select>

      <p>Tab title</p>
      <input class="field" id="customTitle">

      <p>Custom favicon URL</p>
      <input class="field" id="customIcon"
        value="https://">

      <p class="muted" id="preview"></p>

      <div class="row" style="flex-wrap:wrap">
        <button class="primary" id="apply">
          APPLY CLOAK
        </button>
        <button class="btn" id="reset">
          RESET TO DEFAULT
        </button>
      </div>

      <p class="muted" id="cloakStatus"></p>
    </div>
  `;

  const preset = area.querySelector("#preset");
  const title = area.querySelector("#customTitle");
  const icon = area.querySelector("#customIcon");
  const preview = area.querySelector("#preview");
  const status = area.querySelector("#cloakStatus");

  function updatePreview() {
    preview.textContent =
      "Preview: " + (title.value.trim() || "Custom");
  }

  preset.onchange = () => {
    if (preset.value !== "Custom") {
      title.value = PRESETS[preset.value];
      icon.value = "https://";
    }

    updatePreview();
  };

  title.oninput = updatePreview;
  preset.onchange();

  area.querySelector("#apply").onclick = () => {
    const newTitle = title.value.trim();

    if (!newTitle) {
      status.textContent = "Enter a title.";
      return;
    }

    let newIcon = DEFAULT_ICON;

    if (icon.value.trim() !== "https://") {
      try {
        const parsed = new URL(icon.value.trim());

        if (parsed.protocol !== "https:") {
          throw new Error("HTTPS required");
        }

        newIcon = parsed.href;
      } catch (error) {
        status.textContent =
          "Enter a valid HTTPS favicon URL.";
        return;
      }
    }

    setTab(newTitle, newIcon);

    localStorage.setItem(
      "mybrowser-cloak",
      JSON.stringify({
        title: newTitle,
        icon: newIcon
      })
    );

    status.textContent = "Cloak applied successfully.";
  };

  area.querySelector("#reset").onclick = () => {
    localStorage.removeItem("mybrowser-cloak");

    setTab("MyBrowser", DEFAULT_ICON);

    preset.value = "MyBrowser";
    preset.onchange();

    status.textContent = "Restored default tab.";
  };
}

  function placeMines(safeIndex){const safe=new Set([safeIndex,...neighbors(safeIndex%width,Math.floor(safeIndex/width))]);let choices=board.map((_,i)=>i).filter(i=>!safe.has(i));for(let i=choices.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[choices[i],choices[j]]=[choices[j],choices[i]];}for(const i of choices.slice(0,mines))board[i].mine=true;board.forEach((cell,i)=>{cell.count=neighbors(i%width,Math.floor(i/width)).filter(n=>board[n].mine).length;});}

(function startReboot(){
  const boot=document.getElementById("md-boot");
  const typed=document.getElementById("boot-typed");
  const main=document.getElementById("boot-main");
  const bottom=document.getElementById("boot-bottom");

  const failed=Math.random()<0.5;

  const lines=[
    "> SERIAL DESIGNATION: ???",
    "> AUTO RUN COMPLETE.",
    "> INITIALIZING ABSOLUTE SOLVER...",
    "> LOADING CORE MODULES...",
    "> CHECKING SYSTEM INTEGRITY...",
    "> RESTORING CORE MEMORY...",
    "> REBOOTING, PLEASE WAIT..."
  ];

  let line=0;
  let character=0;

  function typeNext(){
    if(line>=lines.length){
      beginFinalSequence();
      return;
    }

    const current=lines[line];

    if(character<current.length){
      typed.textContent+=current[character];
      character++;

      // Smooth typing with a slight variation
      setTimeout(typeNext,20+Math.random()*18);
    }else{
      typed.textContent+="\n";
      line++;
      character=0;
      setTimeout(typeNext,180);
    }
  }

  function setMain(text){
    main.textContent=text;
    main.setAttribute("data-text",text);
  }

  function beginFinalSequence(){
    boot.classList.add("intense");
    bottom.innerHTML=
      "SYSTEM INTEGRITY CHECK<br>&gt; FINALIZING REBOOT...";

    // Heavy glitching before the result
    setTimeout(()=>{
      boot.classList.remove("intense");

      if(failed){
        boot.classList.add("failed");

/* Glowing yellow desktop drag-to-select */
(function setupDesktopSelection() {
  const desktop = document.getElementById("desktop");
  const selection = document.createElement("div");
  selection.id = "desktop-selection";
  document.body.appendChild(selection);
  let selecting = false, startX = 0, startY = 0, pointerId = null;

  function clearSelected() {
    desktop.querySelectorAll(".desktop-icon.selected")
      .forEach(icon => icon.classList.remove("selected"));
  }

  desktop.addEventListener("pointerdown", e => {
    if (e.target !== desktop || e.button !== 0) return;
    selecting = true;
    pointerId = e.pointerId;
    startX = e.clientX;
    startY = e.clientY;
    clearSelected();
    Object.assign(selection.style, {
      left: startX + "px", top: startY + "px",
      width: "0px", height: "0px", display: "block"
    });
    desktop.setPointerCapture(e.pointerId);
  });

  desktop.addEventListener("pointermove", e => {
    if (!selecting || e.pointerId !== pointerId) return;
    const left = Math.min(startX, e.clientX);
    const top = Math.min(startY, e.clientY);
    const width = Math.abs(e.clientX - startX);
    const height = Math.abs(e.clientY - startY);
    Object.assign(selection.style, {
      left: left + "px", top: top + "px",
      width: width + "px", height: height + "px"
    });
    const right = left + width, bottom = top + height;
    desktop.querySelectorAll(".desktop-icon").forEach(icon => {
      const rect = icon.getBoundingClientRect();
      const overlaps = rect.left < right && rect.right > left &&
                       rect.top < bottom && rect.bottom > top;
      icon.classList.toggle("selected", overlaps);
    });
  });

  function finish(e) {
    if (!selecting || e.pointerId !== pointerId) return;
    selecting = false;
    pointerId = null;
    selection.style.display = "none";
  }
  desktop.addEventListener("pointerup", finish);
  desktop.addEventListener("pointercancel", finish);

  desktop.querySelectorAll(".desktop-icon").forEach(icon => {
    icon.addEventListener("pointerdown", () => clearSelected());
  });
})();

<!-- Absolute Solver cursor click particles: visual only, no click interception -->
<style>

<script>
(function(){
  'use strict';
  if(document.getElementById('gosha-click-fx')) return;
  const canvas=document.createElement('canvas');
  canvas.id='gosha-click-fx';
  canvas.setAttribute('aria-hidden','true');
  document.body.appendChild(canvas);
  const ctx=canvas.getContext('2d');
  if(!ctx)return;
  let rings=[],particles=[],frame=0,last=0;
  let lastNullMode=false;
  function nullMode(){
    // This follows the existing [NULL] focus system, including close/minimize.
    return !!document.getElementById('null-focus-shade')?.classList.contains('visible');
  }
  function resetOnModeChange(){
    const active=nullMode();
    if(active!==lastNullMode){
      rings=[];particles=[];
      ctx.clearRect(0,0,innerWidth,innerHeight);
      lastNullMode=active;
    }
    return active;
  }
  function resize(){
    const scale=Math.min(window.devicePixelRatio||1,2);
    canvas.width=Math.round(innerWidth*scale);
    canvas.height=Math.round(innerHeight*scale);
    ctx.setTransform(scale,0,0,scale,0,0);
  }
  resize();
  window.addEventListener('resize',resize,{passive:true});
  function draw(now){
    frame=0;
    const dt=Math.min((now-(last||now))/16.67,2.5);last=now;
    const monochrome=resetOnModeChange();
    ctx.clearRect(0,0,innerWidth,innerHeight);
    rings=rings.filter(r=>r.age<28);
    for(const r of rings){
      r.age+=dt;
      const t=Math.min(r.age/28,1);
      ctx.strokeStyle=(monochrome?'rgba(255,255,255,':'rgba(255,230,92,')+((1-t)*.9)+')';
      ctx.lineWidth=2*(1-t)+.3;
      ctx.shadowColor=monochrome?'#ffffff':'#ffd500';ctx.shadowBlur=14;
      ctx.beginPath();ctx.arc(r.x,r.y,5+40*(1-(1-t)**2),0,Math.PI*2);ctx.stroke();
      ctx.shadowBlur=0;
      ctx.strokeStyle=(monochrome?'rgba(150,150,150,':'rgba(185,125,255,')+((1-t)*.65)+')';
      ctx.beginPath();ctx.arc(r.x,r.y,2+24*t,0,Math.PI*2);ctx.stroke();
    }
    particles=particles.filter(p=>p.age<p.life);
    for(const p of particles){
      p.age+=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;
      p.vx*=Math.pow(.965,dt);p.vy*=Math.pow(.965,dt);
      ctx.globalAlpha=Math.max(0,1-p.age/p.life);
      ctx.fillStyle=p.color;ctx.shadowColor=p.color;ctx.shadowBlur=9;
      ctx.fillRect(p.x-p.size/2,p.y-p.size/2,p.size,p.size);
    }
    ctx.globalAlpha=1;ctx.shadowBlur=0;
    if(rings.length||particles.length)frame=requestAnimationFrame(draw);

  }

  window.addEventListener('pointerdown',function(e){
    // Keep click effects disabled until the cinematic reboot overlay is gone.
    if(document.getElementById('md-boot'))return;
    if(window.matchMedia('(prefers-reduced-motion: reduce)').matches)return;
    const monochrome=resetOnModeChange();
    const x=e.clientX,y=e.clientY;
    rings.push({x,y,age:0});
    for(let i=0;i<17;i++){
      const angle=Math.random()*Math.PI*2;
      const speed=1.5+Math.random()*3.8;
      particles.push({x,y,vx:Math.cos(angle)*speed,vy:Math.sin(angle)*speed,age:0,life:24+Math.random()*17,color:monochrome?(i%3===0?'#999999':'#ffffff'):(i%3===0?'#bb80ff':'#ffe65c'),size:1.5+Math.random()*2.8});
    }

  },{passive:true,capture:true});
})();
</script>
